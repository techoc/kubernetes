  // SIGTTOU：后台进程写终端信号。
    SIGNAL_SIGTTOU           = 27;
  // SIGURG：紧急数据到达 socket 信号。
    SIGNAL_SIGURG            = 28;
  // SIGUSR1：用户自定义信号 1。
