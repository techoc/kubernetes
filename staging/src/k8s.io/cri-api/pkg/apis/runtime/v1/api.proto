// To regenerate api.pb.go run `hack/update-codegen.sh protobindings`
syntax = "proto3";

package runtime.v1;
option go_package = "k8s.io/cri-api/pkg/apis/runtime/v1";

// Runtime service defines the public APIs for remote container runtimes
// RuntimeService 定义了远程容器运行时需要实现的公共 API，涵盖沙箱、容器、执行/流、统计、事件、配置与检查点等管理操作。
service RuntimeService {
    // Version returns the runtime name, runtime version, and runtime API version.
  // Version RPC：返回容器运行时的名称、版本以及所实现的 CRI API 版本，kubelet 在建立连接时调用以做版本兼容检查。
    rpc Version(VersionRequest) returns (VersionResponse) {}

    // RunPodSandbox creates and starts a pod-level sandbox. Runtimes must ensure
    // the sandbox is in the ready state on success.
  // RunPodSandbox RPC：根据给定的 PodSandboxConfig 创建并启动 pod 级沙箱；运行时必须保证成功后沙箱处于 READY 状态，通常会为沙箱准备网络命名空间等资源。
    rpc RunPodSandbox(RunPodSandboxRequest) returns (RunPodSandboxResponse) {}
    // StopPodSandbox stops any running process that is part of the sandbox and
    // reclaims network resources (e.g., IP addresses) allocated to the sandbox.
    // If there are any running containers in the sandbox, they must be forcibly
    // terminated.
    // This call is idempotent, and must not return an error if all relevant
    // resources have already been reclaimed. kubelet will call StopPodSandbox
    // at least once before calling RemovePodSandbox. It will also attempt to
    // reclaim resources eagerly, as soon as a sandbox is not needed. Hence,
    // multiple StopPodSandbox calls are expected.
  // StopPodSandbox RPC：停止沙箱内所有进程并回收网络资源（如 IP），会强制终止其中仍在运行的容器；该调用是幂等的，kubelet 在 RemovePodSandbox 前至少调用一次，且可能多次调用。
    rpc StopPodSandbox(StopPodSandboxRequest) returns (StopPodSandboxResponse) {}
    // RemovePodSandbox removes the sandbox. If there are any running containers
    // in the sandbox, they must be forcibly terminated and removed.
    // This call is idempotent, and must not return an error if the sandbox has
    // already been removed.
  // RemovePodSandbox RPC：删除沙箱；若其中仍有运行中的容器，必须强制终止并删除；该调用是幂等的，沙箱已不存在时不得返回错误。
    rpc RemovePodSandbox(RemovePodSandboxRequest) returns (RemovePodSandboxResponse) {}
    // PodSandboxStatus returns the status of the PodSandbox. If the PodSandbox is not
    // present, returns an error.
  // PodSandboxStatus RPC：查询单个沙箱的状态；沙箱不存在时返回错误。verbose 为真时 info 字段可携带额外调试信息。
    rpc PodSandboxStatus(PodSandboxStatusRequest) returns (PodSandboxStatusResponse) {}
    // ListPodSandbox returns a list of PodSandboxes.
  // ListPodSandbox RPC：按过滤器列出沙箱的概要信息（PodSandbox 列表）。
    rpc ListPodSandbox(ListPodSandboxRequest) returns (ListPodSandboxResponse) {}
    // StreamPodSandboxes returns a stream of PodSandboxes.
    // This is an alternative to ListPodSandbox that streams results in lists
    // of at least one item, avoiding the gRPC message size limit for nodes with
    // many pods. The number of items per list may vary depending on the
    // container runtime. Each item must appear in exactly one response and must
    // not be duplicated across responses in the same stream. The server must
    // close the stream with EOF after all items have been sent. The kubelet
    // collects all items from the stream and processes them all at once after
    // the stream completes. The kubelet enforces a timeout on the entire stream
    // and will discard partial results if the stream is not completed in time.
    // Feature gate: CRIListStreaming
    // See https://kep.k8s.io/5825 for more details.
  // StreamPodSandboxes RPC：以流式方式分批返回沙箱列表，是 ListPodSandbox 的流式替代方案，用于规避节点上 pod 过多时的 gRPC 消息大小限制。每个条目只出现一次，流结束由服务端以 EOF 关闭；kubelet 会等待流结束后统一处理，并对整个流设置超时，超时则丢弃部分结果。需启用 CRIListStreaming 特性门控。
    rpc StreamPodSandboxes(StreamPodSandboxesRequest) returns (stream StreamPodSandboxesResponse) {}

    // CreateContainer creates a new container in specified PodSandbox
  // CreateContainer RPC：在指定 PodSandbox 中创建一个新容器，容器创建后处于 CREATED 状态、尚未启动进程；返回运行时分配的容器 ID。
    rpc CreateContainer(CreateContainerRequest) returns (CreateContainerResponse) {}
    // StartContainer starts the container.
  // StartContainer RPC：启动已创建的容器，使其进入 RUNNING 状态。
    rpc StartContainer(StartContainerRequest) returns (StartContainerResponse) {}
    // StopContainer stops a running container with a grace period (i.e., timeout).
    // This call is idempotent, and must not return an error if the container has
    // already been stopped.
    // The runtime must forcibly kill the container after the grace period is
    // reached.
  // StopContainer RPC：在指定优雅停机超时（秒）内停止运行中的容器，超时后运行时必须强制杀死容器；该调用是幂等的，容器已停止时不得返回错误。
    rpc StopContainer(StopContainerRequest) returns (StopContainerResponse) {}
    // RemoveContainer removes the container. If the container is running, the
    // container must be forcibly removed.
    // This call is idempotent, and must not return an error if the container has
    // already been removed.
  // RemoveContainer RPC：删除容器；若容器仍在运行必须强制删除；该调用是幂等的，容器已不存在时不得返回错误。
    rpc RemoveContainer(RemoveContainerRequest) returns (RemoveContainerResponse) {}
    // ListContainers lists all containers by filters.
  // ListContainers RPC：按 ContainerFilter 过滤并列出容器。
    rpc ListContainers(ListContainersRequest) returns (ListContainersResponse) {}
    // StreamContainers returns a stream of containers.
    // This is an alternative to ListContainers that streams results in lists
    // of at least one item, avoiding the gRPC message size limit for nodes with
    // many containers. The number of items per list may vary depending on the
    // container runtime. Each item must appear in exactly one response and must
    // not be duplicated across responses in the same stream. The server must
    // close the stream with EOF after all items have been sent. The kubelet
    // collects all items from the stream and processes them all at once after
    // the stream completes. The kubelet enforces a timeout on the entire stream
    // and will discard partial results if the stream is not completed in time.
    // Feature gate: CRIListStreaming
    // See https://kep.k8s.io/5825 for more details.
  // StreamContainers RPC：以流式方式分批返回容器列表，是 ListContainers 的流式替代方案，规避节点上容器过多时的 gRPC 消息大小限制；每个条目只出现一次，服务端以 EOF 结束流，kubelet 对整条流设置超时并统一处理。需启用 CRIListStreaming 特性门控。
    rpc StreamContainers(StreamContainersRequest) returns (stream StreamContainersResponse) {}
    // ContainerStatus returns status of the container. If the container is not
    // present, returns an error.
  // ContainerStatus RPC：查询单个容器的详细状态（含退出码、原因、镜像、资源、用户等）；容器不存在时返回错误。
    rpc ContainerStatus(ContainerStatusRequest) returns (ContainerStatusResponse) {}
    // UpdateContainerResources updates ContainerConfig of the container synchronously.
    // If runtime fails to transactionally update the requested resources, an error is returned.
  // UpdateContainerResources RPC：同步更新容器的资源限制；若运行时无法以事务方式完成更新，应返回错误（即不允许部分生效）。
    rpc UpdateContainerResources(UpdateContainerResourcesRequest) returns (UpdateContainerResourcesResponse) {}
    // ReopenContainerLog asks runtime to reopen the stdout/stderr log file
    // for the container. This is often called after the log file has been
    // rotated. If the container is not running, container runtime can choose
    // to either create a new log file and return nil, or return an error.
    // Once it returns error, new container log file MUST NOT be created.
  // ReopenContainerLog RPC：请求运行时重新打开容器的 stdout/stderr 日志文件，通常在日志轮转后调用；容器未运行时可选择创建新日志文件并返回成功，也可返回错误，但一旦返回错误则绝不能创建新的日志文件。
    rpc ReopenContainerLog(ReopenContainerLogRequest) returns (ReopenContainerLogResponse) {}

    // ExecSync runs a command in a container synchronously.
  // ExecSync RPC：在容器内同步执行一条命令，等待其结束并返回 stdout、stderr（各上限 16MB，超出部分丢弃）与退出码；常用于存活/就绪探针等无需交互的场景。
    rpc ExecSync(ExecSyncRequest) returns (ExecSyncResponse) {}
    // Exec prepares a streaming endpoint to execute a command in the container.
  // Exec RPC：准备一个流式端点（返回 URL），用于以交互方式在容器中执行命令；客户端随后通过该端点传输 stdin/stdout/stderr。
    rpc Exec(ExecRequest) returns (ExecResponse) {}
    // Attach prepares a streaming endpoint to attach to a running container.
  // Attach RPC：准备一个流式端点，用于附加到正在运行的容器的 stdin/stdout/stderr；tty 设置必须与 ContainerConfig 中的一致。
    rpc Attach(AttachRequest) returns (AttachResponse) {}
    // PortForward prepares a streaming endpoint to forward ports from a PodSandbox.
  // PortForward RPC：准备一个流式端点，用于将端口转发到 PodSandbox。
    rpc PortForward(PortForwardRequest) returns (PortForwardResponse) {}

    // ContainerStats returns stats of the container. If the container does not
    // exist, the call returns an error.
  // ContainerStats RPC：返回单个容器的资源使用统计；容器不存在时返回错误。
    rpc ContainerStats(ContainerStatsRequest) returns (ContainerStatsResponse) {}
    // ListContainerStats returns stats of all running containers.
  // ListContainerStats RPC：按过滤器返回所有匹配容器的资源使用统计。
    rpc ListContainerStats(ListContainerStatsRequest) returns (ListContainerStatsResponse) {}
    // StreamContainerStats returns a stream of container stats.
    // This is an alternative to ListContainerStats that streams results in
    // lists of at least one item, avoiding the gRPC message size limit for
    // nodes with many containers. The number of items per list may vary
    // depending on the container runtime. Each item must appear in exactly one
    // response and must not be duplicated across responses in the same stream.
    // The server must close the stream with EOF after all items have been sent.
    // The kubelet collects all items from the stream and processes them all at
    // once after the stream completes. The kubelet enforces a timeout on the
    // entire stream and will discard partial results if the stream is not
    // completed in time.
    // Feature gate: CRIListStreaming
    // See https://kep.k8s.io/5825 for more details.
  // StreamContainerStats RPC：以流式方式分批返回容器统计，是 ListContainerStats 的流式替代方案，规避节点上容器过多时的 gRPC 消息大小限制；每个条目只出现一次，服务端以 EOF 结束流，kubelet 对整条流设置超时并统一处理。需启用 CRIListStreaming 特性门控。
    rpc StreamContainerStats(StreamContainerStatsRequest) returns (stream StreamContainerStatsResponse) {}

    // PodSandboxStats returns stats of the pod sandbox. If the pod sandbox does not
    // exist, the call returns an error.
  // PodSandboxStats RPC：返回单个 pod 沙箱的资源使用统计；沙箱不存在时返回错误。
    rpc PodSandboxStats(PodSandboxStatsRequest) returns (PodSandboxStatsResponse) {}
    // ListPodSandboxStats returns stats of the pod sandboxes matching a filter.
  // ListPodSandboxStats RPC：返回符合过滤条件的 pod 沙箱资源使用统计。
    rpc ListPodSandboxStats(ListPodSandboxStatsRequest) returns (ListPodSandboxStatsResponse) {}
    // StreamPodSandboxStats returns a stream of pod sandbox stats.
    // This is an alternative to ListPodSandboxStats that streams results in
    // lists of at least one item, avoiding the gRPC message size limit for
    // nodes with many pods. The number of items per list may vary depending on
    // the container runtime. Each item must appear in exactly one response and
    // must not be duplicated across responses in the same stream. The server
    // must close the stream with EOF after all items have been sent. The
    // kubelet collects all items from the stream and processes them all at once
    // after the stream completes. The kubelet enforces a timeout on the entire
    // stream and will discard partial results if the stream is not completed
    // in time.
    // Feature gate: CRIListStreaming
    // See https://kep.k8s.io/5825 for more details.
  // StreamPodSandboxStats RPC：以流式方式分批返回 pod 沙箱统计，是 ListPodSandboxStats 的流式替代方案，规避节点上 pod 过多时的 gRPC 消息大小限制；每个条目只出现一次，服务端以 EOF 结束流，kubelet 对整条流设置超时并统一处理。需启用 CRIListStreaming 特性门控。
    rpc StreamPodSandboxStats(StreamPodSandboxStatsRequest) returns (stream StreamPodSandboxStatsResponse) {}

    // UpdateRuntimeConfig updates the runtime configuration based on the given request.
  // UpdateRuntimeConfig RPC：根据请求更新运行时配置（当前主要是 pod CIDR 网络配置）。
    rpc UpdateRuntimeConfig(UpdateRuntimeConfigRequest) returns (UpdateRuntimeConfigResponse) {}

    // Status returns the status of the runtime.
  // Status RPC：返回运行时的当前状态，包括 RuntimeReady/NetworkReady 等条件与特性信息；kubelet 据此判断节点是否就绪。
    rpc Status(StatusRequest) returns (StatusResponse) {}

    // CheckpointContainer checkpoints a container
  // CheckpointContainer RPC：将单个容器检查点导出到指定位置，用于容器状态的保存/恢复。
    rpc CheckpointContainer(CheckpointContainerRequest) returns (CheckpointContainerResponse) {}

    // CheckpointPod creates a Pod-level checkpoint. The caller must set a
    // deadline on the call. If the pod sandbox does not exist, the deadline is
    // exceeded, or the checkpoint operation fails, the call returns an error.
    // The pod sandbox and containers must be running when the call starts. The
    // runtime must pause every selected container before capturing any of
    // them, keep all selected containers paused until every selected
    // container has been captured, and resume all of them before returning on
    // success, error, or deadline expiry. This produces one consistent
    // pod-wide cut while ensuring the runtime never returns a frozen pod.
  // CheckpointPod RPC：对整个 pod（沙箱及选中的容器）创建一致性检查点。调用方必须设置 deadline；沙箱不存在、超时或检查点失败均返回错误。调用开始时沙箱与容器必须处于运行状态；运行时必须在捕获前暂停所有选中的容器，保持暂停直到全部捕获完成，并在成功、失败或超时前恢复全部容器，从而产生一个一致的全 pod 快照且绝不向调用方返回冻结的 pod。
    rpc CheckpointPod(CheckpointPodRequest) returns (CheckpointPodResponse) {}

    // RestorePod prepares a pod sandbox and containers from a checkpoint. The
    // caller must set a deadline on the call. On success, every returned
    // container must be in the CREATED state and must not have executed the
    // restored process; the caller invokes its pre-start hooks and then calls
    // StartContainer for each returned ID. On error, the runtime must remove
    // any sandbox and containers created by the call before returning.
  // RestorePod RPC：根据检查点恢复 pod 沙箱及其容器。调用方必须设置 deadline；成功时返回的所有容器必须处于 CREATED 状态且尚未执行恢复出的进程，由调用方先执行 pre-start hook，再对每个返回的 ID 调用 StartContainer；失败时运行时必须在返回前清理本次调用创建的沙箱与容器。
    rpc RestorePod(RestorePodRequest) returns (RestorePodResponse) {}

    // GetContainerEvents gets container events from the CRI runtime
  // GetContainerEvents RPC：建立一个服务端流，持续从 CRI 运行时接收容器事件（创建/启动/停止/删除），kubelet 借此及时感知容器生命周期变化。
    rpc GetContainerEvents(GetEventsRequest) returns (stream ContainerEventResponse) {}

    // ListMetricDescriptors gets the descriptors for the metrics that will be returned in ListPodSandboxMetrics.
    // This list should be static at startup: either the client and server restart together when
    // adding or removing metrics descriptors, or they should not change.
    // Put differently, if ListPodSandboxMetrics references a name that is not described in the initial
    // ListMetricDescriptors call, then the metric will not be broadcasted.
  // ListMetricDescriptors RPC：返回 ListPodSandboxMetrics 将上报的指标描述符列表。该列表在启动时应当是静态的：增删指标描述符需客户端与服务端一同重启，或保持不变；若指标引用了首次调用未描述的名称，则该指标不会被广播。
    rpc ListMetricDescriptors(ListMetricDescriptorsRequest) returns (ListMetricDescriptorsResponse) {}

    // ListPodSandboxMetrics gets pod sandbox metrics from CRI Runtime
  // ListPodSandboxMetrics RPC：从 CRI 运行时获取各 pod 沙箱的指标。
    rpc ListPodSandboxMetrics(ListPodSandboxMetricsRequest) returns (ListPodSandboxMetricsResponse) {}
    // StreamPodSandboxMetrics returns a stream of pod sandbox metrics.
    // This is an alternative to ListPodSandboxMetrics that streams results in
    // lists of at least one item, avoiding the gRPC message size limit for
    // nodes with many pods. The number of items per list may vary depending on
    // the container runtime. Each item must appear in exactly one response and
    // must not be duplicated across responses in the same stream. The server
    // must close the stream with EOF after all items have been sent. The
    // kubelet collects all items from the stream and processes them all at once
    // after the stream completes. The kubelet enforces a timeout on the entire
    // stream and will discard partial results if the stream is not completed
    // in time.
    // Feature gate: CRIListStreaming
    // See https://kep.k8s.io/5825 for more details.
  // StreamPodSandboxMetrics RPC：以流式方式分批返回 pod 沙箱指标，是 ListPodSandboxMetrics 的流式替代方案，规避节点上 pod 过多时的 gRPC 消息大小限制；每个条目只出现一次，服务端以 EOF 结束流，kubelet 对整条流设置超时并统一处理。需启用 CRIListStreaming 特性门控。
    rpc StreamPodSandboxMetrics(StreamPodSandboxMetricsRequest) returns (stream StreamPodSandboxMetricsResponse) {}

    // RuntimeConfig returns configuration information of the runtime.
    // A couple of notes:
    //   - The RuntimeConfigRequest object is not to be confused with the contents of UpdateRuntimeConfigRequest.
    //     The former is for having runtime tell Kubelet what to do, the latter vice versa.
    //   - It is the expectation of the Kubelet that these fields are static for the lifecycle of the Kubelet.
    //     The Kubelet will not re-request the RuntimeConfiguration after startup, and CRI implementations should
    //     avoid updating them without a full node reboot.
  // RuntimeConfig RPC：返回运行时的配置信息（如 cgroup 驱动）。注意：RuntimeConfigRequest/Response 与 UpdateRuntimeConfigRequest 含义相反——前者由运行时告知 kubelet 该如何做，后者由 kubelet 告知运行时。kubelet 期望这些字段在其生命周期内保持不变，启动时获取一次后不再重新请求，CRI 实现也应避免在没有整节点重启的情况下改动它们。
    rpc RuntimeConfig(RuntimeConfigRequest) returns (RuntimeConfigResponse) {}

    // UpdatePodSandboxResources synchronously updates the PodSandboxConfig with
    // the pod-level resource configuration. This method is called _after_ the
    // Kubelet reconfigures the pod-level cgroups.
    // This request is treated as best effort, and failure will not block the
    // Kubelet with proceeding with a resize.
  // UpdatePodSandboxResources RPC：在 kubelet 重新配置 pod 级 cgroup 之后，同步用 pod 级资源配置更新 PodSandboxConfig。该请求按尽力而为（best effort）处理，失败不会阻塞 kubelet 继续进行 resize。
    rpc UpdatePodSandboxResources(UpdatePodSandboxResourcesRequest) returns (UpdatePodSandboxResourcesResponse) {}
}

// ImageService defines the public APIs for managing images.
// ImageService 定义了管理容器镜像的公共 API，包括列出、查询、拉取、删除镜像以及查询镜像文件系统信息。
service ImageService {
    // ListImages lists existing images.
  // ListImages RPC：列出节点上已有的镜像，可按 ImageFilter 过滤。
    rpc ListImages(ListImagesRequest) returns (ListImagesResponse) {}
    // StreamImages returns a stream of images.
    // This is an alternative to ListImages that streams results in lists of at
    // least one item, avoiding the gRPC message size limit for nodes with many
    // images. The number of items per list may vary depending on the container
    // runtime. Each item must appear in exactly one response and must not be
    // duplicated across responses in the same stream. The server must close the
    // stream with EOF after all items have been sent. The kubelet collects all
    // items from the stream and processes them all at once after the stream
    // completes. The kubelet enforces a timeout on the entire stream and will
    // discard partial results if the stream is not completed in time.
    // Feature gate: CRIListStreaming
    // See https://kep.k8s.io/5825 for more details.
  // StreamImages RPC：以流式方式分批返回镜像列表，是 ListImages 的流式替代方案，规避节点上镜像过多时的 gRPC 消息大小限制；每个条目只出现一次，服务端以 EOF 结束流，kubelet 对整条流设置超时并统一处理。需启用 CRIListStreaming 特性门控。
    rpc StreamImages(StreamImagesRequest) returns (stream StreamImagesResponse) {}
    // ImageStatus returns the status of the image. If the image is not
    // present, returns a response with ImageStatusResponse.Image set to
    // nil.
  // ImageStatus RPC：查询镜像状态；镜像不存在时不报错，而是返回 ImageStatusResponse.Image 为 nil。
    rpc ImageStatus(ImageStatusRequest) returns (ImageStatusResponse) {}
    // PullImage pulls an image with authentication config.
  // PullImage RPC：使用给定的认证配置拉取镜像，返回镜像在本地的唯一引用 image_ref。
    rpc PullImage(PullImageRequest) returns (PullImageResponse) {}
    // RemoveImage removes the image.
    // This call is idempotent, and must not return an error if the image has
    // already been removed.
    // Note that if the image is referenced by multiple tags (even across different repositories
    // if they resolve to the same image digest), removing the image by a single tag
    // will remove all of its tags. For example, if `repo/image:v1` and `another_repo/image:latest`
    // point to the same image, removing `repo/image:v1` will also remove `another_repo/image:latest`.
    // The next call to ListImages, ImageStatus, ImageFsInfo will not return this image.
    // The resources (e.g. disk space) may be cleaned asynchronously
    // and not guaranteed to be cleaned up by the time this method returns.
  // RemoveImage RPC：删除镜像；该调用是幂等的，镜像已不存在时不得返回错误。若一个镜像被多个 tag（即使跨仓库但指向同一 digest）引用，按单个 tag 删除会移除其所有 tag；后续 ListImages/ImageStatus/ImageFsInfo 不会再返回该镜像。底层资源（如磁盘空间）的回收可能是异步的，方法返回时不一定完成。
    rpc RemoveImage(RemoveImageRequest) returns (RemoveImageResponse) {}
    // ImageFSInfo returns information of the filesystem that is used to store images.
    // Usage information may include images that were removed, but are still being cleaned up.
  // ImageFsInfo RPC：返回用于存储镜像的文件系统信息；统计中可能包含已删除但仍在处理中的镜像。
    rpc ImageFsInfo(ImageFsInfoRequest) returns (ImageFsInfoResponse) {}
}

// VersionRequest 是 Version RPC 的请求，携带 kubelet 期望的 CRI API 版本号。
message VersionRequest {
    // Version of the kubelet runtime API.
  // kubelet 使用的 CRI API 版本字符串。
    string version = 1;
}

// VersionResponse 是 Version RPC 的响应，返回运行时的名称、版本与 API 版本信息。
message VersionResponse {
    // Version of the kubelet runtime API.
  // 运行时实现的 CRI API 版本。
    string version = 1;
    // Name of the container runtime.
  // 容器运行时的名称（如 containerd、CRI-O）。
    string runtime_name = 2;
    // Version of the container runtime. The string must be
    // semver-compatible.
  // 容器运行时的版本，必须是符合 semver 规范的字符串。
    string runtime_version = 3;
    // API version of the container runtime. The string must be
    // semver-compatible.
  // 容器运行时支持的 API 版本，必须是符合 semver 规范的字符串。
    string runtime_api_version = 4;
}

// DNSConfig specifies the DNS servers and search domains of a sandbox.
// DNSConfig 描述沙箱使用的 DNS 服务器、搜索域与选项，对应容器内的 /etc/resolv.conf。
message DNSConfig {
    // List of DNS servers of the cluster.
  // 集群的 DNS 服务器地址列表。
    repeated string servers = 1;
    // List of DNS search domains of the cluster.
  // DNS 搜索域列表。
    repeated string searches = 2;
    // List of DNS options. See https://linux.die.net/man/5/resolv.conf
    // for all available options.
  // DNS 选项列表，取值参见 resolv.conf(5) 中可用的 option。
    repeated string options = 3;
}

// Protocol 枚举定义端口映射使用的传输层协议。
enum Protocol {
  // TCP 协议。
    TCP = 0;
  // UDP 协议。
    UDP = 1;
  // SCTP 协议。
    SCTP = 2;
}

// PortMapping specifies the port mapping configurations of a sandbox.
// PortMapping 描述沙箱的端口映射配置，即把容器端口映射到宿主机端口。
message PortMapping {
    // Protocol of the port mapping.
  // 端口映射所使用的协议（TCP/UDP/SCTP）。
    Protocol protocol = 1;
    // Port number within the container. Default: 0 (not specified).
  // 容器内监听的端口号，默认 0 表示未指定。
    int32 container_port = 2;
    // Port number on the host to map the container port to.
    //
    //   - Valid host port range is 1-65535.
    //   - The value 0 has explicit semantic meaning: it indicates NO host port should be allocated.
    //   - The value 0 does NOT indicate dynamic port allocation. Future implementations
    //     of dynamic allocation will use different values/semantics.
    //   - Implementations MUST handle the case where this field is explicitly set to 0,
    //     This field SHOULD be omitted when no port is required.
    //
    // Default: If omitted, container port will not be exposed on the host.
  // 宿主机上映射容器端口的端口号。有效范围 1-65535；0 具有明确语义：表示不分配宿主机端口（并非动态分配），未来实现动态分配会使用不同的取值/语义。运行时必须处理显式设为 0 的情况；不需要端口时应省略该字段，省略时容器端口不会暴露到宿主机。
    int32 host_port = 3;
    // Host IP.
  // 绑定映射的宿主机 IP 地址。
    string host_ip = 4;
}

// MountPropagation 枚举定义挂载传播模式，决定挂载在宿主机与容器之间的传播方向，对应 Linux 的 rprivate/rslave/rshared。
enum MountPropagation {
    // No mount propagation ("rprivate" in Linux terminology).
  // 私有传播：不进行挂载传播（Linux 中的 "rprivate"）。
    PROPAGATION_PRIVATE = 0;
    // Mounts get propagated from the host to the container ("rslave" in Linux).
  // 单向传播：挂载从宿主机传播到容器（Linux 中的 "rslave"）。
    PROPAGATION_HOST_TO_CONTAINER = 1;
    // Mounts get propagated from the host to the container and from the
    // container to the host ("rshared" in Linux).
  // 双向传播：挂载在宿主机与容器之间互相传播（Linux 中的 "rshared"）。
    PROPAGATION_BIDIRECTIONAL = 2;
}

// Mount specifies a host volume to mount into a container.
// Mount 描述一个挂载到容器中的宿主机卷（或镜像卷），是容器文件系统的关键配置。
message Mount {
    // Path of the mount within the container.
  // 挂载点在容器内的路径。
    string container_path = 1;
    // Path of the mount on the host. Has to be empty if the image field below
    // is provided, because those fields are mutually exclusive. If the image
    // field below is nil and the host path doesn't exist, then runtimes should
    // report an error. If the hostpath is a symbolic link, runtimes should
    // follow the symlink and mount the real destination to container.
  // 挂载源在宿主机上的路径。当设置了 image 字段时必须为空，二者互斥；若 image 为空且宿主机路径不存在，运行时应报错；若路径为符号链接，运行时应跟随链接并挂载真实目标。
    string host_path = 2;
    // If set, the mount is read-only.
  // 设为 true 表示该挂载为只读。
    bool readonly = 3;
    // If set, the mount needs SELinux relabeling.
  // 设为 true 表示需要对该挂载进行 SELinux 重新打标签。
    bool selinux_relabel = 4;
    // Requested propagation mode.
  // 请求的挂载传播模式。
    MountPropagation propagation = 5;
    // UidMappings specifies the runtime UID mappings for the mount.
  // 该挂载的运行时 UID 映射列表（用于 user namespace / idmap 挂载）。
    repeated IDMapping uidMappings = 6;
    // GidMappings specifies the runtime GID mappings for the mount.
  // 该挂载的运行时 GID 映射列表（用于 user namespace / idmap 挂载）。
    repeated IDMapping gidMappings = 7;
    // If set to true, the mount is made recursive read-only.
    // In this CRI API, recursive_read_only is a plain true/false boolean, although its equivalent
    // in the Kubernetes core API is a quaternary that can be nil, "Enabled", "IfPossible", or "Disabled".
    // kubelet translates that quaternary value in the core API into a boolean in this CRI API.
    // Remarks:
    // - nil is just treated as false
    // - when set to true, readonly must be explicitly set to true, and propagation must be PRIVATE (0).
    // - (readonly == false && recursive_read_only == false) does not make the mount read-only.
  // 设为 true 表示递归只读挂载。注意：CRI 中该字段是简单布尔值，而 Kubernetes 核心 API 中对应字段是可为 nil/Enabled/IfPossible/Disabled 的四态值，由 kubelet 转换为这里的布尔值。约束：设为 true 时必须显式设置 readonly=true 且 propagation 为 PRIVATE(0)；readonly=false 且 recursive_read_only=false 不会使挂载变为只读。
    bool recursive_read_only = 8;
    // Mount an image reference (image ID, with or without digest), which is a
    // special use case for image volume mounts. If this field is set, then
    // host_path should be unset. All image mounts are per feature definition
    // readonly. The kubelet does an PullImage RPC and evaluates the returned
    // PullImageResponse.image_ref value, which is then set to the
    // ImageSpec.image field. Runtimes are expected to mount the image as
    // required.
    // Introduced in the Image Volume Source KEP: https://kep.k8s.io/4639
  // 以镜像引用（image ID，可带 digest）作为挂载源，用于镜像卷挂载这一特殊场景。设置该字段时 host_path 必须为空；按特性定义，所有镜像挂载均为只读。kubelet 会先调用 PullImage 并用返回的 image_ref 填入 ImageSpec.image，运行时需按要求挂载该镜像。源自 Image Volume Source KEP（https://kep.k8s.io/4639）。
    ImageSpec image = 9;
    // Specific image sub path to be used from inside the image instead of its
    // root, only necessary if the above image field is set. If the sub path is
    // not empty and does not exist in the image, then runtimes should fail and
    // return an error.
    // Introduced in the Image Volume Source KEP beta graduation: https://kep.k8s.io/4639
  // 使用镜像挂载时，指定镜像内部的子路径而非根目录。若子路径非空但在镜像中不存在，运行时应报错。源自 Image Volume Source KEP 的 beta 毕业（https://kep.k8s.io/4639）。
    string image_sub_path = 10;
    // mount_options specifies additional bind mount options (e.g., noexec,
    // nodev, nosuid) that the runtime must apply when mounting this volume
    // into the container. These are passed as OCI mount options.
  // 额外的绑定挂载选项（如 noexec、nodev、nosuid），运行时必须以 OCI 挂载选项的形式应用到该卷。
    repeated string mount_options = 11;
}

// IDMapping describes host to container ID mappings for a pod sandbox.
// IDMapping 描述沙箱/挂载中宿主机与容器之间的 UID/GID 映射关系（用于 user namespace）。
message IDMapping {
    // HostId is the id on the host.
  // 宿主机上的 ID。
    uint32 host_id = 1;
    // ContainerId is the id in the container.
  // 容器内的 ID。
    uint32 container_id = 2;
    // Length is the size of the range to map.
  // 映射范围的长度。
    uint32 length = 3;
}

// A NamespaceMode describes the intended namespace configuration for each
// of the namespaces (Network, PID, IPC) in NamespaceOption. Runtimes should
// map these modes as appropriate for the technology underlying the runtime.
// NamespaceMode 描述容器/沙箱使用 namespace 的模式：POD（与 pod 内所有容器共享）、CONTAINER（仅本容器）、NODE（宿主机节点）、TARGET（复用另一指定容器的 namespace）。
enum NamespaceMode {
    // A POD namespace is common to all containers in a pod.
    // For example, a container with a PID namespace of POD expects to view
    // all of the processes in all of the containers in the pod.
  // POD 模式：namespace 由 pod 内所有容器共享。例如 PID namespace 为 POD 的容器可看到 pod 中所有容器的进程。
    POD       = 0;
    // A CONTAINER namespace is restricted to a single container.
    // For example, a container with a PID namespace of CONTAINER expects to
    // view only the processes in that container.
  // CONTAINER 模式：namespace 仅限于单个容器。例如 PID namespace 为 CONTAINER 的容器只能看到自己的进程。
    CONTAINER = 1;
    // A NODE namespace is the namespace of the Kubernetes node.
    // For example, a container with a PID namespace of NODE expects to view
    // all of the processes on the host running the kubelet.
  // NODE 模式：使用 Kubernetes 节点（宿主机）的 namespace。例如 PID namespace 为 NODE 的容器可看到运行 kubelet 的宿主机上的所有进程。
    NODE      = 2;
    // TARGET targets the namespace of another container. When this is specified,
    // a target_id must be specified in NamespaceOption and refer to a container
    // previously created with NamespaceMode CONTAINER. This containers namespace
    // will be made to match that of container target_id.
    // For example, a container with a PID namespace of TARGET expects to view
    // all of the processes that container target_id can view.
  // TARGET 模式：复用另一个容器的 namespace。指定该模式时必须在 NamespaceOption 中提供 target_id，且该 ID 必须指向一个此前以 CONTAINER 模式创建的容器，本容器的相应 namespace 将与其一致。
    TARGET    = 3;
}

// UserNamespace describes the intended user namespace configuration for a pod sandbox.
// UserNamespace 描述 pod 沙箱的 user namespace 配置，包括模式与 UID/GID 映射。
message UserNamespace {
    // Mode is the NamespaceMode for this UserNamespace.
    // Note: NamespaceMode for UserNamespace currently supports only POD and NODE, not CONTAINER OR TARGET.
  // 该 user namespace 的 NamespaceMode。注意目前仅支持 POD 和 NODE，不支持 CONTAINER 或 TARGET。
    NamespaceMode mode = 1;

    // Uids specifies the UID mappings for the user namespace.
  // user namespace 的 UID 映射列表。
    repeated IDMapping uids = 2;

    // Gids specifies the GID mappings for the user namespace.
  // user namespace 的 GID 映射列表。
    repeated IDMapping gids = 3;
}

// NamespaceOption provides options for Linux namespaces.
// NamespaceOption 提供 Linux namespace 的配置选项，用于沙箱或容器。
message NamespaceOption {
    // Network namespace for this container/sandbox.
    // Note: There is currently no way to set CONTAINER scoped network in the Kubernetes API.
    // Namespaces currently set by the kubelet: POD, NODE
  // 该容器/沙箱的 Network namespace。注意：Kubernetes API 目前无法设置 CONTAINER 级别的网络 namespace；kubelet 当前可设置 POD、NODE。
    NamespaceMode network = 1;
    // PID namespace for this container/sandbox.
    // Note: The CRI default is POD, but the v1.PodSpec default is CONTAINER.
    // The kubelet's runtime manager will set this to CONTAINER explicitly for v1 pods.
    // Namespaces currently set by the kubelet: POD, CONTAINER, NODE, TARGET
  // 该容器/沙箱的 PID namespace。注意：CRI 默认是 POD，而 v1.PodSpec 默认是 CONTAINER，kubelet 的 runtime manager 会为 v1 pod 显式设为 CONTAINER。kubelet 当前可设置 POD、CONTAINER、NODE、TARGET。
    NamespaceMode pid = 2;
    // IPC namespace for this container/sandbox.
    // Note: There is currently no way to set CONTAINER scoped IPC in the Kubernetes API.
    // Namespaces currently set by the kubelet: POD, NODE
  // 该容器/沙箱的 IPC namespace。注意：Kubernetes API 目前无法设置 CONTAINER 级别的 IPC namespace；kubelet 当前可设置 POD、NODE。
    NamespaceMode ipc = 3;
    // Target Container ID for NamespaceMode of TARGET. This container must have been
    // previously created in the same pod. It is not possible to specify different targets
    // for each namespace.
  // 当 namespace 模式为 TARGET 时，指向目标容器的 ID。该容器必须已在同一个 pod 中此前创建；无法为不同 namespace 指定不同目标。
    string target_id = 4;
    // UsernsOptions for this pod sandbox.
    // The Kubelet picks the user namespace configuration to use for the pod sandbox.  The mappings
    // are specified as part of the UserNamespace struct.  If the struct is nil, then the POD mode
    // must be assumed.  This is done for backward compatibility with older Kubelet versions that
    // do not set a user namespace.
  // 该 pod 沙箱的 user namespace 选项。kubelet 选择要使用的配置，映射在 UserNamespace 中指定。若该结构体为 nil，则必须假定为 POD 模式，这是为了兼容不设置 user namespace 的旧版 kubelet。
    UserNamespace userns_options = 5;
}

// SupplementalGroupsPolicy defines how supplemental groups 
// of the first container processes are calculated.
// SupplementalGroupsPolicy 枚举定义容器首个进程的附加组（supplemental groups）如何计算。
enum SupplementalGroupsPolicy {
    // Merge means that the container's provided SupplementalGroups 
    // and FsGroup (specified in SecurityContext) will be merged with 
    // the primary user's groups as defined in the container image
    // (in /etc/group).
  // Merge：将容器提供的 SupplementalGroups 与 SecurityContext 中的 FsGroup，同容器镜像中定义的主用户所属组（/etc/group）合并。
    Merge = 0;
    // Strict means that the container's provided SupplementalGroups
    // and FsGroup (specified in SecurityContext) will be used instead of 
    // any groups defined in the container image.
  // Strict：仅使用容器提供的 SupplementalGroups 与 FsGroup，忽略镜像中定义的任何组。
    Strict = 1;
}

// Int64Value is the wrapper of int64.
// Int64Value 是 int64 的包装类型，用于在 proto 中表达“有值/无值”的标量（nil 表示未设置）。
message Int64Value {
    // The value.
  // int64 值。
    int64 value = 1;
}

// LinuxSandboxSecurityContext holds linux security configuration that will be
// applied to a sandbox. Note that:
// 1) It does not apply to containers in the pods.
// 2) It may not be applicable to a PodSandbox which does not contain any running
//    process.
// LinuxSandboxSecurityContext 保存应用于沙箱（而非 pod 内容器）的 Linux 安全配置；对于不含运行进程的沙箱可能不适用。
message LinuxSandboxSecurityContext {
    // Configurations for the sandbox's namespaces.
    // This will be used only if the PodSandbox uses namespace for isolation.
  // 沙箱的 namespace 配置；仅在 PodSandbox 使用 namespace 隔离时生效。
    NamespaceOption namespace_options = 1;
    // Optional SELinux context to be applied.
  // 可选：要应用的 SELinux 上下文。
    SELinuxOption selinux_options = 2;
    // UID to run sandbox processes as, when applicable.
  // 适用时，沙箱进程以该 UID 运行。
    Int64Value run_as_user = 3;
    // GID to run sandbox processes as, when applicable. run_as_group should only
    // be specified when run_as_user is specified; otherwise, the runtime MUST error.
  // 适用时，沙箱进程以该 GID 运行。仅当设置了 run_as_user 时才能指定，否则运行时必须报错。
    Int64Value run_as_group = 8;
    // If set, the root filesystem of the sandbox is read-only.
  // 设为 true 表示沙箱根文件系统为只读。
    bool readonly_rootfs = 4;
    // List of groups applied to the first process run in each container.
    // supplemental_groups_policy can control how groups will be calculated.
  // 应用于每个容器中运行的首个进程的附加组列表；supplemental_groups_policy 控制其计算方式。
    repeated int64 supplemental_groups = 5;
    // supplemental_groups_policy defines how supplemental groups of the first 
    // container processes are calculated.
    // Valid values are "Merge" and "Strict".
    // If not specified, "Merge" is used.
  // 定义容器首个进程的附加组如何计算，有效值为 "Merge" 和 "Strict"；未指定时默认 "Merge"。
    SupplementalGroupsPolicy supplemental_groups_policy = 11;
    // Indicates whether the sandbox will be asked to run a privileged
    // container. If a privileged container is to be executed within it, this
    // MUST be true.
    // This allows a sandbox to take additional security precautions if no
    // privileged containers are expected to be run.
  // 表示是否会要求该沙箱运行特权容器；若要在其中运行特权容器，此值必须为 true。这样沙箱可在预期没有特权容器时采取额外的安全预防措施。
    bool privileged = 6;
    // Seccomp profile for the sandbox.
  // 沙箱的 seccomp profile。
    SecurityProfile seccomp = 9;
    // AppArmor profile for the sandbox.
  // 沙箱的 AppArmor profile。
    SecurityProfile apparmor = 10;
    // Seccomp profile for the sandbox, candidate values are:
    //   - runtime/default: the default profile for the container runtime
    //   - unconfined: unconfined profile, ie, no seccomp sandboxing
    //   - localhost/<full-path-to-profile>: the profile installed on the node.
    //     <full-path-to-profile> is the full path of the profile.
    //
    // Default: "", which is identical with unconfined.
  // 沙箱的 seccomp profile 路径（已弃用，请改用 seccomp 字段）。候选值：runtime/default（运行时默认 profile）、unconfined（不受限，即无 seccomp 沙箱）、localhost/<完整路径>（节点上安装的 profile）。默认 "" 等同于 unconfined。
    string seccomp_profile_path = 7 [deprecated=true];
}

// A security profile which can be used for sandboxes and containers.
// SecurityProfile 描述可用于沙箱或容器的安全 profile（seccomp / AppArmor）。
message SecurityProfile {
    // Available profile types.
  // ProfileType 枚举定义安全 profile 的来源类型。
    enum ProfileType {
        // The container runtime default profile should be used.
      // 使用容器运行时的默认 profile。
        RuntimeDefault = 0;
        // Disable the feature for the sandbox or the container.
      // 对沙箱或容器禁用该特性（不受限）。
        Unconfined = 1;
        // A pre-defined profile on the node should be used.
      // 使用节点上预定义的 profile。
        Localhost = 2;
    }
    // Indicator which `ProfileType` should be applied.
  // 指示应应用哪种 ProfileType。
    ProfileType profile_type = 1;
    // Indicates that a pre-defined profile on the node should be used.
    // Must only be set if `ProfileType` is `Localhost`.
    // For seccomp, it must be an absolute path to the seccomp profile.
    // For AppArmor, this field is the AppArmor `<profile name>/`
  // 表示使用节点上预定义的 profile，仅当 profile_type 为 Localhost 时才能设置。对 seccomp 必须是 profile 的绝对路径；对 AppArmor 是 <profile name>/。
    string localhost_ref = 2;
}

// LinuxPodSandboxConfig holds platform-specific configurations for Linux
// host platforms and Linux-based containers.
// LinuxPodSandboxConfig 保存 Linux 宿主机平台上基于 Linux 的容器特有的沙箱配置。
message LinuxPodSandboxConfig {
    // Parent cgroup of the PodSandbox.
    // The cgroupfs style syntax will be used, but the container runtime can
    // convert it to systemd semantics if needed.
  // 沙箱的父 cgroup，使用 cgroupfs 风格语法，但运行时可按需转换为 systemd 语义。
    string cgroup_parent = 1;
    // LinuxSandboxSecurityContext holds sandbox security attributes.
  // 沙箱的安全属性。
    LinuxSandboxSecurityContext security_context = 2;
    // Sysctls holds linux sysctls config for the sandbox.
  // 沙箱的 Linux sysctl 配置（键值对）。
    map<string, string> sysctls = 3;
    // Optional overhead represents the overheads associated with this sandbox
  // 可选：与该沙箱关联的开销资源。
    LinuxContainerResources overhead = 4;
    // Optional resources represents the sum of container resources for this sandbox
  // 可选：该沙箱所有容器资源的总和。
    LinuxContainerResources resources = 5;
}

// PodSandboxMetadata holds all necessary information for building the sandbox name.
// The container runtime is encouraged to expose the metadata associated with the
// PodSandbox in its user interface for better user experience. For example,
// the runtime can construct a unique PodSandboxName based on the metadata.
// PodSandboxMetadata 包含构建沙箱名称所需的全部元信息；建议运行时在 UI 中暴露这些元数据（如据此构造唯一的 PodSandboxName）。
message PodSandboxMetadata {
    // Pod name of the sandbox. Same as the pod name in the Pod ObjectMeta.
  // 沙箱的 Pod 名称，与 Pod ObjectMeta 中的 name 相同。
    string name = 1;
    // Pod UID of the sandbox. Same as the pod UID in the Pod ObjectMeta.
  // 沙箱的 Pod UID，与 Pod ObjectMeta 中的 uid 相同。
    string uid = 2;
    // Pod namespace of the sandbox. Same as the pod namespace in the Pod ObjectMeta.
  // 沙箱的 Pod 命名空间，与 Pod ObjectMeta 中的 namespace 相同。
    string namespace = 3;
    // Attempt number of creating the sandbox. Default: 0.
  // 创建沙箱的尝试次数，默认 0。注意：沙箱由 (name, namespace, uid, attempt) 共同唯一标识，重建时 attempt 递增。
    uint32 attempt = 4;
}

// PodSandboxConfig holds all the required and optional fields for creating a
// sandbox.
// PodSandboxConfig 包含创建沙箱所需的全部必填与可选字段。
message PodSandboxConfig {
    // Metadata of the sandbox. This information will uniquely identify the
    // sandbox, and the runtime should leverage this to ensure correct
    // operation. The runtime may also use this information to improve UX, such
    // as by constructing a readable name.
  // 沙箱元数据，用于唯一标识沙箱；运行时应借此保证操作正确，也可据此构造可读名称改善体验。
    PodSandboxMetadata metadata = 1;
    // Hostname of the sandbox. Hostname could only be empty when the pod
    // network namespace is NODE.
  // 沙箱的主机名；仅当 pod 网络 namespace 为 NODE 时才可为空。
    string hostname = 2;
    // Path to the directory on the host in which container log files are
    // stored.
    // By default the log of a container going into the LogDirectory will be
    // hooked up to STDOUT and STDERR. However, the LogDirectory may contain
    // binary log files with structured logging data from the individual
    // containers. For example, the files might be newline separated JSON
    // structured logs, systemd-journald journal files, gRPC trace files, etc.
    // For example:
    //   - PodSandboxConfig.LogDirectory = `/var/log/pods/<NAMESPACE>_<NAME>_<UID>/`
    //   - ContainerConfig.LogPath = `containerName/Instance#.log`
  // 宿主机上存放容器日志文件的目录路径。默认容器日志会连接到 STDOUT/STDERR；该目录也可包含结构化日志的二进制文件（如换行分隔的 JSON、systemd-journald journal、gRPC trace 等）。例如 LogDirectory=/var/log/pods/<NAMESPACE>_<NAME>_<UID>/，ContainerConfig.LogPath=containerName/Instance#.log。
    string log_directory = 3;
    // DNS config for the sandbox.
  // 沙箱的 DNS 配置。
    DNSConfig dns_config = 4;
    // Port mappings for the sandbox.
  // 沙箱的端口映射列表。
    repeated PortMapping port_mappings = 5;
    // Key-value pairs that may be used to scope and select individual resources.
  // 可用于圈定和选择资源的键值对（标签）。
    map<string, string> labels = 6;
    // Unstructured key-value map that may be set by the kubelet to store and
    // retrieve arbitrary metadata. This will include any annotations set on a
    // pod through the Kubernetes API.
    //
    // Annotations MUST NOT be altered by the runtime; the annotations stored
    // here MUST be returned in the PodSandboxStatus associated with the pod
    // this PodSandboxConfig creates.
    //
    // In general, in order to preserve a well-defined interface between the
    // kubelet and the container runtime, annotations SHOULD NOT influence
    // runtime behaviour.
    //
    // Annotations can also be useful for runtime authors to experiment with
    // new features that are opaque to the Kubernetes APIs (both user-facing
    // and the CRI). Whenever possible, however, runtime authors SHOULD
    // consider proposing new typed fields for any new features instead.
  // 非结构化键值对，供 kubelet 存取任意元数据，包括通过 Kubernetes API 设置的 Pod annotations。运行时不得修改 annotations，必须在对应的 PodSandboxStatus 中原样返回。一般 annotations 不应影响运行时行为；运行时作者可用它试验新特性，但应优先提议新增类型化字段。
    map<string, string> annotations = 7;
    // Optional configurations specific to Linux hosts.
  // 可选：Linux 宿主机特有配置。
    LinuxPodSandboxConfig linux = 8;
    // Optional configurations specific to Windows hosts.
  // 可选：Windows 宿主机特有配置。
    WindowsPodSandboxConfig windows = 9;
}

// RunPodSandboxRequest 是 RunPodSandbox RPC 的请求，携带沙箱配置与运行时处理器。
message RunPodSandboxRequest {
    // Configuration for creating a PodSandbox.
  // 创建沙箱所需的配置。
    PodSandboxConfig config = 1;
    // Named runtime configuration to use for this PodSandbox.
    // If the runtime handler is unknown, this request should be rejected.  An
    // empty string should select the default handler, equivalent to the
    // behavior before this feature was added.
    // See https://git.k8s.io/enhancements/keps/sig-node/585-runtime-class
  // 该沙箱使用的具名运行时处理器（对应 RuntimeClass）。未知处理器应拒绝请求；空字符串选择默认处理器，等价于此特性加入前的行为。参见 https://git.k8s.io/enhancements/keps/sig-node/585-runtime-class。
    string runtime_handler = 2;
}

// RunPodSandboxResponse 是 RunPodSandbox RPC 的响应，返回运行时分配的沙箱 ID。
message RunPodSandboxResponse {
    // ID of the PodSandbox to run.
  // 要运行的沙箱的 ID（由运行时生成并返回给 kubelet）。
    string pod_sandbox_id = 1;
}

// StopPodSandboxRequest 是 StopPodSandbox RPC 的请求。
message StopPodSandboxRequest {
    // ID of the PodSandbox to stop.
  // 要停止的沙箱 ID。
    string pod_sandbox_id = 1;
}

// StopPodSandboxResponse 是 StopPodSandbox RPC 的响应，无返回字段（幂等成功即为空）。
message StopPodSandboxResponse {}

// RemovePodSandboxRequest 是 RemovePodSandbox RPC 的请求。
message RemovePodSandboxRequest {
    // ID of the PodSandbox to remove.
  // 要删除的沙箱 ID。
    string pod_sandbox_id = 1;
}

// RemovePodSandboxResponse 是 RemovePodSandbox RPC 的响应，无返回字段。
message RemovePodSandboxResponse {}

// PodSandboxStatusRequest 是 PodSandboxStatus RPC 的请求。
message PodSandboxStatusRequest {
    // ID of the PodSandbox for which to retrieve status.
  // 要查询状态的沙箱 ID。
    string pod_sandbox_id = 1;
    // Verbose indicates whether to return extra information about the pod sandbox.
  // 是否返回额外调试信息（填入响应的 info 字段）。
    bool verbose = 2;
}

// PodIP represents an ip of a Pod
// PodIP 表示 Pod 的一个 IP 地址，用于表达额外的 IP（如双栈 IPv6 地址）。
message PodIP{
    // an ip is a string representation of an IPv4 or an IPv6
  // IP 地址的字符串表示，可以是 IPv4 或 IPv6。
    string ip = 1;
}
// PodSandboxNetworkStatus is the status of the network for a PodSandbox.
// Currently ignored for pods sharing the host networking namespace.
// PodSandboxNetworkStatus 表示沙箱的网络状态；对共享宿主机网络命名空间的 pod 当前会被忽略。
message PodSandboxNetworkStatus {
    // IP address of the PodSandbox.
  // 沙箱的主 IP 地址。
    string ip = 1;
    // list of additional ips (not inclusive of PodSandboxNetworkStatus.Ip) of the PodSandBoxNetworkStatus
  // 沙箱的附加 IP 列表（不包含主 IP 字段中的地址）。
    repeated PodIP additional_ips  = 2;
}

// Namespace contains paths to the namespaces.
// Namespace 包含指向各 namespace 的路径信息。
message Namespace {
    // Namespace options for Linux namespaces.
  // Linux namespace 的选项配置。
    NamespaceOption options = 2;
}

// LinuxSandboxStatus contains status specific to Linux sandboxes.
// LinuxPodSandboxStatus 包含 Linux 沙箱特有的状态信息。
message LinuxPodSandboxStatus {
    // Paths to the sandbox's namespaces.
  // 指向沙箱各 namespace 的路径。
    Namespace namespaces = 1;
}

// PodSandboxState 枚举定义沙箱的运行状态。
enum PodSandboxState {
  // 沙箱就绪（已成功创建并启动）。
    SANDBOX_READY    = 0;
  // 沙箱未就绪。
    SANDBOX_NOTREADY = 1;
}

// PodSandboxStatus contains the status of the PodSandbox.
// PodSandboxStatus 包含沙箱的完整状态信息。
message PodSandboxStatus {
    // ID of the sandbox.
  // 沙箱的 ID。
    string id = 1;
    // Metadata of the sandbox.
  // 沙箱的元数据。
    PodSandboxMetadata metadata = 2;
    // State of the sandbox.
  // 沙箱的状态。
    PodSandboxState state = 3;
    // Creation timestamp of the sandbox in nanoseconds. Must be > 0.
  // 沙箱的创建时间戳，单位为纳秒，必须 > 0。
    int64 created_at = 4;
    // Network contains network status if network is handled by the runtime.
  // 当网络由运行时管理时，包含网络状态。
    PodSandboxNetworkStatus network = 5;
    // Linux-specific status to a pod sandbox.
  // 沙箱特有的 Linux 状态信息。
    LinuxPodSandboxStatus linux = 6;
    // Labels are key-value pairs that may be used to scope and select individual resources.
  // 可用于圈定和选择资源的标签键值对。
    map<string, string> labels = 7;
    // Unstructured key-value map holding arbitrary metadata.
    // Annotations MUST NOT be altered by the runtime; the value of this field
    // MUST be identical to that of the corresponding PodSandboxConfig used to
    // instantiate the pod sandbox this status represents.
  // 非结构化键值对。运行时不得修改，必须与创建该沙箱的 PodSandboxConfig 中的值完全一致。
    map<string, string> annotations = 8;
    // runtime configuration used for this PodSandbox.
  // 该沙箱使用的运行时处理器（RuntimeClass）。
    string runtime_handler = 9;
}

// PodSandboxStatusResponse 是 PodSandboxStatus RPC 的响应，包含状态与可选调试信息。
message PodSandboxStatusResponse {
    // Status of the PodSandbox.
  // 沙箱的状态。
    PodSandboxStatus status = 1;
    // Info is extra information of the PodSandbox. The key could be arbitrary string, and
    // value should be in json format. The information could include anything useful for
    // debug, e.g. network namespace for linux container based container runtime.
    // It should only be returned non-empty when Verbose is true.
  // 沙箱的额外信息，key 为任意字符串、value 应为 JSON 格式，可含调试信息（如 Linux 容器的网络 namespace）。仅当 verbose=true 时才返回非空。
    map<string, string> info = 2;
    // Container statuses
  // 沙箱内各容器的状态列表。
    repeated ContainerStatus containers_statuses = 3;
    // Timestamp in nanoseconds at which container and pod statuses were recorded
  // 容器与 pod 状态被记录的时间戳，单位为纳秒。
    int64 timestamp = 4;
}

// PodSandboxStateValue is the wrapper of PodSandboxState.
// PodSandboxStateValue 是 PodSandboxState 的包装类型，用于过滤器中表达状态条件（区分未设置与具体状态）。
message PodSandboxStateValue {
    // State of the sandbox.
  // 沙箱状态。
    PodSandboxState state = 1;
}

// PodSandboxFilter is used to filter a list of PodSandboxes.
// All those fields are combined with 'AND'
// PodSandboxFilter 用于过滤沙箱列表，所有字段之间按逻辑 AND 组合。
message PodSandboxFilter {
    // ID of the sandbox.
  // 按沙箱 ID 过滤。
    string id = 1;
    // State of the sandbox.
  // 按沙箱状态过滤。
    PodSandboxStateValue state = 2;
    // LabelSelector to select matches.
    // Only api.MatchLabels is supported for now and the requirements
    // are ANDed. MatchExpressions is not supported yet.
  // 按标签选择匹配项。目前仅支持 api.MatchLabels，且条件是 AND 关系；暂不支持 MatchExpressions。
    map<string, string> label_selector = 3;
}

// ListPodSandboxRequest 是 ListPodSandbox RPC 的请求。
message ListPodSandboxRequest {
    // PodSandboxFilter to filter a list of PodSandboxes.
  // 沙箱列表的过滤条件。
    PodSandboxFilter filter = 1;
}


// PodSandbox contains minimal information about a sandbox.
// PodSandbox 包含沙箱的最小概要信息，用于列表类响应。
message PodSandbox {
    // ID of the PodSandbox.
  // 沙箱 ID。
    string id = 1;
    // Metadata of the PodSandbox.
  // 沙箱元数据。
    PodSandboxMetadata metadata = 2;
    // State of the PodSandbox.
  // 沙箱状态。
    PodSandboxState state = 3;
    // Creation timestamps of the PodSandbox in nanoseconds. Must be > 0.
  // 沙箱创建时间戳，单位为纳秒，必须 > 0。
    int64 created_at = 4;
    // Labels of the PodSandbox.
  // 沙箱标签。
    map<string, string> labels = 5;
    // Unstructured key-value map holding arbitrary metadata.
    // Annotations MUST NOT be altered by the runtime; the value of this field
    // MUST be identical to that of the corresponding PodSandboxConfig used to
    // instantiate this PodSandbox.
  // 非结构化元数据。运行时不得修改，必须与创建该沙箱的 PodSandboxConfig 中的值完全一致。
    map<string, string> annotations = 6;
    // runtime configuration used for this PodSandbox.
  // 该沙箱使用的运行时处理器。
    string runtime_handler = 7;
}

// ListPodSandboxResponse 是 ListPodSandbox RPC 的响应。
message ListPodSandboxResponse {
    // List of PodSandboxes.
  // 沙箱列表。
    repeated PodSandbox items = 1;
}

// StreamPodSandboxesRequest 是 StreamPodSandboxes RPC 的请求。
message StreamPodSandboxesRequest {
    // Filter for the list request.
  // 列表请求的过滤条件。
    PodSandboxFilter filter = 1;
}

// StreamPodSandboxesResponse 是 StreamPodSandboxes RPC 流式响应中的一条消息。
message StreamPodSandboxesResponse {
    // List of PodSandboxes.
  // 本批返回的沙箱列表（至少一项）。
    repeated PodSandbox pod_sandboxes = 1;
}

// PodSandboxStatsRequest 是 PodSandboxStats RPC 的请求。
message PodSandboxStatsRequest {
    // ID of the pod sandbox for which to retrieve stats.
  // 要查询统计的沙箱 ID。
    string pod_sandbox_id = 1;
}

// PodSandboxStatsResponse 是 PodSandboxStats RPC 的响应。
message PodSandboxStatsResponse {
  // 该沙箱的资源使用统计。
    PodSandboxStats stats = 1;
}

// PodSandboxStatsFilter is used to filter the list of pod sandboxes to retrieve stats for.
// All those fields are combined with 'AND'.
// PodSandboxStatsFilter 用于过滤要查询统计的沙箱列表，所有字段按 AND 组合。
message PodSandboxStatsFilter {
    // ID of the pod sandbox.
  // 沙箱 ID。
    string id = 1;
    // LabelSelector to select matches.
    // Only api.MatchLabels is supported for now and the requirements
    // are ANDed. MatchExpressions is not supported yet.
  // 按标签选择匹配项。目前仅支持 api.MatchLabels（AND 关系），不支持 MatchExpressions。
    map<string, string> label_selector = 2;
}

// ListPodSandboxStatsRequest 是 ListPodSandboxStats RPC 的请求。
message ListPodSandboxStatsRequest {
    // Filter for the list request.
  // 列表请求的过滤条件。
    PodSandboxStatsFilter filter = 1;
}

// ListPodSandboxStatsResponse 是 ListPodSandboxStats RPC 的响应。
message ListPodSandboxStatsResponse {
    // Stats of the pod sandbox.
  // 沙箱的统计列表。
    repeated PodSandboxStats stats = 1;
}

// StreamPodSandboxStatsRequest 是 StreamPodSandboxStats RPC 的请求。
message StreamPodSandboxStatsRequest {
    // Filter for the list request.
  // 列表请求的过滤条件。
    PodSandboxStatsFilter filter = 1;
}

// StreamPodSandboxStatsResponse 是 StreamPodSandboxStats RPC 流式响应中的一条消息。
message StreamPodSandboxStatsResponse {
    // List of pod sandbox stats.
  // 本批返回的沙箱统计列表（至少一项）。
    repeated PodSandboxStats pod_sandbox_stats = 1;
}

// PodSandboxAttributes provides basic information of the pod sandbox.
// PodSandboxAttributes 提供沙箱的基本标识信息，用于统计数据中关联对象。
message PodSandboxAttributes {
    // ID of the pod sandbox.
  // 沙箱 ID。
    string id = 1;
    // Metadata of the pod sandbox.
  // 沙箱元数据。
    PodSandboxMetadata metadata = 2;
    // Key-value pairs that may be used to scope and select individual resources.
  // 用于圈定和选择资源的标签键值对。
    map<string,string> labels = 3;
    // Unstructured key-value map holding arbitrary metadata.
    // Annotations MUST NOT be altered by the runtime; the value of this field
    // MUST be identical to that of the corresponding PodSandboxStatus used to
    // instantiate the PodSandbox this status represents.
  // 非结构化元数据。运行时不得修改，必须与对应 PodSandboxStatus 中的值完全一致。
    map<string,string> annotations = 4;
}

// PodSandboxStats provides the resource usage statistics for a pod.
// The linux or windows field will be populated depending on the platform.
// PodSandboxStats 提供 pod 的资源使用统计；linux 或 windows 字段按平台填充其一。
message PodSandboxStats {
    // Information of the pod.
  // 该 pod 的基本信息。
    PodSandboxAttributes attributes = 1;
    // Stats from linux.
  // Linux 平台下的统计。
    LinuxPodSandboxStats linux = 2;
    // Stats from windows.
  // Windows 平台下的统计。
    WindowsPodSandboxStats windows = 3;
}

// LinuxPodSandboxStats provides the resource usage statistics for a pod sandbox on linux.
// LinuxPodSandboxStats 提供 Linux 沙箱的资源使用统计。
message LinuxPodSandboxStats {
    // CPU usage gathered for the pod sandbox.
  // 沙箱的 CPU 使用统计。
    CpuUsage cpu = 1;
    // Memory usage gathered for the pod sandbox.
  // 沙箱的内存使用统计。
    MemoryUsage memory = 2;
    // Network usage gathered for the pod sandbox
  // 沙箱的网络使用统计。
    NetworkUsage network = 3;
    // Stats pertaining to processes in the pod sandbox.
  // 沙箱中进程相关的统计。
    ProcessUsage process = 4;
    // Stats of containers in the measured pod sandbox.
  // 该沙箱内各容器的统计。
    repeated ContainerStats containers = 5;
    // IO usage gathered for the pod sandbox.
  // 沙箱的 IO 使用统计（主要用于 PSI）。
    IoUsage io = 6;
}

// WindowsPodSandboxStats provides the resource usage statistics for a pod sandbox on windows
// WindowsPodSandboxStats 提供 Windows 沙箱的资源使用统计。
message WindowsPodSandboxStats {
    // CPU usage gathered for the pod sandbox.
  // 沙箱的 CPU 使用统计（Windows 版）。
    WindowsCpuUsage cpu = 1;
    // Memory usage gathered for the pod sandbox.
  // 沙箱的内存使用统计（Windows 版）。
    WindowsMemoryUsage memory = 2;
    // Network usage gathered for the pod sandbox
  // 沙箱的网络使用统计（Windows 版）。
    WindowsNetworkUsage network = 3;
    // Stats pertaining to processes in the pod sandbox.
  // 沙箱中进程相关的统计（Windows 版）。
    WindowsProcessUsage process = 4;
    // Stats of containers in the measured pod sandbox.
  // 该沙箱内各容器的统计（Windows 版）。
    repeated WindowsContainerStats containers = 5;
}

// NetworkUsage contains data about network resources.
// NetworkUsage 包含网络资源的使用数据。
message NetworkUsage {
    // Timestamp in nanoseconds at which the information were collected. Must be > 0.
  // 采集该信息的时间戳，单位为纳秒，必须 > 0。
    int64 timestamp = 1;
    // Stats for the default network interface.
  // 默认网络接口的统计。
    NetworkInterfaceUsage default_interface = 2;
    // Stats for all found network interfaces, excluding the default.
  // 除默认接口外，其余所有网络接口的统计。
    repeated NetworkInterfaceUsage interfaces = 3;
}

// WindowsNetworkUsage contains data about network resources specific to Windows.
// WindowsNetworkUsage 包含 Windows 特有的网络资源使用数据。
message WindowsNetworkUsage {
    // Timestamp in nanoseconds at which the information were collected. Must be > 0.
  // 采集该信息的时间戳，单位为纳秒，必须 > 0。
    int64 timestamp = 1;
    // Stats for the default network interface.
  // 默认网络接口的统计（Windows 版）。
    WindowsNetworkInterfaceUsage default_interface = 2;
    // Stats for all found network interfaces, excluding the default.
  // 除默认接口外，其余网络接口的统计（Windows 版）。
    repeated WindowsNetworkInterfaceUsage interfaces = 3;
}

// NetworkInterfaceUsage contains resource value data about a network interface.
// NetworkInterfaceUsage 包含单个网络接口的资源数据（累计计数）。
message NetworkInterfaceUsage {
    // The name of the network interface.
  // 网络接口名称。
    string name = 1;
    // Cumulative count of bytes received.
  // 累计接收字节数。
    UInt64Value rx_bytes = 2;
    // Cumulative count of receive errors encountered.
  // 累计接收错误数。
    UInt64Value rx_errors = 3;
    // Cumulative count of bytes transmitted.
  // 累计发送字节数。
    UInt64Value tx_bytes = 4;
    // Cumulative count of transmit errors encountered.
  // 累计发送错误数。
    UInt64Value tx_errors = 5;
}

// WindowsNetworkInterfaceUsage contains resource value data about a network interface specific for Windows.
// WindowsNetworkInterfaceUsage 包含 Windows 单个网络接口的资源数据。
message WindowsNetworkInterfaceUsage {
    // The name of the network interface.
  // 网络接口名称。
    string name = 1;
    // Cumulative count of bytes received.
  // 累计接收字节数。
    UInt64Value rx_bytes = 2;
    // Cumulative count of receive errors encountered.
  // Windows 下累计丢弃的接收包数。
    UInt64Value rx_packets_dropped = 3;
    // Cumulative count of bytes transmitted.
  // 累计发送字节数。
    UInt64Value tx_bytes = 4;
    // Cumulative count of transmit errors encountered.
  // Windows 下累计丢弃的发送包数。
    UInt64Value tx_packets_dropped = 5;
}

// ProcessUsage are stats pertaining to processes.
// ProcessUsage 包含进程相关的统计。
message ProcessUsage {
    // Timestamp in nanoseconds at which the information were collected. Must be > 0.
  // 采集该信息的时间戳，单位为纳秒，必须 > 0。
    int64 timestamp = 1;
    // Number of processes.
  // 进程数量。
    UInt64Value process_count = 2;
}

// WindowsProcessUsage are stats pertaining to processes specific to Windows.
// WindowsProcessUsage 包含 Windows 特有的进程相关统计。
message WindowsProcessUsage {
    // Timestamp in nanoseconds at which the information were collected. Must be > 0.
  // 采集该信息的时间戳，单位为纳秒，必须 > 0。
    int64 timestamp = 1;
    // Number of processes.
  // 进程数量。
    UInt64Value process_count = 2;
}

// ImageSpec is an internal representation of an image.
// ImageSpec 是镜像的内部表示形式，被容器创建、镜像查询等多处 RPC 复用。
message ImageSpec {
    // Container's Image field (e.g. imageID or imageDigest).
  // 容器的镜像字段（如 imageID 或 imageDigest）。
    string image = 1;
    // Unstructured key-value map holding arbitrary metadata.
    // ImageSpec Annotations can be used to help the runtime target specific
    // images in multi-arch images.
  // 非结构化键值对，可帮助运行时在多架构镜像中定位特定镜像。
    map<string, string> annotations = 2;
    // The container image reference specified by the user (e.g. image[:tag] or digest).
    // Only set if available within the RPC context.
  // 用户指定的镜像引用（如 image[:tag] 或 digest），仅在 RPC 上下文中可获取时设置。
    string user_specified_image = 18;
    // Runtime handler to use for pulling the image.
    // If the runtime handler is unknown, the request should be rejected.
    // An empty string would select the default runtime handler.
  // 拉取镜像时使用的运行时处理器；未知处理器应拒绝请求，空字符串选择默认处理器。
    string runtime_handler = 19;
    // The digest of the image used for this volume.
    // It should have a value that's similar to the pod's status.containerStatuses[i].imageID.
  // 该卷所用镜像的 digest 引用，取值应与 pod status.containerStatuses[i].imageID 类似。
    string image_ref = 20;
}

// KeyValue 表示一个字符串键到字节值的映射，用于容器环境变量等场景。
message KeyValue {
  // 键。
    string key = 1;
  // 值（字节序列）。
    bytes value = 2;
}

// LinuxContainerResources specifies Linux specific configuration for
// resources.
// LinuxContainerResources 指定 Linux 容器/沙箱的资源配置。默认值 0 或空字符串通常表示“未指定”。
message LinuxContainerResources {
    // CPU CFS (Completely Fair Scheduler) period. Default: 0 (not specified).
  // CPU CFS（完全公平调度器）周期，默认 0 表示未指定。
    int64 cpu_period = 1;
    // CPU CFS (Completely Fair Scheduler) quota. Default: 0 (not specified).
  // CPU CFS 配额，默认 0 表示未指定。
    int64 cpu_quota = 2;
    // CPU shares (relative weight vs. other containers). Default: 0 (not specified).
  // CPU 份额（相对权重）；默认 0 表示未指定。
    int64 cpu_shares = 3;
    // Memory limit in bytes. Default: 0 (not specified).
  // 内存限制，单位字节；默认 0 表示未指定。
    int64 memory_limit_in_bytes = 4;
    // OOMScoreAdj adjusts the oom-killer score. Default: 0 (not specified).
  // 调整 OOM killer 的评分；默认 0 表示未指定。
    int64 oom_score_adj = 5;
    // CpusetCpus constrains the allowed set of logical CPUs. Default: "" (not specified).
  // 限制允许使用的逻辑 CPU 集合；默认 "" 表示未指定。
    string cpuset_cpus = 6;
    // CpusetMems constrains the allowed set of memory nodes. Default: "" (not specified).
  // 限制允许使用的内存节点集合；默认 "" 表示未指定。
    string cpuset_mems = 7;
    // List of HugepageLimits to limit the HugeTLB usage of container per page size. Default: nil (not specified).
  // 按页大小限制容器 HugeTLB 使用量的 HugepageLimit 列表；默认 nil 表示未指定。
    repeated HugepageLimit hugepage_limits = 8;
    // Unified resources for cgroup v2. Default: nil (not specified).
    // Each key/value in the map refers to the cgroup v2.
    // e.g. "memory.max": "6937202688" or "io.weight": "default 100".
  // cgroup v2 的统一资源配置，每个键值对对应一个 cgroup v2 控制项，如 "memory.max": "6937202688" 或 "io.weight": "default 100"；默认 nil 表示未指定。
    map<string, string> unified = 9;
    // Memory swap limit in bytes. Default 0 (not specified).
  // 内存交换（swap）限制，单位字节；默认 0 表示未指定。
    int64 memory_swap_limit_in_bytes = 10;
}

// HugepageLimit corresponds to the file`hugetlb.<hugepagesize>.limit_in_byte` in container level cgroup.
// For example, `PageSize=1GB`, `Limit=1073741824` means setting `1073741824` bytes to hugetlb.1GB.limit_in_bytes.
// HugepageLimit 对应容器级 cgroup 文件 hugetlb.<hugepagesize>.limit_in_bytes，例如 PageSize=1GB、Limit=1073741824 表示设置 hugetlb.1GB.limit_in_bytes 为 1073741824 字节。
message HugepageLimit {
    // The value of PageSize has the format <size><unit-prefix>B (2MB, 1GB),
    // and must match the <hugepagesize> of the corresponding control file found in `hugetlb.<hugepagesize>.limit_in_bytes`.
    // The values of <unit-prefix> are intended to be parsed using base 1024("1KB" = 1024, "1MB" = 1048576, etc).
  // 页大小，格式为 <size><unit-prefix>B（如 2MB、1GB），必须与 hugetlb.<hugepagesize>.limit_in_bytes 中的 <hugepagesize> 匹配；单位前缀按 1024 进制解析（1KB=1024，1MB=1048576 等）。
    string page_size = 1;
    // limit in bytes of hugepagesize HugeTLB usage.
  // 该巨页大小对应的 HugeTLB 使用上限，单位字节。
    uint64 limit = 2;
}

// SELinuxOption are the labels to be applied to the container.
// SELinuxOption 描述要应用到容器的 SELinux 标签（user/role/type/level）。
message SELinuxOption {
  // SELinux 用户（user）。
    string user = 1;
  // SELinux 角色（role）。
    string role = 2;
  // SELinux 类型（type）。
    string type = 3;
  // SELinux 级别（level）。
    string level = 4;
}

// Capability contains the container capabilities to add or drop
// Dropping a capability will drop it from all sets.
// If a capability is added to only the add_capabilities list then it gets added to permitted,
// inheritable, effective and bounding sets, i.e. all sets except the ambient set.
// If a capability is added to only the add_ambient_capabilities list then it gets added to all sets, i.e permitted
// inheritable, effective, bounding and ambient sets.
// If a capability is added to add_capabilities and add_ambient_capabilities lists then it gets added to all sets, i.e.
// permitted, inheritable, effective, bounding and ambient sets.
// Capability 描述容器要添加或删除的 Linux capabilities；删除会从所有集合中移除，添加行为因 add_capabilities / add_ambient_capabilities 而异（详见上方英文注释）。
message Capability {
    // List of capabilities to add.
  // 要添加的 capability 列表（加入 permitted、inheritable、effective、bounding 集合，但不加入 ambient）。
    repeated string add_capabilities = 1;
    // List of capabilities to drop.
  // 要删除的 capability 列表（从所有集合中删除）。
    repeated string drop_capabilities = 2;
    // List of ambient capabilities to add.
  // 要添加的 ambient capability 列表（加入包括 ambient 在内的所有集合）。
    repeated string add_ambient_capabilities = 3;
}

// LinuxContainerSecurityContext holds linux security configuration that will be applied to a container.
// LinuxContainerSecurityContext 保存应用于容器的 Linux 安全配置。
message LinuxContainerSecurityContext {
    // Capabilities to add or drop.
  // 要添加/删除的 capabilities。
    Capability capabilities = 1;
    // If set, run container in privileged mode.
    // Privileged mode is incompatible with the following options. If
    // privileged is set, the following features MAY have no effect:
    // 1. capabilities
    // 2. selinux_options
    // 4. seccomp
    // 5. apparmor
    //
    // Privileged mode implies the following specific options are applied:
    // 1. All capabilities are added.
    // 2. Sensitive paths, such as kernel module paths within sysfs, are not masked.
    // 3. Any sysfs and procfs mounts are mounted RW.
    // 4. AppArmor confinement is not applied.
    // 5. Seccomp restrictions are not applied.
    // 6. The device cgroup does not restrict access to any devices.
    // 7. All devices from the host's /dev are available within the container.
    // 8. SELinux restrictions are not applied (e.g. label=disabled).
  // 设为 true 表示以特权模式运行容器。特权模式与 capabilities、selinux_options、seccomp、apparmor 等选项不兼容，这些选项可能无效；特权模式隐含：添加所有 capabilities、不屏蔽敏感路径、sysfs/procfs 可写、不应用 AppArmor/SELinux/seccomp 限制、设备 cgroup 不限制访问、宿主机 /dev 下所有设备可用等。
    bool privileged = 2;
    // Configurations for the container's namespaces.
    // Only used if the container uses namespace for isolation.
  // 容器的 namespace 配置，仅在容器使用 namespace 隔离时生效。
    NamespaceOption namespace_options = 3;
    // SELinux context to be optionally applied.
  // 可选：要应用的 SELinux 上下文。
    SELinuxOption selinux_options = 4;
    // UID to run the container process as. Only one of run_as_user and
    // run_as_username can be specified at a time.
  // 容器进程以该 UID 运行；只能与 run_as_username 二选一。
    Int64Value run_as_user = 5;
    // GID to run the container process as. run_as_group should only be specified
    // when run_as_user or run_as_username is specified; otherwise, the runtime
    // MUST error.
  // 容器进程以该 GID 运行；仅当指定了 run_as_user 或 run_as_username 时才能设置，否则运行时必须报错。
    Int64Value run_as_group = 12;
    // User name to run the container process as. If specified, the user MUST
    // exist in the container image (i.e. in the /etc/passwd inside the image),
    // and be resolved there by the runtime; otherwise, the runtime MUST error.
  // 容器进程以该用户名运行；若设置，用户必须存在于容器镜像中（镜像内 /etc/passwd）并由运行时解析，否则必须报错。
    string run_as_username = 6;
    // If set, the root filesystem of the container is read-only.
  // 设为 true 表示容器根文件系统为只读。
    bool readonly_rootfs = 7;
    // List of groups applied to the first process run in each container.
    // supplemental_groups_policy can control how groups will be calculated.
  // 应用于容器首个进程的附加组列表，计算方式由 supplemental_groups_policy 控制。
    repeated int64 supplemental_groups = 8;
    // supplemental_groups_policy defines how supplemental groups of the first 
    // container processes are calculated.
    // Valid values are "Merge" and "Strict".
    // If not specified, "Merge" is used.
  // 定义容器首个进程的附加组如何计算，有效值 "Merge"/"Strict"，默认 "Merge"。
    SupplementalGroupsPolicy supplemental_groups_policy = 17;
    // no_new_privs defines if the flag for no_new_privs should be set on the
    // container.
  // 定义是否为容器设置 no_new_privs 标志（禁止进程通过 exec 获得新权限）。
    bool no_new_privs = 11;
    // masked_paths is a slice of paths that should be masked by the container
    // runtime, this can be passed directly to the OCI spec.
  // 需要被运行时屏蔽的路径列表，可直接传给 OCI spec。
    repeated string masked_paths = 13;
    // readonly_paths is a slice of paths that should be set as readonly by the
    // container runtime, this can be passed directly to the OCI spec.
  // 需要被运行时设为只读的路径列表，可直接传给 OCI spec。
    repeated string readonly_paths = 14;
    // Seccomp profile for the container.
  // 容器的 seccomp profile。
    SecurityProfile seccomp = 15;
    // AppArmor profile for the container.
  // 容器的 AppArmor profile。
    SecurityProfile apparmor = 16;
    // AppArmor profile for the container, candidate values are:
    //   - runtime/default: equivalent to not specifying a profile.
    //   - unconfined: no profiles are loaded
    //   - localhost/<profile_name>: profile loaded on the node
    //     (localhost) by name. The possible profile names are detailed at
    //     https://gitlab.com/apparmor/apparmor/-/wikis/AppArmor_Core_Policy_Reference
  // 容器的 AppArmor profile 字符串（已弃用，请改用 apparmor 字段）。候选值：runtime/default（等同未指定）、unconfined（不加载 profile）、localhost/<profile_name>（节点上按名称加载的 profile）。
    string apparmor_profile = 9 [deprecated=true];
    // Seccomp profile for the container, candidate values are:
    //   - runtime/default: the default profile for the container runtime
    //   - unconfined: unconfined profile, ie, no seccomp sandboxing
    //   - localhost/<full-path-to-profile>: the profile installed on the node.
    //     <full-path-to-profile> is the full path of the profile.
    //
    // Default: "", which is identical with unconfined.
  // 容器的 seccomp profile 路径（已弃用，请改用 seccomp 字段）。候选值：runtime/default、unconfined、localhost/<完整路径>；默认 "" 等同 unconfined。
    string seccomp_profile_path = 10 [deprecated=true];
}

// LinuxContainerConfig contains platform-specific configuration for
// Linux-based containers.
// LinuxContainerConfig 包含基于 Linux 的容器的平台特有配置。
message LinuxContainerConfig {
    // Resources specification for the container.
  // 容器的资源配置。
    LinuxContainerResources resources = 1;
    // LinuxContainerSecurityContext configuration for the container.
  // 容器的 Linux 安全上下文配置。
    LinuxContainerSecurityContext security_context = 2;
}

// LinuxContainerUser 描述容器首个进程初始附加的用户身份（uid、gid、附加组）。
message LinuxContainerUser {
    // uid is the primary uid initially attached to the first process in the container
  // 容器首个进程初始的主 UID。
    int64 uid = 1;
    // gid is the primary gid initially attached to the first process in the container
  // 容器首个进程初始的主 GID。
    int64 gid = 2;
    // supplemental_groups are the supplemental groups initially attached to the first process in the container
  // 容器首个进程初始的附加组列表。
    repeated int64 supplemental_groups = 3;
}

// WindowsNamespaceOption provides options for Windows namespaces.
// WindowsNamespaceOption 提供 Windows namespace 的配置选项。
message WindowsNamespaceOption {
    // Network namespace for this container/sandbox.
    // This is currently never set by the kubelet
  // 该容器/沙箱的 Network namespace；kubelet 目前从不设置该字段。
    NamespaceMode network = 1;
}

// WindowsSandboxSecurityContext holds platform-specific configurations that will be
// applied to a sandbox.
// These settings will only apply to the sandbox container.
// WindowsSandboxSecurityContext 保存应用于沙箱的 Windows 平台特有安全配置，仅作用于沙箱容器。
message WindowsSandboxSecurityContext {
    // User name to run the container process as. If specified, the user MUST
    // exist in the container image and be resolved there by the runtime;
    // otherwise, the runtime MUST return error.
  // 以该用户名运行容器进程；若设置，用户必须存在于镜像中并由运行时解析，否则必须报错。
    string run_as_username = 1;

    // The contents of the GMSA credential spec to use to run this container.
  // 运行该容器使用的 GMSA 凭据规范内容。
    string credential_spec = 2;

    // Indicates whether the container requested to run as a HostProcess container.
  // 表示该容器是否请求以 HostProcess 容器方式运行。
    bool host_process = 3;

    // Configuration for the sandbox's namespaces
  // 沙箱的 namespace 配置。
    WindowsNamespaceOption namespace_options = 4;
}

// WindowsPodSandboxConfig holds platform-specific configurations for Windows
// host platforms and Windows-based containers.
// WindowsPodSandboxConfig 保存 Windows 宿主机平台上基于 Windows 的容器特有的沙箱配置。
message WindowsPodSandboxConfig {
    // WindowsSandboxSecurityContext holds sandbox security attributes.
  // 沙箱的安全属性。
    WindowsSandboxSecurityContext security_context = 1;
}

// WindowsContainerSecurityContext holds windows security configuration that will be applied to a container.
// WindowsContainerSecurityContext 保存应用于容器的 Windows 安全配置。
message WindowsContainerSecurityContext {
    // User name to run the container process as. If specified, the user MUST
    // exist in the container image and be resolved there by the runtime;
    // otherwise, the runtime MUST return error.
  // 以该用户名运行容器进程；若设置，用户必须存在于镜像中并由运行时解析，否则必须报错。
    string run_as_username = 1;

    // The contents of the GMSA credential spec to use to run this container.
  // 运行该容器使用的 GMSA 凭据规范内容。
    string credential_spec = 2;

    // Indicates whether a container is to be run as a HostProcess container.
  // 表示该容器是否以 HostProcess 容器方式运行。
    bool host_process = 3;
}

// WindowsContainerConfig contains platform-specific configuration for
// Windows-based containers.
// WindowsContainerConfig 包含基于 Windows 的容器的平台特有配置。
message WindowsContainerConfig {
    // Resources specification for the container.
  // 容器的资源配置。
    WindowsContainerResources resources = 1;
    // WindowsContainerSecurityContext configuration for the container.
  // 容器的 Windows 安全上下文配置。
    WindowsContainerSecurityContext security_context = 2;
}

// WindowsContainerResources specifies Windows specific configuration for
// resources.
// WindowsContainerResources 指定 Windows 容器的资源配置。
message WindowsContainerResources {
    // CPU shares (relative weight vs. other containers). Default: 0 (not specified).
  // CPU 份额（相对权重）；默认 0 表示未指定。
    int64 cpu_shares = 1;
    // Number of CPUs available to the container. Default: 0 (not specified).
  // 容器可用的 CPU 数量；默认 0 表示未指定。
    int64 cpu_count = 2;
    // Specifies the portion of processor cycles that this container can use as a percentage times 100.
  // 容器可使用的处理器周期比例，以百分比乘 100 表示（如 5000 表示 50%）。
    int64 cpu_maximum = 3;
    // Memory limit in bytes. Default: 0 (not specified).
  // 内存限制，单位字节；默认 0 表示未指定。
    int64 memory_limit_in_bytes = 4;
    // Specifies the size of the rootfs / scratch space in bytes to be configured for this container. Default: 0 (not specified).
  // 为该容器配置的 rootfs/scratch 空间大小，单位字节；默认 0 表示未指定。
    int64 rootfs_size_in_bytes = 5;
    // Optionally specifies the set of CPUs to affinitize for this container.
  // 可选：指定该容器要亲和的 CPU 集合。
    repeated WindowsCpuGroupAffinity affinity_cpus = 6;
}

// WindowsCpuGroupAffinity specifies the CPU mask and group to affinitize.
// This is similar to the following _GROUP_AFFINITY structure:
// https://learn.microsoft.com/en-us/windows-hardware/drivers/ddi/miniport/ns-miniport-_group_affinity
// WindowsCpuGroupAffinity 指定 CPU 掩码与所属的处理器组，类似 Windows 的 _GROUP_AFFINITY 结构。
message WindowsCpuGroupAffinity {
    // CPU mask relative to this CPU group.
  // 相对于该 CPU 组的 CPU 掩码。
    uint64 cpu_mask = 1;
    // Processor group the mask refers to, as returned by
    // GetLogicalProcessorInformationEx.
  // 掩码所指的处理器组编号，由 GetLogicalProcessorInformationEx 返回。
    uint32 cpu_group = 2;
}

// ContainerMetadata holds all necessary information for building the container
// name. The container runtime is encouraged to expose the metadata in its user
// interface for better user experience. E.g., runtime can construct a unique
// container name based on the metadata. Note that (name, attempt) is unique
// within a sandbox for the entire lifetime of the sandbox.
// ContainerMetadata 包含构建容器名称所需的元信息；建议在 UI 中暴露。注意：(name, attempt) 在沙箱整个生命周期内唯一。
message ContainerMetadata {
    // Name of the container. Same as the container name in the PodSpec.
  // 容器名称，与 PodSpec 中的容器名相同。
    string name = 1;
    // Attempt number of creating the container. Default: 0.
  // 创建该容器的尝试次数，默认 0。
    uint32 attempt = 2;
}

// Device specifies a host device to mount into a container.
// Device 描述要挂载到容器中的宿主机设备。
message Device {
    // Path of the device within the container.
  // 设备在容器内的路径。
    string container_path = 1;
    // Path of the device on the host.
  // 设备在宿主机上的路径。
    string host_path = 2;
    // Cgroups permissions of the device, candidates are one or more of
    // * r - allows container to read from the specified device.
    // * w - allows container to write to the specified device.
    // * m - allows container to create device files that do not yet exist.
  // 设备的 cgroup 权限，可取一个或多个：r（读）、w（写）、m（创建尚不存在的设备文件）。
    string permissions = 3;
}

// CDIDevice specifies a CDI device information.
// CDIDevice 描述 CDI（Container Device Interface）设备信息。
message CDIDevice {
    // Fully qualified CDI device name
    // for example: vendor.com/gpu=gpudevice1
    // see more details in the CDI specification:
    // https://github.com/container-orchestrated-devices/container-device-interface/blob/main/SPEC.md
  // 完全限定的 CDI 设备名，如 vendor.com/gpu=gpudevice1；详见 CDI 规范。
    string name = 1;
}

// ContainerConfig holds all the required and optional fields for creating a
// container.
// ContainerConfig 包含创建容器所需的全部必填与可选字段。
message ContainerConfig {
    // Metadata of the container. This information will uniquely identify the
    // container, and the runtime should leverage this to ensure correct
    // operation. The runtime may also use this information to improve UX, such
    // as by constructing a readable name.
  // 容器元数据，唯一标识容器；运行时应借此保证操作正确并可用于构造可读名称。
    ContainerMetadata metadata = 1 ;
    // Image to use.
  // 要使用的镜像。
    ImageSpec image = 2;
    // Command to execute (i.e., entrypoint for docker)
  // 要执行的命令（即 Docker 中的 entrypoint）。
    repeated string command = 3;
    // Args for the Command (i.e., command for docker)
  // 命令的参数（即 Docker 中的 cmd）。
    repeated string args = 4;
    // Current working directory of the command.
  // 命令的当前工作目录。
    string working_dir = 5;
    // List of environment variable to set in the container.
  // 要在容器中设置的环境变量列表。
    repeated KeyValue envs = 6;
    // Mounts for the container.
  // 容器的挂载列表。
    repeated Mount mounts = 7;
    // Devices for the container.
  // 容器的设备列表。
    repeated Device devices = 8;
    // Key-value pairs that may be used to scope and select individual resources.
    // Label keys are of the form:
    //   - label-key ::= prefixed-name | name
    //   - prefixed-name ::= prefix '/' name
    //   - prefix ::= DNS_SUBDOMAIN
    //   - name ::= DNS_LABEL
  // 用于圈定和选择资源的标签键值对。键的格式：prefixed-name（prefix '/' name）或 name；prefix 为 DNS_SUBDOMAIN，name 为 DNS_LABEL。
    map<string, string> labels = 9;
    // Unstructured key-value map that may be used by the kubelet to store and
    // retrieve arbitrary metadata.
    //
    // Annotations MUST NOT be altered by the runtime; the annotations stored
    // here MUST be returned in the ContainerStatus associated with the container
    // this ContainerConfig creates.
    //
    // In general, in order to preserve a well-defined interface between the
    // kubelet and the container runtime, annotations SHOULD NOT influence
    // runtime behaviour.
  // 非结构化键值对，供 kubelet 存取任意元数据。运行时不得修改，必须在对应的 ContainerStatus 中原样返回；一般不应影响运行时行为。
    map<string, string> annotations = 10;
    // Path relative to PodSandboxConfig.LogDirectory for container to store
    // the log (STDOUT and STDERR) on the host.
    // For example:
    //   - PodSandboxConfig.LogDirectory = `/var/log/pods/<NAMESPACE>_<NAME>_<UID>/`
    //   - ContainerConfig.LogPath = `containerName/Instance#.log`
  // 容器日志文件在宿主机上相对 PodSandboxConfig.LogDirectory 的路径（STDOUT/STDERR）。例如 LogDirectory=/var/log/pods/<NAMESPACE>_<NAME>_<UID>/、LogPath=containerName/Instance#.log。
    string log_path = 11;

    // Variables for interactive containers, these have very specialized
    // use-cases (e.g. debugging).
  // 交互式容器相关变量，用于非常特殊的场景（如调试）：是否开启 stdin。
    bool stdin = 12;
  // 是否仅附加一次 stdin 后即关闭（交互式容器专用）。
    bool stdin_once = 13;
  // 是否分配 TTY（交互式容器专用）。
    bool tty = 14;

    // Configuration specific to Linux containers.
  // Linux 容器特有配置。
    LinuxContainerConfig linux = 15;
    // Configuration specific to Windows containers.
  // Windows 容器特有配置。
    WindowsContainerConfig windows = 16;

    // CDI devices for the container.
  // 容器的 CDI 设备列表。
    repeated CDIDevice CDI_devices = 17;

    // The custom stop signal for the container
  // 用于终止容器的自定义停止信号。
    Signal stop_signal = 18;
}

// Signal 枚举定义用于终止容器的 POSIX 信号集合，供 ContainerConfig.stop_signal 使用。
enum Signal {
  // 使用容器运行时的默认停止信号（通常为 SIGTERM）。
    SIGNAL_RUNTIME_DEFAULT   = 0;
  // SIGABRT：异常终止信号。
    SIGNAL_SIGABRT           = 1;
  // SIGALRM：闹钟信号。
    SIGNAL_SIGALRM           = 2;
  // SIGBUS：总线错误信号。
    SIGNAL_SIGBUS            = 3;
  // SIGCHLD：子进程状态改变信号。
    SIGNAL_SIGCHLD           = 4;
  // SIGCLD：SIGCHLD 的别名。
    SIGNAL_SIGCLD            = 5;
  // SIGCONT：继续运行信号。
    SIGNAL_SIGCONT           = 6;
  // SIGFPE：浮点异常信号。
    SIGNAL_SIGFPE            = 7;
  // SIGHUP：挂断信号。
    SIGNAL_SIGHUP            = 8;
  // SIGILL：非法指令信号。
    SIGNAL_SIGILL            = 9;
  // SIGINT：中断信号（Ctrl-C）。
    SIGNAL_SIGINT            = 10;
  // SIGIO：异步 IO 事件信号。
    SIGNAL_SIGIO             = 11;
  // SIGIOT：IOT 陷阱信号（SIGABRT 的别名）。
