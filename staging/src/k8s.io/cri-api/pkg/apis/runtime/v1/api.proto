  // SIGRTMIN+5：相对 SIGRTMIN 偏移 5 的实时信号。
    SIGNAL_SIGRTMINPLUS5     = 40;
  // SIGRTMIN+6：相对 SIGRTMIN 偏移 6 的实时信号。
    SIGNAL_SIGRTMINPLUS6     = 41;
  // SIGRTMIN+7：相对 SIGRTMIN 偏移 7 的实时信号。
    SIGNAL_SIGRTMINPLUS7     = 42;
  // SIGRTMIN+8：相对 SIGRTMIN 偏移 8 的实时信号。
    SIGNAL_SIGRTMINPLUS8     = 43;
  // SIGRTMIN+9：相对 SIGRTMIN 偏移 9 的实时信号。
    SIGNAL_SIGRTMINPLUS9     = 44;
