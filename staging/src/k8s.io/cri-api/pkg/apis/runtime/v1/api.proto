  // SIGRTMIN+2：相对 SIGRTMIN 偏移 2 的实时信号。
    SIGNAL_SIGRTMINPLUS2     = 37;
  // SIGRTMIN+3：相对 SIGRTMIN 偏移 3 的实时信号。
    SIGNAL_SIGRTMINPLUS3     = 38;
  // SIGRTMIN+4：相对 SIGRTMIN 偏移 4 的实时信号。
