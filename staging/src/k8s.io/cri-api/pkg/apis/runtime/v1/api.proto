// 重新生成 api.pb.go 时，运行 `hack/update-codegen.sh protobindings`。
syntax = "proto3";

package runtime.v1;
option go_package = "k8s.io/cri-api/pkg/apis/runtime/v1";

// RuntimeService 定义了远程容器运行时需要实现的公共 API，涵盖沙箱、容器、执行/流、统计、事件、配置与检查点等管理操作。
service RuntimeService {
  // Version RPC：返回容器运行时的名称、版本以及所实现的 CRI API 版本，kubelet 在建立连接时调用以做版本兼容检查。
    rpc Version(VersionRequest) returns (VersionResponse) {}

  // RunPodSandbox RPC：根据给定的 PodSandboxConfig 创建并启动 pod 级沙箱；运行时必须保证成功后沙箱处于 READY 状态，通常会为沙箱准备网络命名空间等资源。
    rpc RunPodSandbox(RunPodSandboxRequest) returns (RunPodSandboxResponse) {}
  // StopPodSandbox RPC：停止沙箱内所有进程并回收网络资源（如 IP），强制终止其中仍在运行的容器。
  // 该调用是幂等的；相关资源已全部回收时不得返回错误。kubelet 在 RemovePodSandbox 前至少调用一次，
  // 并会在沙箱不再需要时尽早回收资源，因此可能多次调用。
    rpc StopPodSandbox(StopPodSandboxRequest) returns (StopPodSandboxResponse) {}
  // RemovePodSandbox RPC：删除沙箱；若其中仍有运行中的容器，必须强制终止并删除；该调用是幂等的，沙箱已不存在时不得返回错误。
    rpc RemovePodSandbox(RemovePodSandboxRequest) returns (RemovePodSandboxResponse) {}
  // PodSandboxStatus RPC：查询单个沙箱的状态；沙箱不存在时返回错误。verbose 为真时 info 字段可携带额外调试信息。
    rpc PodSandboxStatus(PodSandboxStatusRequest) returns (PodSandboxStatusResponse) {}
  // ListPodSandbox RPC：按过滤器列出沙箱的概要信息（PodSandbox 列表）。
    rpc ListPodSandbox(ListPodSandboxRequest) returns (ListPodSandboxResponse) {}
  // StreamPodSandboxes RPC：以流式方式分批返回沙箱列表，是 ListPodSandbox 的流式替代方案，
  // 用于规避节点上 pod 过多时的 gRPC 消息大小限制。每批至少一项，批量大小由运行时决定。
  // 每个条目在整条流中只能出现一次，不得跨响应重复；服务端发送全部条目后以 EOF 关闭流。
  // kubelet 收集全部条目，并在流完成后统一处理；kubelet 对整个流设置超时，未及时完成时丢弃部分结果。
  // 特性门控：CRIListStreaming。参见 https://kep.k8s.io/5825。
    rpc StreamPodSandboxes(StreamPodSandboxesRequest) returns (stream StreamPodSandboxesResponse) {}

  // CreateContainer RPC：在指定 PodSandbox 中创建一个新容器，容器创建后处于 CREATED 状态、尚未启动进程；返回运行时分配的容器 ID。
    rpc CreateContainer(CreateContainerRequest) returns (CreateContainerResponse) {}
  // StartContainer RPC：启动已创建的容器，使其进入 RUNNING 状态。
    rpc StartContainer(StartContainerRequest) returns (StartContainerResponse) {}
  // StopContainer RPC：在指定优雅停机超时（秒）内停止运行中的容器，超时后运行时必须强制杀死容器；该调用是幂等的，容器已停止时不得返回错误。
    rpc StopContainer(StopContainerRequest) returns (StopContainerResponse) {}
  // RemoveContainer RPC：删除容器；若容器仍在运行必须强制删除；该调用是幂等的，容器已不存在时不得返回错误。
    rpc RemoveContainer(RemoveContainerRequest) returns (RemoveContainerResponse) {}
  // ListContainers RPC：按 ContainerFilter 过滤并列出容器。
    rpc ListContainers(ListContainersRequest) returns (ListContainersResponse) {}
  // StreamContainers RPC：以流式方式分批返回容器列表，是 ListContainers 的流式替代方案，
  // 用于规避节点上容器过多时的 gRPC 消息大小限制。每批至少一项，批量大小由运行时决定。
  // 每个条目在整条流中只能出现一次，不得跨响应重复；服务端发送全部条目后以 EOF 关闭流。
  // kubelet 收集全部条目，并在流完成后统一处理；kubelet 对整个流设置超时，未及时完成时丢弃部分结果。
  // 特性门控：CRIListStreaming。参见 https://kep.k8s.io/5825。
    rpc StreamContainers(StreamContainersRequest) returns (stream StreamContainersResponse) {}
  // ContainerStatus RPC：查询单个容器的详细状态（含退出码、原因、镜像、资源、用户等）；容器不存在时返回错误。
    rpc ContainerStatus(ContainerStatusRequest) returns (ContainerStatusResponse) {}
  // UpdateContainerResources RPC：同步更新容器的资源限制；若运行时无法以事务方式完成更新，应返回错误（即不允许部分生效）。
    rpc UpdateContainerResources(UpdateContainerResourcesRequest) returns (UpdateContainerResourcesResponse) {}
  // ReopenContainerLog RPC：请求运行时重新打开容器的 stdout/stderr 日志文件，通常在日志轮转后调用；容器未运行时可选择创建新日志文件并返回成功，也可返回错误，但一旦返回错误则绝不能创建新的日志文件。
    rpc ReopenContainerLog(ReopenContainerLogRequest) returns (ReopenContainerLogResponse) {}

  // ExecSync RPC：在容器内同步执行一条命令，等待其结束并返回 stdout、stderr（各上限 16MB，超出部分丢弃）与退出码；常用于存活/就绪探针等无需交互的场景。
    rpc ExecSync(ExecSyncRequest) returns (ExecSyncResponse) {}
  // Exec RPC：准备一个流式端点（返回 URL），用于以交互方式在容器中执行命令；客户端随后通过该端点传输 stdin/stdout/stderr。
    rpc Exec(ExecRequest) returns (ExecResponse) {}
  // Attach RPC：准备一个流式端点，用于附加到正在运行的容器的 stdin/stdout/stderr；tty 设置必须与 ContainerConfig 中的一致。
    rpc Attach(AttachRequest) returns (AttachResponse) {}
  // PortForward RPC：准备一个流式端点，用于将端口转发到 PodSandbox。
    rpc PortForward(PortForwardRequest) returns (PortForwardResponse) {}

  // ContainerStats RPC：返回单个容器的资源使用统计；容器不存在时返回错误。
    rpc ContainerStats(ContainerStatsRequest) returns (ContainerStatsResponse) {}
  // ListContainerStats RPC：按过滤器返回所有运行中且匹配的容器的资源使用统计。
    rpc ListContainerStats(ListContainerStatsRequest) returns (ListContainerStatsResponse) {}
  // StreamContainerStats RPC：以流式方式分批返回容器统计，是 ListContainerStats 的流式替代方案，
  // 用于规避节点上容器过多时的 gRPC 消息大小限制。每批至少一项，批量大小由运行时决定。
  // 每个条目在整条流中只能出现一次，不得跨响应重复；服务端发送全部条目后以 EOF 关闭流。
  // kubelet 收集全部条目，并在流完成后统一处理；kubelet 对整个流设置超时，未及时完成时丢弃部分结果。
  // 特性门控：CRIListStreaming。参见 https://kep.k8s.io/5825。
    rpc StreamContainerStats(StreamContainerStatsRequest) returns (stream StreamContainerStatsResponse) {}

  // PodSandboxStats RPC：返回单个 pod 沙箱的资源使用统计；沙箱不存在时返回错误。
    rpc PodSandboxStats(PodSandboxStatsRequest) returns (PodSandboxStatsResponse) {}
  // ListPodSandboxStats RPC：返回符合过滤条件的 pod 沙箱资源使用统计。
    rpc ListPodSandboxStats(ListPodSandboxStatsRequest) returns (ListPodSandboxStatsResponse) {}
  // StreamPodSandboxStats RPC：以流式方式分批返回 pod 沙箱统计，是 ListPodSandboxStats 的流式替代方案，
  // 用于规避节点上 pod 过多时的 gRPC 消息大小限制。每批至少一项，批量大小由运行时决定。
  // 每个条目在整条流中只能出现一次，不得跨响应重复；服务端发送全部条目后以 EOF 关闭流。
  // kubelet 收集全部条目，并在流完成后统一处理；kubelet 对整个流设置超时，未及时完成时丢弃部分结果。
  // 特性门控：CRIListStreaming。参见 https://kep.k8s.io/5825。
    rpc StreamPodSandboxStats(StreamPodSandboxStatsRequest) returns (stream StreamPodSandboxStatsResponse) {}

  // UpdateRuntimeConfig RPC：根据请求更新运行时配置（当前主要是 pod CIDR 网络配置）。
    rpc UpdateRuntimeConfig(UpdateRuntimeConfigRequest) returns (UpdateRuntimeConfigResponse) {}

  // Status RPC：返回运行时的当前状态，包括 RuntimeReady/NetworkReady 等条件与特性信息；kubelet 据此判断节点是否就绪。
    rpc Status(StatusRequest) returns (StatusResponse) {}

  // CheckpointContainer RPC：将单个容器检查点导出到指定位置，用于容器状态的保存/恢复。
    rpc CheckpointContainer(CheckpointContainerRequest) returns (CheckpointContainerResponse) {}

  // CheckpointPod RPC：对整个 pod（沙箱及选中的容器）创建一致性检查点。调用方必须设置截止时间；沙箱不存在、超时或检查点失败均返回错误。调用开始时沙箱与容器必须处于运行状态；运行时必须在捕获前暂停所有选中的容器，保持暂停直到全部捕获完成，并在成功、失败或超时前恢复全部容器，从而产生一个一致的全 pod 快照且绝不向调用方返回冻结的 pod。
    rpc CheckpointPod(CheckpointPodRequest) returns (CheckpointPodResponse) {}

  // RestorePod RPC：根据检查点恢复 pod 沙箱及其容器。调用方必须设置截止时间；成功时返回的所有容器必须处于 CREATED 状态且尚未执行恢复出的进程，由调用方先执行启动前钩子，再对每个返回的 ID 调用 StartContainer；失败时运行时必须在返回前清理本次调用创建的沙箱与容器。
    rpc RestorePod(RestorePodRequest) returns (RestorePodResponse) {}

  // GetContainerEvents RPC：建立一个服务端流，持续从 CRI 运行时接收容器事件（创建/启动/停止/删除），kubelet 借此及时感知容器生命周期变化。
    rpc GetContainerEvents(GetEventsRequest) returns (stream ContainerEventResponse) {}

  // ListMetricDescriptors RPC：返回 ListPodSandboxMetrics 将上报的指标描述符列表。该列表在启动时应当是静态的：增删指标描述符需客户端与服务端一同重启，或保持不变；若指标引用了首次调用未描述的名称，则该指标不会被广播。
    rpc ListMetricDescriptors(ListMetricDescriptorsRequest) returns (ListMetricDescriptorsResponse) {}

  // ListPodSandboxMetrics RPC：从 CRI 运行时获取各 pod 沙箱的指标。
    rpc ListPodSandboxMetrics(ListPodSandboxMetricsRequest) returns (ListPodSandboxMetricsResponse) {}
  // StreamPodSandboxMetrics RPC：以流式方式分批返回 pod 沙箱指标，是 ListPodSandboxMetrics 的流式替代方案，
  // 用于规避节点上 pod 过多时的 gRPC 消息大小限制。每批至少一项，批量大小由运行时决定。
  // 每个条目在整条流中只能出现一次，不得跨响应重复；服务端发送全部条目后以 EOF 关闭流。
  // kubelet 收集全部条目，并在流完成后统一处理；kubelet 对整个流设置超时，未及时完成时丢弃部分结果。
  // 特性门控：CRIListStreaming。参见 https://kep.k8s.io/5825。
    rpc StreamPodSandboxMetrics(StreamPodSandboxMetricsRequest) returns (stream StreamPodSandboxMetricsResponse) {}

  // RuntimeConfig RPC：返回运行时的配置信息（如 cgroup 驱动）。注意：RuntimeConfigRequest/Response 与 UpdateRuntimeConfigRequest 含义相反——前者由运行时告知 kubelet 该如何做，后者由 kubelet 告知运行时。kubelet 期望这些字段在其生命周期内保持不变，启动时获取一次后不再重新请求，CRI 实现也应避免在没有整节点重启的情况下改动它们。
    rpc RuntimeConfig(RuntimeConfigRequest) returns (RuntimeConfigResponse) {}

  // UpdatePodSandboxResources RPC：在 kubelet 重新配置 pod 级 cgroup 之后，同步用 pod 级资源配置更新 PodSandboxConfig。该请求按尽力而为处理，失败不会阻塞 kubelet 继续调整资源。
    rpc UpdatePodSandboxResources(UpdatePodSandboxResourcesRequest) returns (UpdatePodSandboxResourcesResponse) {}
}

// ImageService 定义了管理容器镜像的公共 API，包括列出、查询、拉取、删除镜像以及查询镜像文件系统信息。
service ImageService {
  // ListImages RPC：列出节点上已有的镜像，可按 ImageFilter 过滤。
    rpc ListImages(ListImagesRequest) returns (ListImagesResponse) {}
  // StreamImages RPC：以流式方式分批返回镜像列表，是 ListImages 的流式替代方案，
  // 用于规避节点上镜像过多时的 gRPC 消息大小限制。每批至少一项，批量大小由运行时决定。
  // 每个条目在整条流中只能出现一次，不得跨响应重复；服务端发送全部条目后以 EOF 关闭流。
  // kubelet 收集全部条目，并在流完成后统一处理；kubelet 对整个流设置超时，未及时完成时丢弃部分结果。
  // 特性门控：CRIListStreaming。参见 https://kep.k8s.io/5825。
    rpc StreamImages(StreamImagesRequest) returns (stream StreamImagesResponse) {}
  // ImageStatus RPC：查询镜像状态；镜像不存在时不报错，而是返回 ImageStatusResponse.Image 为 nil。
    rpc ImageStatus(ImageStatusRequest) returns (ImageStatusResponse) {}
  // PullImage RPC：使用给定的认证配置拉取镜像，返回镜像在本地的唯一引用 image_ref。
    rpc PullImage(PullImageRequest) returns (PullImageResponse) {}
  // RemoveImage RPC：删除镜像；该调用是幂等的，镜像已不存在时不得返回错误。若一个镜像被多个 tag（即使跨仓库但指向同一 digest）引用，按单个 tag 删除会移除其所有 tag，例如删除 `repo/image:v1` 也会删除指向同一镜像的 `another_repo/image:latest`。
  // 后续 ListImages/ImageStatus/ImageFsInfo 不会再返回该镜像。底层资源（如磁盘空间）的回收可能是异步的，方法返回时不一定完成。
    rpc RemoveImage(RemoveImageRequest) returns (RemoveImageResponse) {}
  // ImageFsInfo RPC：返回用于存储镜像的文件系统信息；统计中可能包含已删除但仍在清理中的镜像。
    rpc ImageFsInfo(ImageFsInfoRequest) returns (ImageFsInfoResponse) {}
}

// VersionRequest 是 Version RPC 的请求，携带 kubelet 期望的 CRI API 版本号。
message VersionRequest {
  // kubelet 使用的 CRI API 版本字符串。
    string version = 1;
}

// VersionResponse 是 Version RPC 的响应，返回运行时的名称、版本与 API 版本信息。
message VersionResponse {
  // 运行时实现的 CRI API 版本。
    string version = 1;
  // 容器运行时的名称（如 containerd、CRI-O）。
    string runtime_name = 2;
  // 容器运行时的版本，必须是符合 semver 规范的字符串。
    string runtime_version = 3;
  // 容器运行时支持的 API 版本，必须是符合 semver 规范的字符串。
    string runtime_api_version = 4;
}

// DNSConfig 描述沙箱使用的 DNS 服务器、搜索域与选项，对应容器内的 /etc/resolv.conf。
message DNSConfig {
  // 集群的 DNS 服务器地址列表。
    repeated string servers = 1;
  // DNS 搜索域列表。
    repeated string searches = 2;
  // DNS 选项列表，可选值参见 https://linux.die.net/man/5/resolv.conf。
    repeated string options = 3;
}

// Protocol 枚举定义端口映射使用的传输层协议。
enum Protocol {
  // TCP 协议。
    TCP = 0;
  // UDP 协议。
    UDP = 1;
  // SCTP 协议。
    SCTP = 2;
}

// PortMapping 描述沙箱的端口映射配置，即把容器端口映射到宿主机端口。
message PortMapping {
  // 端口映射所使用的协议（TCP/UDP/SCTP）。
    Protocol protocol = 1;
  // 容器内监听的端口号，默认 0 表示未指定。
    int32 container_port = 2;
  // 宿主机上映射容器端口的端口号。有效范围 1-65535；0 具有明确语义：表示不分配宿主机端口（并非动态分配），未来实现动态分配会使用不同的取值/语义。运行时必须处理显式设为 0 的情况；不需要端口时应省略该字段，省略时容器端口不会暴露到宿主机。
    int32 host_port = 3;
  // 绑定映射的宿主机 IP 地址。
    string host_ip = 4;
}

// MountPropagation 枚举定义挂载传播模式，决定挂载在宿主机与容器之间的传播方向，对应 Linux 的 rprivate/rslave/rshared。
enum MountPropagation {
  // 私有传播：不进行挂载传播（Linux 中的 "rprivate"）。
    PROPAGATION_PRIVATE = 0;
  // 单向传播：挂载从宿主机传播到容器（Linux 中的 "rslave"）。
    PROPAGATION_HOST_TO_CONTAINER = 1;
  // 双向传播：挂载在宿主机与容器之间互相传播（Linux 中的 "rshared"）。
    PROPAGATION_BIDIRECTIONAL = 2;
}

// Mount 描述一个挂载到容器中的宿主机卷（或镜像卷），是容器文件系统的关键配置。
message Mount {
  // 挂载点在容器内的路径。
    string container_path = 1;
  // 挂载源在宿主机上的路径。当设置了 image 字段时必须为空，二者互斥；若 image 为空且宿主机路径不存在，运行时应报错；若路径为符号链接，运行时应跟随链接并挂载真实目标。
    string host_path = 2;
  // 设为 true 表示该挂载为只读。
    bool readonly = 3;
  // 设为 true 表示需要对该挂载进行 SELinux 重新打标签。
    bool selinux_relabel = 4;
  // 请求的挂载传播模式。
    MountPropagation propagation = 5;
  // 该挂载的运行时 UID 映射列表（用于 user namespace / idmap 挂载）。
    repeated IDMapping uidMappings = 6;
  // 该挂载的运行时 GID 映射列表（用于 user namespace / idmap 挂载）。
    repeated IDMapping gidMappings = 7;
  // 设为 true 表示递归只读挂载。注意：CRI 中该字段是简单布尔值，而 Kubernetes 核心 API 中对应字段是可为 nil/Enabled/IfPossible/Disabled 的四态值，由 kubelet 转换为这里的布尔值，其中 nil 视为 false。
  // 约束：设为 true 时必须显式设置 readonly=true 且 propagation 为 PRIVATE(0)；readonly=false 且 recursive_read_only=false 不会使挂载变为只读。
    bool recursive_read_only = 8;
  // 以镜像引用（image ID，可带 digest）作为挂载源，用于镜像卷挂载这一特殊场景。设置该字段时 host_path 必须为空；按特性定义，所有镜像挂载均为只读。kubelet 会先调用 PullImage 并用返回的 image_ref 填入 ImageSpec.image，运行时需按要求挂载该镜像。源自 Image Volume Source KEP（https://kep.k8s.io/4639）。
    ImageSpec image = 9;
  // 使用镜像挂载时，指定镜像内部的子路径而非根目录。若子路径非空但在镜像中不存在，运行时应报错。源自 Image Volume Source KEP 的 beta 毕业（https://kep.k8s.io/4639）。
    string image_sub_path = 10;
  // 额外的绑定挂载选项（如 noexec、nodev、nosuid），运行时必须以 OCI 挂载选项的形式应用到该卷。
    repeated string mount_options = 11;
}

// IDMapping 描述沙箱/挂载中宿主机与容器之间的 UID/GID 映射关系（用于 user namespace）。
message IDMapping {
  // 宿主机上的 ID。
    uint32 host_id = 1;
  // 容器内的 ID。
    uint32 container_id = 2;
  // 映射范围的长度。
    uint32 length = 3;
}

// NamespaceMode 描述容器/沙箱使用 namespace 的模式：POD（与 pod 内所有容器共享）、CONTAINER（仅本容器）、NODE（宿主机节点）、TARGET（复用另一指定容器的 namespace）。
enum NamespaceMode {
  // POD 模式：namespace 由 pod 内所有容器共享。例如 PID namespace 为 POD 的容器可看到 pod 中所有容器的进程。
    POD       = 0;
  // CONTAINER 模式：namespace 仅限于单个容器。例如 PID namespace 为 CONTAINER 的容器只能看到自己的进程。
    CONTAINER = 1;
  // NODE 模式：使用 Kubernetes 节点（宿主机）的 namespace。例如 PID namespace 为 NODE 的容器可看到运行 kubelet 的宿主机上的所有进程。
    NODE      = 2;
  // TARGET 模式：复用另一个容器的 namespace。指定该模式时必须在 NamespaceOption 中提供 target_id，且该 ID 必须指向一个此前以 CONTAINER 模式创建的容器，本容器的相应 namespace 将与其一致。
    TARGET    = 3;
}

// UserNamespace 描述 pod 沙箱的 user namespace 配置，包括模式与 UID/GID 映射。
message UserNamespace {
  // 该 user namespace 的 NamespaceMode。注意目前仅支持 POD 和 NODE，不支持 CONTAINER 或 TARGET。
    NamespaceMode mode = 1;

  // user namespace 的 UID 映射列表。
    repeated IDMapping uids = 2;

  // user namespace 的 GID 映射列表。
    repeated IDMapping gids = 3;
}

// NamespaceOption 提供 Linux namespace 的配置选项，用于沙箱或容器。
message NamespaceOption {
  // 该容器/沙箱的网络 namespace。注意：Kubernetes API 目前无法设置 CONTAINER 级别的网络 namespace；kubelet 当前可设置 POD、NODE。
    NamespaceMode network = 1;
  // 该容器/沙箱的 PID namespace。注意：CRI 默认是 POD，而 v1.PodSpec 默认是 CONTAINER，kubelet 的运行时管理器会为 v1 pod 显式设为 CONTAINER。kubelet 当前可设置 POD、CONTAINER、NODE、TARGET。
    NamespaceMode pid = 2;
  // 该容器/沙箱的 IPC namespace。注意：Kubernetes API 目前无法设置 CONTAINER 级别的 IPC namespace；kubelet 当前可设置 POD、NODE。
    NamespaceMode ipc = 3;
  // 当 namespace 模式为 TARGET 时，指向目标容器的 ID。该容器必须已在同一个 pod 中此前创建；无法为不同 namespace 指定不同目标。
    string target_id = 4;
  // 该 pod 沙箱的 user namespace 选项。kubelet 选择要使用的配置，映射在 UserNamespace 中指定。若该结构体为 nil，则必须假定为 POD 模式，这是为了兼容不设置 user namespace 的旧版 kubelet。
    UserNamespace userns_options = 5;
}

// SupplementalGroupsPolicy 枚举定义容器首个进程的附加组如何计算。
enum SupplementalGroupsPolicy {
  // Merge：将容器提供的 SupplementalGroups 与 SecurityContext 中的 FsGroup，同容器镜像中定义的主用户所属组（/etc/group）合并。
    Merge = 0;
  // Strict：仅使用容器提供的 SupplementalGroups 与 FsGroup，忽略镜像中定义的任何组。
    Strict = 1;
}

// Int64Value 是 int64 的包装类型，用于在 proto 中表达“有值/无值”的标量（nil 表示未设置）。
message Int64Value {
  // int64 值。
    int64 value = 1;
}

// LinuxSandboxSecurityContext 保存应用于沙箱（而非 pod 内容器）的 Linux 安全配置；对于不含运行进程的沙箱可能不适用。
message LinuxSandboxSecurityContext {
  // 沙箱的 namespace 配置；仅在 PodSandbox 使用 namespace 隔离时生效。
    NamespaceOption namespace_options = 1;
  // 可选：要应用的 SELinux 上下文。
    SELinuxOption selinux_options = 2;
  // 适用时，沙箱进程以该 UID 运行。
    Int64Value run_as_user = 3;
  // 适用时，沙箱进程以该 GID 运行。仅当设置了 run_as_user 时才能指定，否则运行时必须报错。
    Int64Value run_as_group = 8;
  // 设为 true 表示沙箱根文件系统为只读。
    bool readonly_rootfs = 4;
  // 应用于每个容器中运行的首个进程的附加组列表；supplemental_groups_policy 控制其计算方式。
    repeated int64 supplemental_groups = 5;
  // 定义容器首个进程的附加组如何计算，有效值为 "Merge" 和 "Strict"；未指定时默认 "Merge"。
    SupplementalGroupsPolicy supplemental_groups_policy = 11;
  // 表示是否会要求该沙箱运行特权容器；若要在其中运行特权容器，此值必须为 true。这样沙箱可在预期没有特权容器时采取额外的安全预防措施。
    bool privileged = 6;
  // 沙箱的 seccomp profile。
    SecurityProfile seccomp = 9;
  // 沙箱的 AppArmor profile。
    SecurityProfile apparmor = 10;
  // 沙箱的 seccomp profile 路径（已弃用，请改用 seccomp 字段）。候选值：runtime/default（运行时默认 profile）、unconfined（不受限，即无 seccomp 沙箱）、localhost/<完整路径>（节点上安装的 profile）。默认 "" 等同于 unconfined。
    string seccomp_profile_path = 7 [deprecated=true];
}

// SecurityProfile 描述可用于沙箱或容器的安全 profile（seccomp / AppArmor）。
message SecurityProfile {
  // ProfileType 枚举定义安全 profile 的来源类型。
    enum ProfileType {
      // 使用容器运行时的默认 profile。
        RuntimeDefault = 0;
      // 对沙箱或容器禁用该特性（不受限）。
        Unconfined = 1;
      // 使用节点上预定义的 profile。
        Localhost = 2;
    }
  // 指示应应用哪种 ProfileType。
    ProfileType profile_type = 1;
  // 表示使用节点上预定义的 profile，仅当 profile_type 为 Localhost 时才能设置。对 seccomp 必须是 profile 的绝对路径；对 AppArmor 是 <profile name>/。
    string localhost_ref = 2;
}

// LinuxPodSandboxConfig 保存 Linux 宿主机平台上基于 Linux 的容器特有的沙箱配置。
message LinuxPodSandboxConfig {
  // 沙箱的父 cgroup，使用 cgroupfs 风格语法，但运行时可按需转换为 systemd 语义。
    string cgroup_parent = 1;
  // 沙箱的安全属性。
    LinuxSandboxSecurityContext security_context = 2;
  // 沙箱的 Linux sysctl 配置（键值对）。
    map<string, string> sysctls = 3;
  // 可选：与该沙箱关联的开销资源。
    LinuxContainerResources overhead = 4;
  // 可选：该沙箱所有容器资源的总和。
    LinuxContainerResources resources = 5;
}

// PodSandboxMetadata 包含构建沙箱名称所需的全部元信息；建议运行时在 UI 中暴露这些元数据（如据此构造唯一的 PodSandboxName）。
message PodSandboxMetadata {
  // 沙箱的 Pod 名称，与 Pod ObjectMeta 中的 name 相同。
    string name = 1;
  // 沙箱的 Pod UID，与 Pod ObjectMeta 中的 uid 相同。
    string uid = 2;
  // 沙箱的 Pod 命名空间，与 Pod ObjectMeta 中的 namespace 相同。
    string namespace = 3;
  // 创建沙箱的尝试次数，默认 0。注意：沙箱由 (name, namespace, uid, attempt) 共同唯一标识，重建时 attempt 递增。
    uint32 attempt = 4;
}

// PodSandboxConfig 包含创建沙箱所需的全部必填与可选字段。
message PodSandboxConfig {
  // 沙箱元数据，用于唯一标识沙箱；运行时应借此保证操作正确，也可据此构造可读名称改善体验。
    PodSandboxMetadata metadata = 1;
  // 沙箱的主机名；仅当 pod 网络 namespace 为 NODE 时才可为空。
    string hostname = 2;
  // 宿主机上存放容器日志文件的目录路径。默认容器日志会连接到 STDOUT/STDERR；该目录也可包含结构化日志的二进制文件（如换行分隔的 JSON、systemd-journald 日志、gRPC 跟踪记录等）。例如 LogDirectory=/var/log/pods/<NAMESPACE>_<NAME>_<UID>/，ContainerConfig.LogPath=containerName/Instance#.log。
    string log_directory = 3;
  // 沙箱的 DNS 配置。
    DNSConfig dns_config = 4;
  // 沙箱的端口映射列表。
    repeated PortMapping port_mappings = 5;
  // 可用于圈定和选择资源的键值对（标签）。
    map<string, string> labels = 6;
  // 非结构化键值对，供 kubelet 存取任意元数据，包括通过 Kubernetes API 设置的 Pod annotations。运行时不得修改 annotations，必须在对应的 PodSandboxStatus 中原样返回。一般 annotations 不应影响运行时行为；运行时作者可用它试验新特性，但应优先提议新增类型化字段。
    map<string, string> annotations = 7;
  // 可选：Linux 宿主机特有配置。
    LinuxPodSandboxConfig linux = 8;
  // 可选：Windows 宿主机特有配置。
    WindowsPodSandboxConfig windows = 9;
}

// RunPodSandboxRequest 是 RunPodSandbox RPC 的请求，携带沙箱配置与运行时处理器。
message RunPodSandboxRequest {
  // 创建沙箱所需的配置。
    PodSandboxConfig config = 1;
  // 该沙箱使用的具名运行时处理器（对应 RuntimeClass）。未知处理器应拒绝请求；空字符串选择默认处理器，等价于此特性加入前的行为。参见 https://git.k8s.io/enhancements/keps/sig-node/585-runtime-class。
    string runtime_handler = 2;
}

// RunPodSandboxResponse 是 RunPodSandbox RPC 的响应，返回运行时分配的沙箱 ID。
message RunPodSandboxResponse {
  // 要运行的沙箱的 ID（由运行时生成并返回给 kubelet）。
    string pod_sandbox_id = 1;
}

// StopPodSandboxRequest 是 StopPodSandbox RPC 的请求。
message StopPodSandboxRequest {
  // 要停止的沙箱 ID。
    string pod_sandbox_id = 1;
}

// StopPodSandboxResponse 是 StopPodSandbox RPC 的响应，无返回字段（幂等成功即为空）。
message StopPodSandboxResponse {}

// RemovePodSandboxRequest 是 RemovePodSandbox RPC 的请求。
message RemovePodSandboxRequest {
  // 要删除的沙箱 ID。
    string pod_sandbox_id = 1;
}

// RemovePodSandboxResponse 是 RemovePodSandbox RPC 的响应，无返回字段。
message RemovePodSandboxResponse {}

// PodSandboxStatusRequest 是 PodSandboxStatus RPC 的请求。
message PodSandboxStatusRequest {
  // 要查询状态的沙箱 ID。
    string pod_sandbox_id = 1;
  // 是否返回额外调试信息（填入响应的 info 字段）。
    bool verbose = 2;
}

// PodIP 表示 Pod 的一个 IP 地址，用于表达额外的 IP（如双栈 IPv6 地址）。
message PodIP{
  // IP 地址的字符串表示，可以是 IPv4 或 IPv6。
    string ip = 1;
}
// PodSandboxNetworkStatus 表示沙箱的网络状态；对共享宿主机网络命名空间的 pod 当前会被忽略。
message PodSandboxNetworkStatus {
  // 沙箱的主 IP 地址。
    string ip = 1;
  // 沙箱的附加 IP 列表（不包含主 IP 字段中的地址）。
    repeated PodIP additional_ips  = 2;
}

// Namespace 包含指向各 namespace 的路径信息。
message Namespace {
  // Linux namespace 的选项配置。
    NamespaceOption options = 2;
}

// LinuxPodSandboxStatus 包含 Linux 沙箱特有的状态信息。
message LinuxPodSandboxStatus {
  // 指向沙箱各 namespace 的路径。
    Namespace namespaces = 1;
}

// PodSandboxState 枚举定义沙箱的运行状态。
enum PodSandboxState {
  // 沙箱就绪（已成功创建并启动）。
    SANDBOX_READY    = 0;
  // 沙箱未就绪。
    SANDBOX_NOTREADY = 1;
}

// PodSandboxStatus 包含沙箱的完整状态信息。
message PodSandboxStatus {
  // 沙箱的 ID。
    string id = 1;
  // 沙箱的元数据。
    PodSandboxMetadata metadata = 2;
  // 沙箱的状态。
    PodSandboxState state = 3;
  // 沙箱的创建时间戳，单位为纳秒，必须 > 0。
    int64 created_at = 4;
  // 当网络由运行时管理时，包含网络状态。
    PodSandboxNetworkStatus network = 5;
  // 沙箱特有的 Linux 状态信息。
    LinuxPodSandboxStatus linux = 6;
  // 可用于圈定和选择资源的标签键值对。
    map<string, string> labels = 7;
  // 非结构化键值对。运行时不得修改，必须与创建该沙箱的 PodSandboxConfig 中的值完全一致。
    map<string, string> annotations = 8;
  // 该沙箱使用的运行时处理器（RuntimeClass）。
    string runtime_handler = 9;
}

// PodSandboxStatusResponse 是 PodSandboxStatus RPC 的响应，包含状态与可选调试信息。
message PodSandboxStatusResponse {
  // 沙箱的状态。
    PodSandboxStatus status = 1;
  // 沙箱的额外信息，键为任意字符串、值应为 JSON 格式，可含调试信息（如 Linux 容器的网络 namespace）。仅当 verbose=true 时才返回非空。
    map<string, string> info = 2;
  // 沙箱内各容器的状态列表。
    repeated ContainerStatus containers_statuses = 3;
  // 容器与 pod 状态被记录的时间戳，单位为纳秒。
    int64 timestamp = 4;
}

// PodSandboxStateValue 是 PodSandboxState 的包装类型，用于过滤器中表达状态条件（区分未设置与具体状态）。
message PodSandboxStateValue {
  // 沙箱状态。
    PodSandboxState state = 1;
}

// PodSandboxFilter 用于过滤沙箱列表，所有字段之间按逻辑 AND 组合。
message PodSandboxFilter {
  // 按沙箱 ID 过滤。
    string id = 1;
  // 按沙箱状态过滤。
    PodSandboxStateValue state = 2;
  // 按标签选择匹配项。目前仅支持 api.MatchLabels，且条件是 AND 关系；暂不支持 MatchExpressions。
    map<string, string> label_selector = 3;
}

// ListPodSandboxRequest 是 ListPodSandbox RPC 的请求。
message ListPodSandboxRequest {
  // 沙箱列表的过滤条件。
    PodSandboxFilter filter = 1;
}


// PodSandbox 包含沙箱的最小概要信息，用于列表类响应。
message PodSandbox {
  // 沙箱 ID。
    string id = 1;
  // 沙箱元数据。
    PodSandboxMetadata metadata = 2;
  // 沙箱状态。
    PodSandboxState state = 3;
  // 沙箱创建时间戳，单位为纳秒，必须 > 0。
    int64 created_at = 4;
  // 沙箱标签。
    map<string, string> labels = 5;
  // 非结构化元数据。运行时不得修改，必须与创建该沙箱的 PodSandboxConfig 中的值完全一致。
    map<string, string> annotations = 6;
  // 该沙箱使用的运行时处理器。
    string runtime_handler = 7;
}

// ListPodSandboxResponse 是 ListPodSandbox RPC 的响应。
message ListPodSandboxResponse {
  // 沙箱列表。
    repeated PodSandbox items = 1;
}

// StreamPodSandboxesRequest 是 StreamPodSandboxes RPC 的请求。
message StreamPodSandboxesRequest {
  // 列表请求的过滤条件。
    PodSandboxFilter filter = 1;
}

// StreamPodSandboxesResponse 是 StreamPodSandboxes RPC 流式响应中的一条消息。
message StreamPodSandboxesResponse {
  // 本批返回的沙箱列表（至少一项）。
    repeated PodSandbox pod_sandboxes = 1;
}

// PodSandboxStatsRequest 是 PodSandboxStats RPC 的请求。
message PodSandboxStatsRequest {
  // 要查询统计的沙箱 ID。
    string pod_sandbox_id = 1;
}

// PodSandboxStatsResponse 是 PodSandboxStats RPC 的响应。
message PodSandboxStatsResponse {
  // 该沙箱的资源使用统计。
    PodSandboxStats stats = 1;
}

// PodSandboxStatsFilter 用于过滤要查询统计的沙箱列表，所有字段按 AND 组合。
message PodSandboxStatsFilter {
  // 沙箱 ID。
    string id = 1;
  // 按标签选择匹配项。目前仅支持 api.MatchLabels（AND 关系），不支持 MatchExpressions。
    map<string, string> label_selector = 2;
}

// ListPodSandboxStatsRequest 是 ListPodSandboxStats RPC 的请求。
message ListPodSandboxStatsRequest {
  // 列表请求的过滤条件。
    PodSandboxStatsFilter filter = 1;
}

// ListPodSandboxStatsResponse 是 ListPodSandboxStats RPC 的响应。
message ListPodSandboxStatsResponse {
  // 沙箱的统计列表。
    repeated PodSandboxStats stats = 1;
}

// StreamPodSandboxStatsRequest 是 StreamPodSandboxStats RPC 的请求。
message StreamPodSandboxStatsRequest {
  // 列表请求的过滤条件。
    PodSandboxStatsFilter filter = 1;
}

// StreamPodSandboxStatsResponse 是 StreamPodSandboxStats RPC 流式响应中的一条消息。
message StreamPodSandboxStatsResponse {
  // 本批返回的沙箱统计列表（至少一项）。
    repeated PodSandboxStats pod_sandbox_stats = 1;
}

// PodSandboxAttributes 提供沙箱的基本标识信息，用于统计数据中关联对象。
message PodSandboxAttributes {
  // 沙箱 ID。
    string id = 1;
  // 沙箱元数据。
    PodSandboxMetadata metadata = 2;
  // 用于圈定和选择资源的标签键值对。
    map<string,string> labels = 3;
  // 非结构化元数据。运行时不得修改，必须与对应 PodSandboxStatus 中的值完全一致。
    map<string,string> annotations = 4;
}

// PodSandboxStats 提供 pod 的资源使用统计；linux 或 windows 字段按平台填充其一。
message PodSandboxStats {
  // 该 pod 的基本信息。
    PodSandboxAttributes attributes = 1;
  // Linux 平台下的统计。
    LinuxPodSandboxStats linux = 2;
  // Windows 平台下的统计。
    WindowsPodSandboxStats windows = 3;
}

// LinuxPodSandboxStats 提供 Linux 沙箱的资源使用统计。
message LinuxPodSandboxStats {
  // 沙箱的 CPU 使用统计。
    CpuUsage cpu = 1;
  // 沙箱的内存使用统计。
    MemoryUsage memory = 2;
  // 沙箱的网络使用统计。
    NetworkUsage network = 3;
  // 沙箱中进程相关的统计。
    ProcessUsage process = 4;
  // 该沙箱内各容器的统计。
    repeated ContainerStats containers = 5;
  // 沙箱的 IO 使用统计（主要用于 PSI）。
    IoUsage io = 6;
}

// WindowsPodSandboxStats 提供 Windows 沙箱的资源使用统计。
message WindowsPodSandboxStats {
  // 沙箱的 CPU 使用统计（Windows 版）。
    WindowsCpuUsage cpu = 1;
  // 沙箱的内存使用统计（Windows 版）。
    WindowsMemoryUsage memory = 2;
  // 沙箱的网络使用统计（Windows 版）。
    WindowsNetworkUsage network = 3;
  // 沙箱中进程相关的统计（Windows 版）。
    WindowsProcessUsage process = 4;
  // 该沙箱内各容器的统计（Windows 版）。
    repeated WindowsContainerStats containers = 5;
}

// NetworkUsage 包含网络资源的使用数据。
message NetworkUsage {
  // 采集该信息的时间戳，单位为纳秒，必须 > 0。
    int64 timestamp = 1;
  // 默认网络接口的统计。
    NetworkInterfaceUsage default_interface = 2;
  // 除默认接口外，其余所有网络接口的统计。
    repeated NetworkInterfaceUsage interfaces = 3;
}

// WindowsNetworkUsage 包含 Windows 特有的网络资源使用数据。
message WindowsNetworkUsage {
  // 采集该信息的时间戳，单位为纳秒，必须 > 0。
    int64 timestamp = 1;
  // 默认网络接口的统计（Windows 版）。
    WindowsNetworkInterfaceUsage default_interface = 2;
  // 除默认接口外，其余网络接口的统计（Windows 版）。
    repeated WindowsNetworkInterfaceUsage interfaces = 3;
}

// NetworkInterfaceUsage 包含单个网络接口的资源数据（累计计数）。
message NetworkInterfaceUsage {
  // 网络接口名称。
    string name = 1;
  // 累计接收字节数。
    UInt64Value rx_bytes = 2;
  // 累计接收错误数。
    UInt64Value rx_errors = 3;
  // 累计发送字节数。
    UInt64Value tx_bytes = 4;
  // 累计发送错误数。
    UInt64Value tx_errors = 5;
}

// WindowsNetworkInterfaceUsage 包含 Windows 单个网络接口的资源数据。
message WindowsNetworkInterfaceUsage {
  // 网络接口名称。
    string name = 1;
  // 累计接收字节数。
    UInt64Value rx_bytes = 2;
  // Windows 下累计丢弃的接收包数。
    UInt64Value rx_packets_dropped = 3;
  // 累计发送字节数。
    UInt64Value tx_bytes = 4;
  // Windows 下累计丢弃的发送包数。
    UInt64Value tx_packets_dropped = 5;
}

// ProcessUsage 包含进程相关的统计。
message ProcessUsage {
  // 采集该信息的时间戳，单位为纳秒，必须 > 0。
    int64 timestamp = 1;
  // 进程数量。
    UInt64Value process_count = 2;
}

// WindowsProcessUsage 包含 Windows 特有的进程相关统计。
message WindowsProcessUsage {
  // 采集该信息的时间戳，单位为纳秒，必须 > 0。
    int64 timestamp = 1;
  // 进程数量。
    UInt64Value process_count = 2;
}

// ImageSpec 是镜像的内部表示形式，被容器创建、镜像查询等多处 RPC 复用。
message ImageSpec {
  // 容器的镜像字段（如 imageID 或 imageDigest）。
    string image = 1;
  // 非结构化键值对，可帮助运行时在多架构镜像中定位特定镜像。
    map<string, string> annotations = 2;
  // 用户指定的镜像引用（如 image[:tag] 或 digest），仅在 RPC 上下文中可获取时设置。
    string user_specified_image = 18;
  // 拉取镜像时使用的运行时处理器；未知处理器应拒绝请求，空字符串选择默认处理器。
    string runtime_handler = 19;
  // 该卷所用镜像的 digest 引用，取值应与 pod status.containerStatuses[i].imageID 类似。
    string image_ref = 20;
}

// KeyValue 表示一个字符串键到字节值的映射，用于容器环境变量等场景。
message KeyValue {
  // 键。
    string key = 1;
  // 值（字节序列）。
    bytes value = 2;
}

// LinuxContainerResources 指定 Linux 容器/沙箱的资源配置。默认值 0 或空字符串通常表示“未指定”。
message LinuxContainerResources {
  // CPU CFS（完全公平调度器）周期，默认 0 表示未指定。
    int64 cpu_period = 1;
  // CPU CFS 配额，默认 0 表示未指定。
    int64 cpu_quota = 2;
  // CPU 份额（相对权重）；默认 0 表示未指定。
    int64 cpu_shares = 3;
  // 内存限制，单位字节；默认 0 表示未指定。
    int64 memory_limit_in_bytes = 4;
  // 调整 OOM killer 的评分；默认 0 表示未指定。
    int64 oom_score_adj = 5;
  // 限制允许使用的逻辑 CPU 集合；默认 "" 表示未指定。
    string cpuset_cpus = 6;
  // 限制允许使用的内存节点集合；默认 "" 表示未指定。
    string cpuset_mems = 7;
  // 按页大小限制容器 HugeTLB 使用量的 HugepageLimit 列表；默认 nil 表示未指定。
    repeated HugepageLimit hugepage_limits = 8;
  // cgroup v2 的统一资源配置，每个键值对对应一个 cgroup v2 控制项，如 "memory.max": "6937202688" 或 "io.weight": "default 100"；默认 nil 表示未指定。
    map<string, string> unified = 9;
  // 内存交换（swap）限制，单位字节；默认 0 表示未指定。
    int64 memory_swap_limit_in_bytes = 10;
}

// HugepageLimit 对应容器级 cgroup 文件 hugetlb.<hugepagesize>.limit_in_bytes，例如 PageSize=1GB、Limit=1073741824 表示设置 hugetlb.1GB.limit_in_bytes 为 1073741824 字节。
message HugepageLimit {
  // 页大小，格式为 <size><unit-prefix>B（如 2MB、1GB），必须与 hugetlb.<hugepagesize>.limit_in_bytes 中的 <hugepagesize> 匹配；单位前缀按 1024 进制解析（1KB=1024，1MB=1048576 等）。
    string page_size = 1;
  // 该巨页大小对应的 HugeTLB 使用上限，单位字节。
    uint64 limit = 2;
}

// SELinuxOption 描述要应用到容器的 SELinux 标签（user/role/type/level）。
message SELinuxOption {
  // SELinux 用户（user）。
    string user = 1;
  // SELinux 角色（role）。
    string role = 2;
  // SELinux 类型（type）。
    string type = 3;
  // SELinux 级别（level）。
    string level = 4;
}

// Capability 描述容器要添加或删除的 Linux capabilities。
// 删除 capability 会从所有集合中移除；仅加入 add_capabilities 时，会加入 permitted、inheritable、effective、bounding 集合，但不加入 ambient；
// 仅加入 add_ambient_capabilities 时，会加入包括 ambient 在内的所有集合；同时加入两个列表时，也会加入所有集合。
message Capability {
  // 要添加的 capability 列表（加入 permitted、inheritable、effective、bounding 集合，但不加入 ambient）。
    repeated string add_capabilities = 1;
  // 要删除的 capability 列表（从所有集合中删除）。
    repeated string drop_capabilities = 2;
  // 要添加的 ambient capability 列表（加入包括 ambient 在内的所有集合）。
    repeated string add_ambient_capabilities = 3;
}

// LinuxContainerSecurityContext 保存应用于容器的 Linux 安全配置。
message LinuxContainerSecurityContext {
  // 要添加/删除的 capabilities。
    Capability capabilities = 1;
  // 设为 true 表示以特权模式运行容器。特权模式与 capabilities、selinux_options、seccomp、apparmor 等选项不兼容，这些选项可能无效；特权模式隐含：添加所有 capabilities、不屏蔽敏感路径、sysfs/procfs 可写、不应用 AppArmor/SELinux/seccomp 限制、设备 cgroup 不限制访问、宿主机 /dev 下所有设备可用等。
    bool privileged = 2;
  // 容器的 namespace 配置，仅在容器使用 namespace 隔离时生效。
    NamespaceOption namespace_options = 3;
  // 可选：要应用的 SELinux 上下文。
    SELinuxOption selinux_options = 4;
  // 容器进程以该 UID 运行；只能与 run_as_username 二选一。
    Int64Value run_as_user = 5;
  // 容器进程以该 GID 运行；仅当指定了 run_as_user 或 run_as_username 时才能设置，否则运行时必须报错。
    Int64Value run_as_group = 12;
  // 容器进程以该用户名运行；若设置，用户必须存在于容器镜像中（镜像内 /etc/passwd）并由运行时解析，否则必须报错。
    string run_as_username = 6;
  // 设为 true 表示容器根文件系统为只读。
    bool readonly_rootfs = 7;
  // 应用于容器首个进程的附加组列表，计算方式由 supplemental_groups_policy 控制。
    repeated int64 supplemental_groups = 8;
  // 定义容器首个进程的附加组如何计算，有效值 "Merge"/"Strict"，默认 "Merge"。
    SupplementalGroupsPolicy supplemental_groups_policy = 17;
  // 定义是否为容器设置 no_new_privs 标志（禁止进程通过 exec 获得新权限）。
    bool no_new_privs = 11;
  // 需要被运行时屏蔽的路径列表，可直接传给 OCI spec。
    repeated string masked_paths = 13;
  // 需要被运行时设为只读的路径列表，可直接传给 OCI spec。
    repeated string readonly_paths = 14;
  // 容器的 seccomp profile。
    SecurityProfile seccomp = 15;
  // 容器的 AppArmor profile。
    SecurityProfile apparmor = 16;
  // 容器的 AppArmor profile 字符串（已弃用，请改用 apparmor 字段）。候选值：runtime/default（等同未指定）、unconfined（不加载 profile）、localhost/<profile_name>（节点上按名称加载的 profile）。
  // 可用的 profile 名称参见 https://gitlab.com/apparmor/apparmor/-/wikis/AppArmor_Core_Policy_Reference。
    string apparmor_profile = 9 [deprecated=true];
  // 容器的 seccomp profile 路径（已弃用，请改用 seccomp 字段）。候选值：runtime/default、unconfined、localhost/<完整路径>；默认 "" 等同 unconfined。
    string seccomp_profile_path = 10 [deprecated=true];
}

// LinuxContainerConfig 包含基于 Linux 的容器的平台特有配置。
message LinuxContainerConfig {
  // 容器的资源配置。
    LinuxContainerResources resources = 1;
  // 容器的 Linux 安全上下文配置。
    LinuxContainerSecurityContext security_context = 2;
}

// LinuxContainerUser 描述容器首个进程初始附加的用户身份（uid、gid、附加组）。
message LinuxContainerUser {
  // 容器首个进程初始的主 UID。
    int64 uid = 1;
  // 容器首个进程初始的主 GID。
    int64 gid = 2;
  // 容器首个进程初始的附加组列表。
    repeated int64 supplemental_groups = 3;
}

// WindowsNamespaceOption 提供 Windows namespace 的配置选项。
message WindowsNamespaceOption {
  // 该容器/沙箱的网络 namespace；kubelet 目前从不设置该字段。
    NamespaceMode network = 1;
}

// WindowsSandboxSecurityContext 保存应用于沙箱的 Windows 平台特有安全配置，仅作用于沙箱容器。
message WindowsSandboxSecurityContext {
  // 以该用户名运行容器进程；若设置，用户必须存在于镜像中并由运行时解析，否则必须报错。
    string run_as_username = 1;

  // 运行该容器使用的 GMSA 凭据规范内容。
    string credential_spec = 2;

  // 表示该容器是否请求以 HostProcess 容器方式运行。
    bool host_process = 3;

  // 沙箱的 namespace 配置。
    WindowsNamespaceOption namespace_options = 4;
}

// WindowsPodSandboxConfig 保存 Windows 宿主机平台上基于 Windows 的容器特有的沙箱配置。
message WindowsPodSandboxConfig {
  // 沙箱的安全属性。
    WindowsSandboxSecurityContext security_context = 1;
}

// WindowsContainerSecurityContext 保存应用于容器的 Windows 安全配置。
message WindowsContainerSecurityContext {
  // 以该用户名运行容器进程；若设置，用户必须存在于镜像中并由运行时解析，否则必须报错。
    string run_as_username = 1;

  // 运行该容器使用的 GMSA 凭据规范内容。
    string credential_spec = 2;

  // 表示该容器是否以 HostProcess 容器方式运行。
    bool host_process = 3;
}

// WindowsContainerConfig 包含基于 Windows 的容器的平台特有配置。
message WindowsContainerConfig {
  // 容器的资源配置。
    WindowsContainerResources resources = 1;
  // 容器的 Windows 安全上下文配置。
    WindowsContainerSecurityContext security_context = 2;
}

// WindowsContainerResources 指定 Windows 容器的资源配置。
message WindowsContainerResources {
  // CPU 份额（相对权重）；默认 0 表示未指定。
    int64 cpu_shares = 1;
  // 容器可用的 CPU 数量；默认 0 表示未指定。
    int64 cpu_count = 2;
  // 容器可使用的处理器周期比例，以百分比乘 100 表示（如 5000 表示 50%）。
    int64 cpu_maximum = 3;
  // 内存限制，单位字节；默认 0 表示未指定。
    int64 memory_limit_in_bytes = 4;
  // 为该容器配置的 rootfs/scratch 空间大小，单位字节；默认 0 表示未指定。
    int64 rootfs_size_in_bytes = 5;
  // 可选：指定该容器要亲和的 CPU 集合。
    repeated WindowsCpuGroupAffinity affinity_cpus = 6;
}

// WindowsCpuGroupAffinity 指定 CPU 掩码与所属的处理器组，类似 Windows 的 _GROUP_AFFINITY 结构。
// 参见 https://learn.microsoft.com/en-us/windows-hardware/drivers/ddi/miniport/ns-miniport-_group_affinity。
message WindowsCpuGroupAffinity {
  // 相对于该 CPU 组的 CPU 掩码。
    uint64 cpu_mask = 1;
  // 掩码所指的处理器组编号，由 GetLogicalProcessorInformationEx 返回。
    uint32 cpu_group = 2;
}

// ContainerMetadata 包含构建容器名称所需的元信息；建议在 UI 中暴露。注意：(name, attempt) 在沙箱整个生命周期内唯一。
message ContainerMetadata {
  // 容器名称，与 PodSpec 中的容器名相同。
    string name = 1;
  // 创建该容器的尝试次数，默认 0。
    uint32 attempt = 2;
}

// Device 描述要挂载到容器中的宿主机设备。
message Device {
  // 设备在容器内的路径。
    string container_path = 1;
  // 设备在宿主机上的路径。
    string host_path = 2;
  // 设备的 cgroup 权限，可取一个或多个：r（读）、w（写）、m（创建尚不存在的设备文件）。
    string permissions = 3;
}

// CDIDevice 描述容器设备接口（CDI）的设备信息。
message CDIDevice {
  // 完全限定的 CDI 设备名，如 vendor.com/gpu=gpudevice1。
  // 参见 CDI 规范：https://github.com/container-orchestrated-devices/container-device-interface/blob/main/SPEC.md。
    string name = 1;
}

// ContainerConfig 包含创建容器所需的全部必填与可选字段。
message ContainerConfig {
  // 容器元数据，唯一标识容器；运行时应借此保证操作正确并可用于构造可读名称。
    ContainerMetadata metadata = 1 ;
  // 要使用的镜像。
    ImageSpec image = 2;
  // 要执行的命令（即 Docker 中的 entrypoint）。
    repeated string command = 3;
  // 命令的参数（即 Docker 中的 cmd）。
    repeated string args = 4;
  // 命令的当前工作目录。
    string working_dir = 5;
  // 要在容器中设置的环境变量列表。
    repeated KeyValue envs = 6;
  // 容器的挂载列表。
    repeated Mount mounts = 7;
  // 容器的设备列表。
    repeated Device devices = 8;
  // 用于圈定和选择资源的标签键值对。键的格式：prefixed-name（prefix '/' name）或 name；prefix 为 DNS_SUBDOMAIN，name 为 DNS_LABEL。
    map<string, string> labels = 9;
  // 非结构化键值对，供 kubelet 存取任意元数据。运行时不得修改，必须在对应的 ContainerStatus 中原样返回；一般不应影响运行时行为。
    map<string, string> annotations = 10;
  // 容器日志文件在宿主机上相对 PodSandboxConfig.LogDirectory 的路径（STDOUT/STDERR）。例如 LogDirectory=/var/log/pods/<NAMESPACE>_<NAME>_<UID>/、LogPath=containerName/Instance#.log。
    string log_path = 11;

  // 交互式容器相关变量，用于非常特殊的场景（如调试）：是否开启 stdin。
    bool stdin = 12;
  // 是否仅附加一次 stdin 后即关闭（交互式容器专用）。
    bool stdin_once = 13;
  // 是否分配 TTY（交互式容器专用）。
    bool tty = 14;

  // Linux 容器特有配置。
    LinuxContainerConfig linux = 15;
  // Windows 容器特有配置。
    WindowsContainerConfig windows = 16;

  // 容器的 CDI 设备列表。
    repeated CDIDevice CDI_devices = 17;

  // 用于终止容器的自定义停止信号。
    Signal stop_signal = 18;
}

// Signal 枚举定义用于终止容器的 POSIX 信号集合，供 ContainerConfig.stop_signal 使用。
enum Signal {
  // 使用容器运行时的默认停止信号（通常为 SIGTERM）。
    SIGNAL_RUNTIME_DEFAULT   = 0;
  // SIGABRT：异常终止信号。
    SIGNAL_SIGABRT           = 1;
  // SIGALRM：闹钟信号。
    SIGNAL_SIGALRM           = 2;
  // SIGBUS：总线错误信号。
    SIGNAL_SIGBUS            = 3;
  // SIGCHLD：子进程状态改变信号。
    SIGNAL_SIGCHLD           = 4;
  // SIGCLD：SIGCHLD 的别名。
    SIGNAL_SIGCLD            = 5;
  // SIGCONT：继续运行信号。
    SIGNAL_SIGCONT           = 6;
  // SIGFPE：浮点异常信号。
    SIGNAL_SIGFPE            = 7;
  // SIGHUP：挂断信号。
    SIGNAL_SIGHUP            = 8;
  // SIGILL：非法指令信号。
    SIGNAL_SIGILL            = 9;
  // SIGINT：中断信号（Ctrl-C）。
    SIGNAL_SIGINT            = 10;
  // SIGIO：异步 IO 事件信号。
    SIGNAL_SIGIO             = 11;
  // SIGIOT：IOT 陷阱信号（SIGABRT 的别名）。
    SIGNAL_SIGIOT            = 12;
  // SIGKILL：强制终止信号（不可被捕获或忽略）。
    SIGNAL_SIGKILL           = 13;
  // SIGPIPE：向无读端的管道写数据信号。
    SIGNAL_SIGPIPE           = 14;
  // SIGPOLL：可轮询事件信号。
    SIGNAL_SIGPOLL           = 15;
  // SIGPROF：性能分析定时器信号。
    SIGNAL_SIGPROF           = 16;
  // SIGPWR：电源故障信号。
    SIGNAL_SIGPWR            = 17;
  // SIGQUIT：退出信号（Ctrl-反斜杠）。
    SIGNAL_SIGQUIT           = 18;
  // SIGSEGV：段错误信号。
    SIGNAL_SIGSEGV           = 19;
  // SIGSTKFLT：协处理器栈错误信号。
    SIGNAL_SIGSTKFLT         = 20;
  // SIGSTOP：暂停信号（不可被捕获或忽略）。
    SIGNAL_SIGSTOP           = 21;
  // SIGSYS：非法系统调用信号。
    SIGNAL_SIGSYS            = 22;
  // SIGTERM：终止信号（可被捕获，通常作为优雅停止信号）。
    SIGNAL_SIGTERM           = 23;
  // SIGTRAP：跟踪/断点陷阱信号。
    SIGNAL_SIGTRAP           = 24;
  // SIGTSTP：终端停止信号（Ctrl-Z）。
    SIGNAL_SIGTSTP           = 25;
  // SIGTTIN：后台进程读取终端信号。
    SIGNAL_SIGTTIN           = 26;
  // SIGTTOU：后台进程写终端信号。
    SIGNAL_SIGTTOU           = 27;
  // SIGURG：紧急数据到达 socket 信号。
    SIGNAL_SIGURG            = 28;
  // SIGUSR1：用户自定义信号 1。
    SIGNAL_SIGUSR1           = 29;
  // SIGUSR2：用户自定义信号 2。
    SIGNAL_SIGUSR2           = 30;
  // SIGVTALRM：虚拟定时器信号。
    SIGNAL_SIGVTALRM         = 31;
  // SIGWINCH：终端窗口大小改变信号。
    SIGNAL_SIGWINCH          = 32;
  // SIGXCPU：CPU 时间超限信号。
    SIGNAL_SIGXCPU           = 33;
  // SIGXFSZ：文件大小超限信号。
    SIGNAL_SIGXFSZ           = 34;
  // SIGRTMIN：第一个实时信号。
    SIGNAL_SIGRTMIN          = 35;
  // SIGRTMIN+1：相对 SIGRTMIN 偏移 1 的实时信号。
    SIGNAL_SIGRTMINPLUS1     = 36;
  // SIGRTMIN+2：相对 SIGRTMIN 偏移 2 的实时信号。
    SIGNAL_SIGRTMINPLUS2     = 37;
  // SIGRTMIN+3：相对 SIGRTMIN 偏移 3 的实时信号。
    SIGNAL_SIGRTMINPLUS3     = 38;
  // SIGRTMIN+4：相对 SIGRTMIN 偏移 4 的实时信号。
    SIGNAL_SIGRTMINPLUS4     = 39;
  // SIGRTMIN+5：相对 SIGRTMIN 偏移 5 的实时信号。
    SIGNAL_SIGRTMINPLUS5     = 40;
  // SIGRTMIN+6：相对 SIGRTMIN 偏移 6 的实时信号。
    SIGNAL_SIGRTMINPLUS6     = 41;
  // SIGRTMIN+7：相对 SIGRTMIN 偏移 7 的实时信号。
    SIGNAL_SIGRTMINPLUS7     = 42;
  // SIGRTMIN+8：相对 SIGRTMIN 偏移 8 的实时信号。
    SIGNAL_SIGRTMINPLUS8     = 43;
  // SIGRTMIN+9：相对 SIGRTMIN 偏移 9 的实时信号。
    SIGNAL_SIGRTMINPLUS9     = 44;
  // SIGRTMIN+10：相对 SIGRTMIN 偏移 10 的实时信号。
    SIGNAL_SIGRTMINPLUS10    = 45;
  // SIGRTMIN+11：相对 SIGRTMIN 偏移 11 的实时信号。
    SIGNAL_SIGRTMINPLUS11    = 46;
  // SIGRTMIN+12：相对 SIGRTMIN 偏移 12 的实时信号。
    SIGNAL_SIGRTMINPLUS12    = 47;
  // SIGRTMIN+13：相对 SIGRTMIN 偏移 13 的实时信号。
    SIGNAL_SIGRTMINPLUS13    = 48;
  // SIGRTMIN+14：相对 SIGRTMIN 偏移 14 的实时信号。
    SIGNAL_SIGRTMINPLUS14    = 49;
  // SIGRTMIN+15：相对 SIGRTMIN 偏移 15 的实时信号。
    SIGNAL_SIGRTMINPLUS15    = 50;
  // SIGRTMAX-14：距最大实时信号偏移 14 的实时信号。
    SIGNAL_SIGRTMAXMINUS14   = 51;
  // SIGRTMAX-13：距最大实时信号偏移 13 的实时信号。
    SIGNAL_SIGRTMAXMINUS13   = 52;
  // SIGRTMAX-12：距最大实时信号偏移 12 的实时信号。
    SIGNAL_SIGRTMAXMINUS12   = 53;
  // SIGRTMAX-11：距最大实时信号偏移 11 的实时信号。
    SIGNAL_SIGRTMAXMINUS11   = 54;
  // SIGRTMAX-10：距最大实时信号偏移 10 的实时信号。
    SIGNAL_SIGRTMAXMINUS10   = 55;
  // SIGRTMAX-9：距最大实时信号偏移 9 的实时信号。
    SIGNAL_SIGRTMAXMINUS9    = 56;
  // SIGRTMAX-8：距最大实时信号偏移 8 的实时信号。
    SIGNAL_SIGRTMAXMINUS8    = 57;
  // SIGRTMAX-7：距最大实时信号偏移 7 的实时信号。
    SIGNAL_SIGRTMAXMINUS7    = 58;
  // SIGRTMAX-6：距最大实时信号偏移 6 的实时信号。
    SIGNAL_SIGRTMAXMINUS6    = 59;
  // SIGRTMAX-5：距最大实时信号偏移 5 的实时信号。
    SIGNAL_SIGRTMAXMINUS5    = 60;
  // SIGRTMAX-4：距最大实时信号偏移 4 的实时信号。
    SIGNAL_SIGRTMAXMINUS4    = 61;
  // SIGRTMAX-3：距最大实时信号偏移 3 的实时信号。
    SIGNAL_SIGRTMAXMINUS3    = 62;
  // SIGRTMAX-2：距最大实时信号偏移 2 的实时信号。
    SIGNAL_SIGRTMAXMINUS2    = 63;
  // SIGRTMAX-1：距最大实时信号偏移 1 的实时信号。
    SIGNAL_SIGRTMAXMINUS1    = 64;
  // SIGRTMAX：最后一个实时信号。
    SIGNAL_SIGRTMAX          = 65;
}

// CreateContainerRequest 是 CreateContainer RPC 的请求。
message CreateContainerRequest {
  // 要在其中创建容器的 PodSandbox ID。
    string pod_sandbox_id = 1;
  // 容器的配置。
    ContainerConfig config = 2;
  // 沙箱配置，与创建该沙箱时传给 RunPodSandboxRequest 的完全相同，此处再次传入仅为方便引用。PodSandboxConfig 在 pod 生命周期内不可变。
    PodSandboxConfig sandbox_config = 3;
}

// CreateContainerResponse 是 CreateContainer RPC 的响应。
message CreateContainerResponse {
  // 新建容器的 ID。
    string container_id = 1;
}

// StartContainerRequest 是 StartContainer RPC 的请求。
message StartContainerRequest {
  // 要启动的容器 ID。
    string container_id = 1;
}

// StartContainerResponse 是 StartContainer RPC 的响应，无返回字段。
message StartContainerResponse {}

// StopContainerRequest 是 StopContainer RPC 的请求。
message StopContainerRequest {
  // 要停止的容器 ID。
    string container_id = 1;
  // 等待容器停止的超时时间，单位秒；超时后强制终止。默认 0 表示立即强制终止。
    int64 timeout = 2;
}

// StopContainerResponse 是 StopContainer RPC 的响应，无返回字段。
message StopContainerResponse {}

// RemoveContainerRequest 是 RemoveContainer RPC 的请求。
message RemoveContainerRequest {
  // 要删除的容器 ID。
    string container_id = 1;
}

// RemoveContainerResponse 是 RemoveContainer RPC 的响应，无返回字段。
message RemoveContainerResponse {}

// ContainerState 枚举定义容器的生命周期状态。
enum ContainerState {
  // 已创建：容器已创建但进程尚未启动。
    CONTAINER_CREATED = 0;
  // 运行中：容器进程正在运行。
    CONTAINER_RUNNING = 1;
  // 已退出：容器进程已结束。
    CONTAINER_EXITED  = 2;
  // 未知：容器状态无法确定。
    CONTAINER_UNKNOWN = 3;
}

// ContainerStateValue 是 ContainerState 的包装类型，用于过滤器中表达状态条件。
message ContainerStateValue {
  // 容器状态。
    ContainerState state = 1;
}

// ContainerFilter 用于过滤容器列表，所有字段按 AND 组合。
message ContainerFilter {
  // 容器 ID。
    string id = 1;
  // 容器状态。
    ContainerStateValue state = 2;
  // 所属 PodSandbox 的 ID。
    string pod_sandbox_id = 3;
  // 按标签选择匹配项。目前仅支持 api.MatchLabels（AND 关系），不支持 MatchExpressions。
    map<string, string> label_selector = 4;
}

// ListContainersRequest 是 ListContainers RPC 的请求。
message ListContainersRequest {
  // 容器列表的过滤条件。
    ContainerFilter filter = 1;
}

// Container 提供容器的运行时信息（ID、镜像、状态等），用于列表类响应。
message Container {
  // 容器 ID，由运行时分配用于标识容器。
    string id = 1;
  // 该容器所属沙箱的 ID。
    string pod_sandbox_id = 2;
  // 容器元数据。
    ContainerMetadata metadata = 3;
  // 镜像的规格（ImageSpec）。
    ImageSpec image = 4;
  // 所使用镜像的 digest 引用。
    string image_ref = 5;
  // 容器状态。
    ContainerState state = 6;
  // 容器创建时间，单位纳秒。
    int64 created_at = 7;
  // 用于圈定和选择资源的标签键值对。
    map<string, string> labels = 8;
  // 非结构化元数据。运行时不得修改，必须与创建该容器的 ContainerConfig 中的值完全一致。
    map<string, string> annotations = 9;
  // 镜像在节点上的唯一标识符引用（由镜像/运行时服务 API 返回）。引用同一镜像时，该值必须始终与 PullImageResponse.image_ref 一致。
    string image_id = 10;
}

// ListContainersResponse 是 ListContainers RPC 的响应。
message ListContainersResponse {
  // 容器列表。
    repeated Container containers = 1;
}

// StreamContainersRequest 是 StreamContainers RPC 的请求。
message StreamContainersRequest {
  // 列表请求的过滤条件。
    ContainerFilter filter = 1;
}

// StreamContainersResponse 是 StreamContainers RPC 流式响应中的一条消息。
message StreamContainersResponse {
  // 本批返回的容器列表（至少一项）。
    repeated Container containers = 1;
}

// ContainerStatusRequest 是 ContainerStatus RPC 的请求。
message ContainerStatusRequest {
  // 要查询状态的容器 ID。
    string container_id = 1;
  // 是否返回额外调试信息（填入响应的 info 字段）。
    bool verbose = 2;
}

// ContainerStatus 表示容器的详细状态信息。
message ContainerStatus {
  // 容器 ID。
    string id = 1;
  // 容器元数据。
    ContainerMetadata metadata = 2;
  // 容器状态。
    ContainerState state = 3;
  // 容器创建时间，单位纳秒。
    int64 created_at = 4;
  // 容器启动时间，单位纳秒；默认 0 表示未指定（尚未启动）。
    int64 started_at = 5;
  // 容器结束时间，单位纳秒；默认 0 表示未指定（尚未结束）。
    int64 finished_at = 6;
  // 容器退出码；仅当 finished_at != 0 时必填，默认 0。
    int32 exit_code = 7;
  // 镜像规格。
    ImageSpec image = 8;
  // 所使用镜像的 digest 引用。
    string image_ref = 9;
  // 简短的 CamelCase 字符串，说明容器处于当前状态的原因；被基于 cgroup 的 OOM killer 终止的容器必须设为 "OOMKilled"。
    string reason = 10;
  // 人类可读的消息，说明容器处于当前状态的详细信息。
    string message = 11;
  // 用于圈定和选择资源的标签键值对。
    map<string,string> labels = 12;
  // 非结构化元数据。运行时不得修改，必须与创建该容器的 ContainerConfig 中的值完全一致。
    map<string,string> annotations = 13;
  // 容器的挂载列表。
    repeated Mount mounts = 14;
  // 容器的日志路径。
    string log_path = 15;
  // 容器的资源限制配置。
    ContainerResources resources = 16;
  // 镜像在节点上的唯一标识符引用；引用同一镜像时必须与 PullImageResponse.image_ref 一致。
    string image_id = 17;
  // 容器初始附加的用户身份信息。
    ContainerUser user = 18;

  // 容器运行时用于终止容器所使用的停止信号。
    Signal stop_signal = 19;
}

// ContainerStatusResponse 是 ContainerStatus RPC 的响应。
message ContainerStatusResponse {
  // 容器状态。
    ContainerStatus status = 1;
  // 容器的额外信息，键任意、值应为 JSON，可含调试信息（如 Linux 容器的 pid）；仅当 verbose=true 时返回非空。
    map<string, string> info = 2;
}

// ContainerResources 保存容器的资源限制配置。
message ContainerResources {
  // Linux 容器的资源限制配置。
    LinuxContainerResources linux = 1;
  // Windows 容器的资源限制配置。
    WindowsContainerResources windows = 2;
}

// ContainerUser 描述容器首个进程初始附加的用户身份。
message ContainerUser {
  // Linux 容器首个进程初始的用户身份。注意：若进程有足够权限，实际运行身份之后可能被改变。
    LinuxContainerUser linux = 1;

  // Windows 容器首个进程初始附加的用户身份。
  // 该字段仅保留供将来使用。
  // WindowsContainerUser windows = 2;
}


// UpdateContainerResourcesRequest 是 UpdateContainerResources RPC 的请求。
message UpdateContainerResourcesRequest {
  // 要更新资源的容器 ID。
    string container_id = 1;
  // Linux 容器的资源配置。
    LinuxContainerResources linux = 2;
  // Windows 容器的资源配置。
    WindowsContainerResources windows = 3;
  // 非结构化键值对，携带更新资源时的额外信息，可用于指定实验性资源或其他选项。
    map<string, string> annotations = 4;
}

// UpdateContainerResourcesResponse 是 UpdateContainerResources RPC 的响应，无返回字段。
message UpdateContainerResourcesResponse {}

// ExecSyncRequest 是 ExecSync RPC 的请求。
message ExecSyncRequest {
  // 要执行命令的容器 ID。
    string container_id = 1;
  // 要执行的命令及参数。
    repeated string cmd = 2;
  // 停止该命令的超时时间，单位秒；默认 0 表示一直运行（永不超时）。
    int64 timeout = 3;
}

// ExecSyncResponse 是 ExecSync RPC 的响应，返回同步命令的输出与退出码。
message ExecSyncResponse {
  // 捕获的命令标准输出。运行时应将输出上限设为 16MB，超出部分丢弃且命令继续执行、不报错（参见 CVE-2022-1708、CVE-2022-31030）。
    bytes stdout = 1;
  // 捕获的命令标准错误。同样限制 16MB，超出部分丢弃且命令继续执行、不报错。
    bytes stderr = 2;
  // 命令结束时的退出码；默认 0 表示成功。
    int32 exit_code = 3;
}

// ExecRequest 是 Exec RPC 的请求，用于准备流式 exec 端点。
message ExecRequest {
  // 要在其中执行命令的容器 ID。
    string container_id = 1;
  // 要执行的命令及参数。
    repeated string cmd = 2;
  // 是否在 TTY 中执行命令。
    bool tty = 3;
  // 是否流式传输 stdin；stdin/stdout/stderr 三者中至少有一个必须为 true。
    bool stdin = 4;
  // 是否流式传输 stdout；三者中至少有一个为 true。
    bool stdout = 5;
  // 是否流式传输 stderr；三者中至少有一个为 true。若 tty=true，则 stderr 必须为 false（不支持多路复用，stdout 与 stderr 会合并为单一流）。
    bool stderr = 6;
}

// ExecResponse 是 Exec RPC 的响应。
message ExecResponse {
  // exec 流式服务端的完整 URL。
    string url = 1;
}

// AttachRequest 是 Attach RPC 的请求，用于准备附加到容器的流式端点。
message AttachRequest {
  // 要附加到的容器 ID。
    string container_id = 1;
  // 是否流式传输 stdin；stdin/stdout/stderr 三者中至少有一个为 true。
    bool stdin = 2;
  // 被附加的进程是否运行在 TTY 中；必须与 ContainerConfig 中的 TTY 设置一致。
    bool tty = 3;
  // 是否流式传输 stdout；三者中至少有一个为 true。
    bool stdout = 4;
  // 是否流式传输 stderr；三者中至少有一个为 true。若 tty=true，则 stderr 必须为 false（不支持多路复用，输出合并为单一流）。
    bool stderr = 5;
}

// AttachResponse 是 Attach RPC 的响应。
message AttachResponse {
  // attach 流式服务端的完整 URL。
    string url = 1;
}

// PortForwardRequest 是 PortForward RPC 的请求。
message PortForwardRequest {
  // 要转发端口的 PodSandbox ID。
    string pod_sandbox_id = 1;
  // 要转发的端口列表。
    repeated int32 port = 2;
}

// PortForwardResponse 是 PortForward RPC 的响应。
message PortForwardResponse {
  // 端口转发流式服务端的完整 URL。
    string url = 1;
}

// ImageFilter 是镜像列表的过滤条件。
message ImageFilter {
  // 要匹配的镜像规格。
    ImageSpec image = 1;
}

// ListImagesRequest 是 ListImages RPC 的请求。
message ListImagesRequest {
  // 镜像列表的过滤条件。
    ImageFilter filter = 1;
}

// Image 包含容器镜像的基本信息。
message Image {
  // 镜像在节点上的唯一标识符引用；引用同一镜像时必须与 PullImageResponse.image_ref 一致。
    string id = 1;
  // 该镜像已知的其他名称（仓库标签）。
    repeated string repo_tags = 2;
  // 该镜像已知的 digest 列表。
    repeated string repo_digests = 3;
  // 镜像大小，单位字节，必须 > 0。
    uint64 size = 4;
  // 运行命令时使用的默认 UID；若创建容器时未指定用户则采用此值。UID 与下面的 username 互斥。
    Int64Value uid = 5;
  // 运行命令时使用的默认用户名；当 UID 未设置且创建容器时未指定用户时使用。
    string username = 6;
  // 该镜像的 ImageSpec（含 annotations）。
    ImageSpec spec = 7;
  // 建议该镜像是否应豁免垃圾回收。仅作为建议：客户端仍可请求删除镜像，运行时必须照办。
    bool pinned = 8;
}

// ListImagesResponse 是 ListImages RPC 的响应。
message ListImagesResponse {
  // 镜像列表。
    repeated Image images = 1;
}

// StreamImagesRequest 是 StreamImages RPC 的请求。
message StreamImagesRequest {
  // 镜像列表的过滤条件。
    ImageFilter filter = 1;
}

// StreamImagesResponse 是 StreamImages RPC 流式响应中的一条消息。
message StreamImagesResponse {
  // 本批返回的镜像列表（至少一项）。
    repeated Image images = 1;
}

// ImageStatusRequest 是 ImageStatus RPC 的请求。
message ImageStatusRequest {
  // 要查询的镜像规格。
    ImageSpec image = 1;
  // 是否返回额外调试信息。
    bool verbose = 2;
}

// ImageStatusResponse 是 ImageStatus RPC 的响应。
message ImageStatusResponse {
  // 镜像状态（镜像不存在时为 nil）。
    Image image = 1;
  // 镜像的额外信息，键任意、值应为 JSON，可含调试信息（如 OCI 镜像的 config）；仅当 verbose=true 时返回非空。
    map<string, string> info = 2;
}

// AuthConfig 包含连接镜像仓库所需的认证信息；标记为 debug_redact 的敏感字段不会被打印。
message AuthConfig {
  // 认证用户名。
    string username = 1;
  // 认证密码（敏感字段，调试输出时会被隐去）。
    string password = 2 [debug_redact = true];
  // 认证字符串（敏感字段，调试输出时会被隐去）。
    string auth = 3 [debug_redact = true];
  // 镜像仓库服务地址。
    string server_address = 4;
  // 用于对用户进行认证并获取仓库访问令牌的身份令牌（敏感字段）。
    string identity_token = 5 [debug_redact = true];
  // 发送给仓库的持有者令牌（敏感字段）。
    string registry_token = 6 [debug_redact = true];
}

// PullImageRequest 是 PullImage RPC 的请求。
message PullImageRequest {
  // 要拉取的镜像规格。
    ImageSpec image = 1;
  // 拉取镜像时使用的认证配置。
    AuthConfig auth = 2;
  // 沙箱配置，用于在 PodSandbox 上下文中拉取镜像。
    PodSandboxConfig sandbox_config = 3;
}

// PullImageResponse 是 PullImage RPC 的响应。
message PullImageResponse {
  // 镜像在节点上的唯一标识符引用。引用同一镜像时，运行时必须在 Image.id、Container.image_id、ContainerStatus.image_id 和 PullImageResponse.image_ref 中返回相同的值。注意：从 v1.36 起该字段语义更严格，此前它可能是 image ID 或 digest（二者不同），不保证与其他 ID 字段匹配。
    string image_ref = 1;
}

// RemoveImageRequest 是 RemoveImage RPC 的请求。
message RemoveImageRequest {
  // 要删除的镜像规格。
    ImageSpec image = 1;
}

// RemoveImageResponse 是 RemoveImage RPC 的响应，无返回字段。
message RemoveImageResponse {}

// NetworkConfig 描述运行时使用的网络配置。
message NetworkConfig {
  // 用于分配 Pod IP 的 CIDR；为空时运行时应忽略该字段。
    string pod_cidr = 1;
}

// RuntimeConfig 是运行时配置的顶层结构。
message RuntimeConfig {
  // 网络相关配置。
    NetworkConfig network_config = 1;
}

// UpdateRuntimeConfigRequest 是 UpdateRuntimeConfig RPC 的请求。
message UpdateRuntimeConfigRequest {
  // 要更新的运行时配置。
    RuntimeConfig runtime_config = 1;
}

// UpdateRuntimeConfigResponse 是 UpdateRuntimeConfig RPC 的响应，无返回字段。
message UpdateRuntimeConfigResponse {}

// RuntimeCondition 描述运行时的一个条件状态。
// 必需条件包括 RuntimeReady（运行时已就绪，可接受仅需宿主机网络等基础容器）和 NetworkReady（运行时网络已就绪，可接受需要容器网络的容器）；任一必需条件不满足，节点即为 NotReady。
// 其余类型均为可选条件，仅向用户展示状态，kubelet 不依赖它们。
message RuntimeCondition {
  // 条件类型（如 RuntimeReady、NetworkReady 或自定义类型）。
    string type = 1;
  // 条件状态，true/false；默认 false。
    bool status = 2;
  // 简短 CamelCase 字符串，说明条件最近一次状态变化的原因。
    string reason = 3;
  // 人类可读的消息，描述最近一次状态变化的详细信息。
    string message = 4;
}

// RuntimeStatus 描述运行时的当前状态。
message RuntimeStatus {
  // 当前观测到的运行时条件列表。
    repeated RuntimeCondition conditions = 1;
}

// StatusRequest 是 Status RPC 的请求。
message StatusRequest {
  // 是否返回额外调试信息（填入响应 info 字段）。
    bool verbose = 1;
}

// RuntimeHandlerFeatures 描述某个运行时处理器所支持的可选特性。
message RuntimeHandlerFeatures {
  // 该运行时处理器是否支持递归只读挂载。对 runc 兼容的运行时，可通过内核版本 >= 5.12，
  // 且 `runc features | jq .mountOptions` 的输出包含 "rro" 来判定。
    bool recursive_read_only_mounts = 1;

  // 该运行时处理器是否支持 Kubernetes 实现中的 user namespace（同时要求支持 user namespace 与 idmap 挂载）。
    bool user_namespaces = 2;
}

// RuntimeHandler 描述一个具名运行时处理器及其支持的特性。
message RuntimeHandler {
  // 处理器名称，在 StatusResponse 中必须唯一；空字符串表示默认处理器。
    string name = 1;
  // 该处理器支持的特性。
    RuntimeHandlerFeatures features = 2;
}

// RuntimeFeatures 描述 CRI 实现整体支持（与具体运行时处理器无关）的特性集合。
message RuntimeFeatures {
  // 运行时是否支持 SupplementalGroupsPolicy 与 ContainerUser。
    bool supplemental_groups_policy = 1;
  // 运行时是否支持容器同时使用宿主机网络与 user namespace。
    bool user_namespaces_host_network = 2;
  // 运行时是否支持在容器挂载上使用额外的绑定挂载选项（noexec、nodev、nosuid）。
    bool mount_options = 3;
}

// StatusResponse 是 Status RPC 的响应，包含运行时状态、调试信息、处理器列表与特性。
message StatusResponse {
  // 运行时状态。
    RuntimeStatus status = 1;
  // 运行时的额外信息，键任意、值应为 JSON，可含调试信息（如运行时使用的插件）；仅当 verbose=true 时返回非空。
    map<string, string> info = 2;
  // 运行时处理器列表。
    repeated RuntimeHandler runtime_handlers = 3;
  // CRI 实现的特性集合，预期会传播到 Kubernetes API 的 NodeFeatures。
    RuntimeFeatures features = 4;
}

// ImageFsInfoRequest 是 ImageFsInfo RPC 的请求，无字段。
message ImageFsInfoRequest {}

// UInt64Value 是 uint64 的包装类型。
message UInt64Value {
  // uint64 值。
    uint64 value = 1;
}

// FilesystemIdentifier 唯一标识一个文件系统。
message FilesystemIdentifier{
  // 文件系统的挂载点。
    string mountpoint = 1;
}

// FilesystemUsage 提供文件系统的使用信息。
message FilesystemUsage {
  // 采集该信息的时间戳，单位纳秒，必须 > 0。
    int64 timestamp = 1;
  // 文件系统的唯一标识符。
    FilesystemIdentifier fs_id = 2;
  // 文件系统上被镜像占用的字节数；可能与文件系统总用量不同，也不一定等于 CapacityBytes - AvailableBytes。
    UInt64Value used_bytes = 3;
  // 镜像占用的 inode 数；可能不等于 InodesCapacity - InodesAvailable，因为底层文件系统可能还用于其他用途。
    UInt64Value inodes_used = 4;
}

// WindowsFilesystemUsage 提供 Windows 特有的文件系统使用信息。
message WindowsFilesystemUsage {
  // 采集该信息的时间戳，单位纳秒，必须 > 0。
    int64 timestamp = 1;
  // 文件系统的唯一标识符。
    FilesystemIdentifier fs_id = 2;
  // 文件系统上被镜像占用的字节数；可能与总用量不同，也不一定等于 CapacityBytes - AvailableBytes。
    UInt64Value used_bytes = 3;
}

// ImageFsInfoResponse 是 ImageFsInfo RPC 的响应。
message ImageFsInfoResponse {
  // 镜像文件系统信息列表。
    repeated FilesystemUsage image_filesystems = 1;
  // 容器文件系统信息列表（可选，例如容器与镜像存储分离时可填），默认返回空。
    repeated FilesystemUsage container_filesystems = 2;
}

// ContainerStatsRequest 是 ContainerStats RPC 的请求。
message ContainerStatsRequest{
  // 要查询统计的容器 ID。
    string container_id = 1;
}

// ContainerStatsResponse 是 ContainerStats RPC 的响应。
message ContainerStatsResponse {
  // 容器的资源使用统计。
    ContainerStats stats = 1;
}

// ListContainerStatsRequest 是 ListContainerStats RPC 的请求。
message ListContainerStatsRequest{
  // 容器列表的过滤条件。
    ContainerStatsFilter filter = 1;
}

// ContainerStatsFilter 用于过滤要查询统计的容器，所有字段按 AND 组合。
message ContainerStatsFilter {
  // 容器 ID。
    string id = 1;
  // 所属 PodSandbox 的 ID。
    string pod_sandbox_id = 2;
  // 按标签选择匹配项，目前仅支持 api.MatchLabels（AND 关系），不支持 MatchExpressions。
    map<string, string> label_selector = 3;
}

// ListContainerStatsResponse 是 ListContainerStats RPC 的响应。
message ListContainerStatsResponse {
  // 容器的统计列表。
    repeated ContainerStats stats = 1;
}

// StreamContainerStatsRequest 是 StreamContainerStats RPC 的请求。
message StreamContainerStatsRequest {
  // 列表请求的过滤条件。
    ContainerStatsFilter filter = 1;
}

// StreamContainerStatsResponse 是 StreamContainerStats RPC 流式响应中的一条消息。
message StreamContainerStatsResponse {
  // 本批返回的容器统计列表（至少一项）。
    repeated ContainerStats container_stats = 1;
}

// ContainerAttributes 提供容器的基本标识信息，用于统计数据中关联对象。
message ContainerAttributes {
  // 容器 ID。
    string id = 1;
  // 容器元数据。
    ContainerMetadata metadata = 2;
  // 用于圈定和选择资源的标签键值对。
    map<string,string> labels = 3;
  // 非结构化元数据。运行时不得修改，必须与创建该容器的 ContainerConfig 中的值完全一致。
    map<string,string> annotations = 4;
}

// ContainerStats 提供容器的资源使用统计。
message ContainerStats {
  // 该容器的基本信息。
    ContainerAttributes attributes = 1;
  // 容器的 CPU 使用统计。
    CpuUsage cpu = 2;
  // 容器的内存使用统计。
    MemoryUsage memory = 3;
  // 可写层（容器文件系统）的使用情况。
    FilesystemUsage writable_layer = 4;
  // 容器的交换空间使用统计。
    SwapUsage swap = 5;
  // 容器的 IO 使用统计（主要用于 PSI）。
    IoUsage io = 6;
}

// WindowsContainerStats 提供 Windows 容器的资源使用统计。
message WindowsContainerStats {
  // 容器的基本信息。
    ContainerAttributes attributes = 1;
  // 容器的 CPU 使用统计（Windows 版）。
    WindowsCpuUsage cpu = 2;
  // 容器的内存使用统计（Windows 版）。
    WindowsMemoryUsage memory = 3;
  // 可写层的使用情况（Windows 版）。
    WindowsFilesystemUsage writable_layer = 4;
}

// PsiStats 保存单个资源的 PSI（压力停滞信息）统计，分别统计全部任务与部分任务。
message PsiStats {
  // cgroup 中所有任务因资源压力而停滞的 PSI 数据。
	PsiData Full = 1;
  // cgroup 中部分任务因资源压力而停滞的 PSI 数据。
	PsiData Some = 2;
}

// PsiData 保存 PSI 的具体数值（累计停滞时间与多个时间窗口的平均值）。
message PsiData {
  // cgroup 中任务因资源竞争而等待的总时长，单位纳秒。
	uint64 Total = 1;
  // 最近 10 秒窗口内任务因竞争而等待的平均百分比。
	double Avg10 = 2;
  // 最近 60 秒窗口内的平均等待百分比。
	double Avg60 = 3;
  // 最近 300 秒窗口内的平均等待百分比。
	double Avg300 = 4;
}

// CpuUsage 提供 CPU 使用信息。
message CpuUsage {
  // 采集该信息的时间戳，单位纳秒，必须 > 0。
    int64 timestamp = 1;
  // 自对象创建以来的累计 CPU 使用量（所有核之和），单位为核心·纳秒。
    UInt64Value usage_core_nano_seconds = 2;
  // 采样窗口内所有核的平均 CPU 使用量，可理解为每秒的核心·纳秒数。
    UInt64Value usage_nano_cores = 3;
  // CPU 的 PSI 统计。
    PsiStats psi = 4;
}

// WindowsCpuUsage 提供 Windows 特有的 CPU 使用信息。
message WindowsCpuUsage {
  // 采集该信息的时间戳，单位纳秒，必须 > 0。
    int64 timestamp = 1;
  // 自对象创建以来的累计 CPU 使用量（所有核之和）。
    UInt64Value usage_core_nano_seconds = 2;
  // 采样窗口内所有核的平均 CPU 使用量，可理解为每秒的核心·纳秒数。
    UInt64Value usage_nano_cores = 3;
}

// MemoryUsage 提供内存使用信息。
message MemoryUsage {
  // 采集该信息的时间戳，单位纳秒，必须 > 0。
    int64 timestamp = 1;
  // 工作集内存大小，单位字节。
    UInt64Value working_set_bytes = 2;
  // 可用内存 = 内存限制 - workingSetBytes。
    UInt64Value available_bytes = 3;
  // 总使用内存，包含所有内存（不论何时被访问）。
    UInt64Value usage_bytes = 4;
  // 匿名页与交换缓存内存量（含透明大页）。
    UInt64Value rss_bytes = 5;
  // 累计次要缺页次数。
    UInt64Value page_faults = 6;
  // 累计主要缺页次数。
    UInt64Value major_page_faults = 7;
  // 内存的 PSI 统计。
    PsiStats psi = 8;
}

// IoUsage 提供 IO 使用统计（当前主要为 IO 的 PSI 数据）。
message IoUsage {
  // 采集该信息的时间戳，单位纳秒，必须 > 0。
    int64 timestamp = 1;
  // IO 的 PSI 统计。
    PsiStats psi = 2;
}

// SwapUsage 提供交换空间（swap）的使用统计。
message SwapUsage {
  // 采集该信息的时间戳，单位纳秒，必须 > 0。
    int64 timestamp = 1;
  // 可用 swap = swap 限制 - swapUsageBytes。
    UInt64Value swap_available_bytes = 2;
  // 当前使用的 swap 总量，包含所有已用 swap（不论访问时间）。
    UInt64Value swap_usage_bytes = 3;
}

// WindowsMemoryUsage 提供 Windows 特有的内存使用信息。
message WindowsMemoryUsage {
  // 采集该信息的时间戳，单位纳秒，必须 > 0。
    int64 timestamp = 1;
  // 工作集内存大小，单位字节。
    UInt64Value working_set_bytes = 2;
  // 可用内存 = 内存限制 - commit_memory_bytes。
    UInt64Value available_bytes = 3;
  // 累计缺页次数。
    UInt64Value page_faults = 4;
  // 已提交的内存总量（物理内存与虚拟内存之和）。
    UInt64Value commit_memory_bytes = 5;
}

// ReopenContainerLogRequest 是 ReopenContainerLog RPC 的请求。
message ReopenContainerLogRequest {
  // 要重新打开日志的容器 ID。
    string container_id = 1;
}

// ReopenContainerLogResponse 是 ReopenContainerLog RPC 的响应，无返回字段。
message ReopenContainerLogResponse{
}

// CheckpointContainerRequest 是 CheckpointContainer RPC 的请求。
message CheckpointContainerRequest {
  // 要创建检查点的容器 ID。
    string container_id = 1;
  // 导出的检查点归档文件存放位置。
    string location = 2;
  // 检查点完成的超时时间，单位秒。0 表示使用 CRI 默认值；> 0 表示使用用户指定的超时。
    int64 timeout = 3;
}

// CheckpointContainerResponse 是 CheckpointContainer RPC 的响应，无返回字段。
message CheckpointContainerResponse {}

// CheckpointPodRequest 是 CheckpointPod RPC 的请求。
message CheckpointPodRequest {
  // 要创建检查点的 pod 沙箱 ID。
    string pod_sandbox_id = 1;
  // 一个已存在的空目录的绝对路径，运行时必须将检查点写入其中。调用方拥有该目录并使其对运行时可写，且应仅允许调用方和运行时访问；运行时不得删除该目录。Pod 检查点是运行时自定义文件的集合，其布局与格式对调用方不透明；运行时不得写入该目录之外，且出错返回前必须清理部分产物。
    string output_path = 2;
  // 要纳入检查点的容器 ID 列表。必须非空、无重复，且恰为调用方选定的运行中容器；每个容器都必须属于 pod_sandbox_id 且处于运行状态，否则运行时必须失败且不生成检查点。
    repeated string container_ids = 3;
  // 可选：CRI 调用方提供的运行时特有检查点选项（不透明键值对）。键在沙箱运行时处理器的范围内解释；Kubernetes alpha API 不暴露这些选项，kubelet 发送空 map。直接 CRI 调用方可设置运行时文档化的键；运行时必须拒绝不支持/无效的键值而非静默忽略；选项中不得包含机密信息。
    map<string, string> options = 4;
}

// CheckpointPodResponse 是 CheckpointPod RPC 的响应，为空：检查点写在调用方提供且已知的 output_path 目录中，无需返回额外位置或对象名。
message CheckpointPodResponse {}

// RestorePodRequest 是 RestorePod RPC 的请求。
message RestorePodRequest {
  // 包含待恢复检查点数据的目录绝对路径。运行时不得修改检查点数据，其格式与布局由运行时定义。
    string checkpoint_path = 1;
  // kubelet 提供的沙箱配置，含恢复时的节点本地更新（新的 Pod UID、父 cgroup 路径、日志目录）。现网 Pod 与被引用 PodCheckpoint 的 status.checkpointedPodTemplate 之间 Pod spec 的一致性由 API 服务器准入时强制（kubelet 调用前会再次检查），不允许任意用户覆盖。
    PodSandboxConfig config = 2;
  // 恢复沙箱及其容器所用的运行时处理器，选择能解释运行时特有检查点数据的实现；所选处理器必须与检查点兼容，运行时必须拒绝无法恢复的检查点。空值选择默认处理器（同 RunPodSandboxRequest），未知的非空处理器必须拒绝。
    string runtime_handler = 3;
  // 可选：CRI 调用方提供的运行时特有恢复选项（不透明键值对），键在 runtime_handler 范围内解释。Kubernetes alpha API 不暴露这些选项，kubelet 发送空 map；直接 CRI 调用方可设置所选运行时文档化的键；运行时必须拒绝不支持/无效的键值而非静默忽略；选项中不得包含机密信息。
    map<string, string> options = 4;
  // 检查点所表示的全部容器在恢复时的完整配置，列表必须非空；每项的 metadata.name 必须非空且唯一，且恰为检查点中的容器名集合。运行时按 metadata.name 匹配容器。检查点对文件系统与进程状态具有权威性；镜像、命令、参数、工作目录、环境与进程凭据仅描述预期被检查点的进程，不得启动或更改它，运行时能校验的不一致必须导致恢复失败。运行时应用检查点不拥有的恢复期设置（标签、注解、挂载、设备、Linux 资源、日志、安全约束等），与检查点不兼容的设置必须失败。
    repeated ContainerConfig container_configs = 5;
}

// RestoredContainer 描述一个被恢复的容器及其运行时 ID。
message RestoredContainer {
  // 来自恢复后容器 ContainerMetadata 的名称，用于标识是哪个请求的容器配置产生了该运行时 ID。
    string name = 1;
  // 被恢复容器的非空运行时 ID。
    string container_id = 2;
}

// RestorePodResponse 是 RestorePod RPC 的响应。
message RestorePodResponse {
  // 被恢复 pod 沙箱的非空 ID。
    string pod_sandbox_id = 1;
  // 处于 CREATED 状态、尚未执行恢复进程的容器列表（见 RestorePod）。请求中每个 container_configs 条目恰对应一项；名称与容器 ID 均须非空且唯一。
    repeated RestoredContainer restored_containers = 2;
}

// GetEventsRequest 是 GetContainerEvents RPC 的请求，无字段。
message GetEventsRequest {}

// ContainerEventResponse 是 GetContainerEvents 流中的一条容器事件。
message ContainerEventResponse {
  // 发生事件的容器 ID。
    string container_id = 1;

  // 容器事件类型。
    ContainerEventType container_event_type = 2;

  // 该事件的创建时间戳，单位纳秒。
    int64 created_at = 3;

  // 事件发生时沙箱的状态。
    PodSandboxStatus pod_sandbox_status = 4;

  // 事件发生时沙箱内各容器的状态列表。
    repeated ContainerStatus containers_statuses = 5;
}

// ContainerEventType 枚举定义容器生命周期事件的类型。
enum ContainerEventType {
  // 容器已创建事件。
    CONTAINER_CREATED_EVENT = 0;

  // 容器已启动事件。
    CONTAINER_STARTED_EVENT = 1;

  // 容器已停止事件。
    CONTAINER_STOPPED_EVENT = 2;

  // 容器已删除事件。
    CONTAINER_DELETED_EVENT = 3;
}

// ListMetricDescriptorsRequest 是 ListMetricDescriptors RPC 的请求，无字段。
message ListMetricDescriptorsRequest {}

// ListMetricDescriptorsResponse 是 ListMetricDescriptors RPC 的响应。
message ListMetricDescriptorsResponse {
  // 指标描述符列表。
    repeated MetricDescriptor descriptors = 1;
}

// MetricDescriptor 描述一个指标的名称、帮助文本与标签键集合。
message MetricDescriptor {
  // 指标名称，作为该描述符的唯一标识，并与 Metric 结构一起用于填充完整指标。
    string name = 1;
  // 指标的帮助/说明文本。
    string help = 2;
  // 使用该描述符的指标只能定义这里声明过的标签键。运行时负责对键和值分别保持排序；若两个切片长度不同，行为未定义。
    repeated string label_keys = 3;
}

// ListPodSandboxMetricsRequest 是 ListPodSandboxMetrics RPC 的请求，无字段。
message ListPodSandboxMetricsRequest {}

// ListPodSandboxMetricsResponse 是 ListPodSandboxMetrics RPC 的响应。
message ListPodSandboxMetricsResponse {
  // 各 pod 沙箱的指标列表。
    repeated PodSandboxMetrics pod_metrics = 1;
}

// StreamPodSandboxMetricsRequest 是 StreamPodSandboxMetrics RPC 的请求，无字段。
message StreamPodSandboxMetricsRequest {}

// StreamPodSandboxMetricsResponse 是 StreamPodSandboxMetrics RPC 流式响应中的一条消息。
message StreamPodSandboxMetricsResponse {
  // 本批返回的 pod 沙箱指标列表（至少一项）。
    repeated PodSandboxMetrics pod_sandbox_metrics = 1;
}

// PodSandboxMetrics 保存单个 pod 沙箱及其容器的指标。
message PodSandboxMetrics {
  // 该沙箱的 ID。
    string pod_sandbox_id = 1;
  // 沙箱级别的指标列表。
    repeated Metric metrics = 2;
  // 沙箱内各容器的指标列表。
    repeated ContainerMetrics container_metrics = 3;
}

// ContainerMetrics 保存单个容器的指标。
message ContainerMetrics {
  // 容器 ID。
    string container_id = 1;
  // 该容器的指标列表。
    repeated Metric metrics = 2;
}

// Metric 表示一个具体的指标采样值。
message Metric {
  // 指标名称，必须匹配此前 MetricDescriptors 调用返回的名称，否则该指标会被忽略。
    string name = 1;
  // 若指标为实时采集则应为 0；若为缓存值，则应为采集时的纳秒时间戳。
    int64 timestamp = 2;
  // 指标类型（计数器或仪表）。
    MetricType metric_type = 3;
  // 与 MetricDescriptor 中 label_keys 对应的标签值。运行时负责对键和值分别保持排序；两个切片长度不同时行为未定义。
    repeated string label_values = 4;
  // 指标的值。
    UInt64Value value = 5;
}

// MetricType 枚举定义指标的类型。
enum MetricType {
  // 计数器类型（只增不减的累计值）。
    COUNTER = 0;
  // 仪表类型（可增可减的瞬时值）。
    GAUGE = 1;
}

// RuntimeConfigRequest 是 RuntimeConfig RPC 的请求，无字段。
message RuntimeConfigRequest {}

// RuntimeConfigResponse 是 RuntimeConfig RPC 的响应。
message RuntimeConfigResponse {
  // 基于 Linux 的运行时的配置信息，包含不特定于具体运行时处理器的全局选项。
    LinuxRuntimeConfiguration linux = 1;
}

// LinuxRuntimeConfiguration 保存 Linux 运行时的全局配置。
message LinuxRuntimeConfiguration {
  // 要使用的 cgroup 驱动。注意：该字段在 kubelet 生命周期内、或存在运行中容器时不应改变。kubelet 启动时获取一次后不再请求，并按静态值构造 cgroup 层级。若运行时希望更改，必须同时移除所有 pod 并重启 kubelet（最简单的方式是重启整个节点）。
    CgroupDriver cgroup_driver = 1;
}

// CgroupDriver 枚举定义 Linux 使用的 cgroup 驱动类型。
enum CgroupDriver {
  // systemd cgroup 驱动。
    SYSTEMD = 0;
  // cgroupfs cgroup 驱动。
    CGROUPFS = 1;
}

// UpdatePodSandboxResourcesRequest 是 UpdatePodSandboxResources RPC 的请求。
message UpdatePodSandboxResourcesRequest {
  // 要更新资源的 PodSandbox ID。
    string pod_sandbox_id = 1;

  // 可选：与该沙箱关联的开销资源。
    LinuxContainerResources overhead = 2;
  // 可选：该沙箱所有容器资源的总和。
    LinuxContainerResources resources = 3;
}

// UpdatePodSandboxResourcesResponse 是 UpdatePodSandboxResources RPC 的响应，无返回字段。
message UpdatePodSandboxResourcesResponse {}
