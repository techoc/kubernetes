    SIGNAL_SIGRTMINPLUS10    = 45;
  // SIGRTMIN+11：相对 SIGRTMIN 偏移 11 的实时信号。
    SIGNAL_SIGRTMINPLUS11    = 46;
  // SIGRTMIN+12：相对 SIGRTMIN 偏移 12 的实时信号。
    SIGNAL_SIGRTMINPLUS12    = 47;
  // SIGRTMIN+13：相对 SIGRTMIN 偏移 13 的实时信号。
    SIGNAL_SIGRTMINPLUS13    = 48;
  // SIGRTMIN+14：相对 SIGRTMIN 偏移 14 的实时信号。
    SIGNAL_SIGRTMINPLUS14    = 49;
  // SIGRTMIN+15：相对 SIGRTMIN 偏移 15 的实时信号。
    SIGNAL_SIGRTMINPLUS15    = 50;
  // SIGRTMAX-14：距最大实时信号偏移 14 的实时信号。
    SIGNAL_SIGRTMAXMINUS14   = 51;
  // SIGRTMAX-13：距最大实时信号偏移 13 的实时信号。
