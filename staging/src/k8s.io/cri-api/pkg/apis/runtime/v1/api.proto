// CreateContainerRequest 是 CreateContainer RPC 的请求。
message CreateContainerRequest {
    // ID of the PodSandbox in which the container should be created.
  // 要在其中创建容器的 PodSandbox ID。
    string pod_sandbox_id = 1;
    // Config of the container.
  // 容器的配置。
    ContainerConfig config = 2;
    // Config of the PodSandbox. This is the same config that was passed
    // to RunPodSandboxRequest to create the PodSandbox. It is passed again
    // here just for easy reference. The PodSandboxConfig is immutable and
    // remains the same throughout the lifetime of the pod.
  // 沙箱配置，与创建该沙箱时传给 RunPodSandboxRequest 的完全相同，此处再次传入仅为方便引用。PodSandboxConfig 在 pod 生命周期内不可变。
    PodSandboxConfig sandbox_config = 3;
}

// CreateContainerResponse 是 CreateContainer RPC 的响应。
message CreateContainerResponse {
    // ID of the created container.
  // 新建容器的 ID。
    string container_id = 1;
}

// StartContainerRequest 是 StartContainer RPC 的请求。
message StartContainerRequest {
    // ID of the container to start.
  // 要启动的容器 ID。
    string container_id = 1;
}

// StartContainerResponse 是 StartContainer RPC 的响应，无返回字段。
message StartContainerResponse {}

// StopContainerRequest 是 StopContainer RPC 的请求。
message StopContainerRequest {
    // ID of the container to stop.
  // 要停止的容器 ID。
    string container_id = 1;
    // Timeout in seconds to wait for the container to stop before forcibly
    // terminating it. Default: 0 (forcibly terminate the container immediately)
  // 等待容器停止的超时时间，单位秒；超时后强制终止。默认 0 表示立即强制终止。
    int64 timeout = 2;
}

// StopContainerResponse 是 StopContainer RPC 的响应，无返回字段。
message StopContainerResponse {}

// RemoveContainerRequest 是 RemoveContainer RPC 的请求。
message RemoveContainerRequest {
    // ID of the container to remove.
  // 要删除的容器 ID。
    string container_id = 1;
}

// RemoveContainerResponse 是 RemoveContainer RPC 的响应，无返回字段。
message RemoveContainerResponse {}

// ContainerState 枚举定义容器的生命周期状态。
enum ContainerState {
  // 已创建：容器已创建但进程尚未启动。
    CONTAINER_CREATED = 0;
  // 运行中：容器进程正在运行。
    CONTAINER_RUNNING = 1;
  // 已退出：容器进程已结束。
    CONTAINER_EXITED  = 2;
  // 未知：容器状态无法确定。
    CONTAINER_UNKNOWN = 3;
}

// ContainerStateValue is the wrapper of ContainerState.
// ContainerStateValue 是 ContainerState 的包装类型，用于过滤器中表达状态条件。
message ContainerStateValue {
    // State of the container.
  // 容器状态。
    ContainerState state = 1;
}

// ContainerFilter is used to filter containers.
// All those fields are combined with 'AND'
// ContainerFilter 用于过滤容器列表，所有字段按 AND 组合。
message ContainerFilter {
    // ID of the container.
  // 容器 ID。
    string id = 1;
    // State of the container.
  // 容器状态。
    ContainerStateValue state = 2;
    // ID of the PodSandbox.
  // 所属 PodSandbox 的 ID。
    string pod_sandbox_id = 3;
    // LabelSelector to select matches.
    // Only api.MatchLabels is supported for now and the requirements
    // are ANDed. MatchExpressions is not supported yet.
  // 按标签选择匹配项。目前仅支持 api.MatchLabels（AND 关系），不支持 MatchExpressions。
    map<string, string> label_selector = 4;
}

// ListContainersRequest 是 ListContainers RPC 的请求。
message ListContainersRequest {
  // 容器列表的过滤条件。
    ContainerFilter filter = 1;
}

// Container provides the runtime information for a container, such as ID, hash,
// state of the container.
// Container 提供容器的运行时信息（ID、镜像、状态等），用于列表类响应。
message Container {
    // ID of the container, used by the container runtime to identify
    // a container.
  // 容器 ID，由运行时分配用于标识容器。
    string id = 1;
    // ID of the sandbox to which this container belongs.
  // 该容器所属沙箱的 ID。
    string pod_sandbox_id = 2;
    // Metadata of the container.
  // 容器元数据。
    ContainerMetadata metadata = 3;
    // Spec of the image.
  // 镜像的规格（ImageSpec）。
    ImageSpec image = 4;
    // Digested reference to the image in use.
  // 所使用镜像的 digest 引用。
    string image_ref = 5;
    // State of the container.
  // 容器状态。
    ContainerState state = 6;
    // Creation time of the container in nanoseconds.
  // 容器创建时间，单位纳秒。
    int64 created_at = 7;
    // Key-value pairs that may be used to scope and select individual resources.
  // 用于圈定和选择资源的标签键值对。
    map<string, string> labels = 8;
    // Unstructured key-value map holding arbitrary metadata.
    // Annotations MUST NOT be altered by the runtime; the value of this field
    // MUST be identical to that of the corresponding ContainerConfig used to
    // instantiate this Container.
  // 非结构化元数据。运行时不得修改，必须与创建该容器的 ContainerConfig 中的值完全一致。
    map<string, string> annotations = 9;
    // Reference to the unique identifier of the image on the node, as
    // returned in the image and runtime service apis.
    //
    // This value MUST always match `PullImageResponse.image_ref` when referring
    // to the same image.
  // 镜像在节点上的唯一标识符引用（由镜像/运行时服务 API 返回）。引用同一镜像时，该值必须始终与 PullImageResponse.image_ref 一致。
    string image_id = 10;
}

// ListContainersResponse 是 ListContainers RPC 的响应。
message ListContainersResponse {
    // List of containers.
  // 容器列表。
    repeated Container containers = 1;
}

// StreamContainersRequest 是 StreamContainers RPC 的请求。
message StreamContainersRequest {
    // Filter for the list request.
  // 列表请求的过滤条件。
    ContainerFilter filter = 1;
}

// StreamContainersResponse 是 StreamContainers RPC 流式响应中的一条消息。
message StreamContainersResponse {
    // List of containers.
  // 本批返回的容器列表（至少一项）。
    repeated Container containers = 1;
}

// ContainerStatusRequest 是 ContainerStatus RPC 的请求。
message ContainerStatusRequest {
    // ID of the container for which to retrieve status.
  // 要查询状态的容器 ID。
    string container_id = 1;
    // Verbose indicates whether to return extra information about the container.
  // 是否返回额外调试信息（填入响应的 info 字段）。
    bool verbose = 2;
}

// ContainerStatus represents the status of a container.
// ContainerStatus 表示容器的详细状态信息。
message ContainerStatus {
    // ID of the container.
  // 容器 ID。
    string id = 1;
    // Metadata of the container.
  // 容器元数据。
    ContainerMetadata metadata = 2;
    // Status of the container.
  // 容器状态。
    ContainerState state = 3;
    // Creation time of the container in nanoseconds.
  // 容器创建时间，单位纳秒。
    int64 created_at = 4;
    // Start time of the container in nanoseconds. Default: 0 (not specified).
  // 容器启动时间，单位纳秒；默认 0 表示未指定（尚未启动）。
    int64 started_at = 5;
    // Finish time of the container in nanoseconds. Default: 0 (not specified).
  // 容器结束时间，单位纳秒；默认 0 表示未指定（尚未结束）。
    int64 finished_at = 6;
    // Exit code of the container. Only required when finished_at != 0. Default: 0.
  // 容器退出码；仅当 finished_at != 0 时必填，默认 0。
    int32 exit_code = 7;
    // Spec of the image.
  // 镜像规格。
    ImageSpec image = 8;
    // Digested reference to the image in use.
  // 所使用镜像的 digest 引用。
    string image_ref = 9;
    // Brief CamelCase string explaining why container is in its current state.
    // Must be set to "OOMKilled" for containers terminated by cgroup-based Out-of-Memory killer.
  // 简短的 CamelCase 字符串，说明容器处于当前状态的原因；被基于 cgroup 的 OOM killer 终止的容器必须设为 "OOMKilled"。
    string reason = 10;
    // Human-readable message indicating details about why container is in its
    // current state.
  // 人类可读的消息，说明容器处于当前状态的详细信息。
    string message = 11;
    // Key-value pairs that may be used to scope and select individual resources.
  // 用于圈定和选择资源的标签键值对。
    map<string,string> labels = 12;
    // Unstructured key-value map holding arbitrary metadata.
    // Annotations MUST NOT be altered by the runtime; the value of this field
    // MUST be identical to that of the corresponding ContainerConfig used to
    // instantiate the Container this status represents.
  // 非结构化元数据。运行时不得修改，必须与创建该容器的 ContainerConfig 中的值完全一致。
    map<string,string> annotations = 13;
    // Mounts for the container.
  // 容器的挂载列表。
    repeated Mount mounts = 14;
    // Log path of container.
  // 容器的日志路径。
    string log_path = 15;
    // Resource limits configuration of the container.
  // 容器的资源限制配置。
    ContainerResources resources = 16;
    // Reference to the unique identifier of the image on the node, as
    // returned in the image and runtime service apis.
    //
    // This value MUST always match `PullImageResponse.image_ref` when referring
    // to the same image.
  // 镜像在节点上的唯一标识符引用；引用同一镜像时必须与 PullImageResponse.image_ref 一致。
    string image_id = 17;
    // User identities initially attached to the container
  // 容器初始附加的用户身份信息。
    ContainerUser user = 18;

    // Returns the stop signal used by the container runtime to terminate the container 
  // 容器运行时用于终止容器所使用的停止信号。
    Signal stop_signal = 19;
}

// ContainerStatusResponse 是 ContainerStatus RPC 的响应。
message ContainerStatusResponse {
    // Status of the container.
  // 容器状态。
    ContainerStatus status = 1;
    // Info is extra information of the Container. The key could be arbitrary string, and
    // value should be in json format. The information could include anything useful for
    // debug, e.g. pid for linux container based container runtime.
    // It should only be returned non-empty when Verbose is true.
  // 容器的额外信息，key 任意、value 应为 JSON，可含调试信息（如 Linux 容器的 pid）；仅当 verbose=true 时返回非空。
    map<string, string> info = 2;
}

// ContainerResources holds resource limits configuration for a container.
// ContainerResources 保存容器的资源限制配置。
message ContainerResources {
    // Resource limits configuration specific to Linux container.
  // Linux 容器的资源限制配置。
    LinuxContainerResources linux = 1;
    // Resource limits configuration specific to Windows container.
  // Windows 容器的资源限制配置。
    WindowsContainerResources windows = 2;
}

// ContainerUser 描述容器首个进程初始附加的用户身份。
message ContainerUser {
    // User identities initially attached to first process in the Linux container.
    // Note that the actual running identity can be changed if the process has enough privilege to do so.
  // Linux 容器首个进程初始的用户身份。注意：若进程有足够权限，实际运行身份之后可能被改变。
    LinuxContainerUser linux = 1;

    // User identities initially attached to first process in the Windows container
    // This is just reserved for future use.
    // WindowsContainerUser windows = 2;
}


// UpdateContainerResourcesRequest 是 UpdateContainerResources RPC 的请求。
message UpdateContainerResourcesRequest {
    // ID of the container to update.
  // 要更新资源的容器 ID。
    string container_id = 1;
    // Resource configuration specific to Linux containers.
  // Linux 容器的资源配置。
    LinuxContainerResources linux = 2;
    // Resource configuration specific to Windows containers.
  // Windows 容器的资源配置。
    WindowsContainerResources windows = 3;
    // Unstructured key-value map holding arbitrary additional information for
    // container resources updating. This can be used for specifying experimental
    // resources to update or other options to use when updating the container.
  // 非结构化键值对，携带更新资源时的额外信息，可用于指定实验性资源或其他选项。
    map<string, string> annotations = 4;
}

// UpdateContainerResourcesResponse 是 UpdateContainerResources RPC 的响应，无返回字段。
message UpdateContainerResourcesResponse {}

// ExecSyncRequest 是 ExecSync RPC 的请求。
message ExecSyncRequest {
    // ID of the container.
  // 要执行命令的容器 ID。
    string container_id = 1;
    // Command to execute.
  // 要执行的命令及参数。
    repeated string cmd = 2;
    // Timeout in seconds to stop the command. Default: 0 (run forever).
  // 停止该命令的超时时间，单位秒；默认 0 表示一直运行（永不超时）。
    int64 timeout = 3;
}

// ExecSyncResponse 是 ExecSync RPC 的响应，返回同步命令的输出与退出码。
message ExecSyncResponse {
    // Captured command stdout output.
	// The runtime should cap the output of this response to 16MB.
	// If the stdout of the command produces more than 16MB, the remaining output
	// should be discarded, and the command should proceed with no error.
	// See CVE-2022-1708 and CVE-2022-31030 for more information.
  // 捕获的命令标准输出。运行时应将输出上限设为 16MB，超出部分丢弃且命令继续执行、不报错（参见 CVE-2022-1708、CVE-2022-31030）。
    bytes stdout = 1;
    // Captured command stderr output.
	// The runtime should cap the output of this response to 16MB.
	// If the stderr of the command produces more than 16MB, the remaining output
	// should be discarded, and the command should proceed with no error.
	// See CVE-2022-1708 and CVE-2022-31030 for more information.
  // 捕获的命令标准错误。同样限制 16MB，超出部分丢弃且命令继续执行、不报错。
    bytes stderr = 2;
    // Exit code the command finished with. Default: 0 (success).
  // 命令结束时的退出码；默认 0 表示成功。
    int32 exit_code = 3;
}

// ExecRequest 是 Exec RPC 的请求，用于准备流式 exec 端点。
message ExecRequest {
    // ID of the container in which to execute the command.
  // 要在其中执行命令的容器 ID。
    string container_id = 1;
    // Command to execute.
  // 要执行的命令及参数。
    repeated string cmd = 2;
    // Whether to exec the command in a TTY.
  // 是否在 TTY 中执行命令。
    bool tty = 3;
    // Whether to stream stdin.
    // One of `stdin`, `stdout`, and `stderr` MUST be true.
  // 是否流式传输 stdin；stdin/stdout/stderr 三者中至少有一个必须为 true。
    bool stdin = 4;
    // Whether to stream stdout.
    // One of `stdin`, `stdout`, and `stderr` MUST be true.
  // 是否流式传输 stdout；三者中至少有一个为 true。
    bool stdout = 5;
    // Whether to stream stderr.
    // One of `stdin`, `stdout`, and `stderr` MUST be true.
    // If `tty` is true, `stderr` MUST be false. Multiplexing is not supported
    // in this case. The output of stdout and stderr will be combined to a
    // single stream.
  // 是否流式传输 stderr；三者中至少有一个为 true。若 tty=true，则 stderr 必须为 false（不支持多路复用，stdout 与 stderr 会合并为单一流）。
    bool stderr = 6;
}

// ExecResponse 是 Exec RPC 的响应。
message ExecResponse {
    // Fully qualified URL of the exec streaming server.
  // exec 流式服务端的完整 URL。
    string url = 1;
}

// AttachRequest 是 Attach RPC 的请求，用于准备附加到容器的流式端点。
message AttachRequest {
    // ID of the container to which to attach.
  // 要附加到的容器 ID。
    string container_id = 1;
    // Whether to stream stdin.
    // One of `stdin`, `stdout`, and `stderr` MUST be true.
  // 是否流式传输 stdin；stdin/stdout/stderr 三者中至少有一个为 true。
    bool stdin = 2;
    // Whether the process being attached is running in a TTY.
    // This must match the TTY setting in the ContainerConfig.
  // 被附加的进程是否运行在 TTY 中；必须与 ContainerConfig 中的 TTY 设置一致。
    bool tty = 3;
    // Whether to stream stdout.
    // One of `stdin`, `stdout`, and `stderr` MUST be true.
  // 是否流式传输 stdout；三者中至少有一个为 true。
    bool stdout = 4;
    // Whether to stream stderr.
    // One of `stdin`, `stdout`, and `stderr` MUST be true.
    // If `tty` is true, `stderr` MUST be false. Multiplexing is not supported
    // in this case. The output of stdout and stderr will be combined to a
    // single stream.
  // 是否流式传输 stderr；三者中至少有一个为 true。若 tty=true，则 stderr 必须为 false（不支持多路复用，输出合并为单一流）。
    bool stderr = 5;
}

// AttachResponse 是 Attach RPC 的响应。
message AttachResponse {
    // Fully qualified URL of the attach streaming server.
  // attach 流式服务端的完整 URL。
    string url = 1;
}

// PortForwardRequest 是 PortForward RPC 的请求。
message PortForwardRequest {
    // ID of the container to which to forward the port.
  // 要转发端口的 PodSandbox ID（英文注释误写为 container，实际按沙箱 ID 使用）。
    string pod_sandbox_id = 1;
    // Port to forward.
  // 要转发的端口列表。
    repeated int32 port = 2;
}

// PortForwardResponse 是 PortForward RPC 的响应。
message PortForwardResponse {
    // Fully qualified URL of the port-forward streaming server.
  // 端口转发流式服务端的完整 URL。
    string url = 1;
}

// ImageFilter 是镜像列表的过滤条件。
message ImageFilter {
    // Spec of the image.
  // 要匹配的镜像规格。
    ImageSpec image = 1;
}

// ListImagesRequest 是 ListImages RPC 的请求。
message ListImagesRequest {
    // Filter to list images.
  // 镜像列表的过滤条件。
    ImageFilter filter = 1;
}

// Basic information about a container image.
// Image 包含容器镜像的基本信息。
message Image {
    // Reference to the unique identifier of the image on the node, as
    // returned in the image and runtime service apis.
    //
    // This value MUST always match `PullImageResponse.image_ref` when referring
    // to the same image.
  // 镜像在节点上的唯一标识符引用；引用同一镜像时必须与 PullImageResponse.image_ref 一致。
    string id = 1;
    // Other names by which this image is known.
  // 该镜像已知的其他名称（仓库标签）。
    repeated string repo_tags = 2;
    // Digests by which this image is known.
  // 该镜像已知的 digest 列表。
    repeated string repo_digests = 3;
    // Size of the image in bytes. Must be > 0.
  // 镜像大小，单位字节，必须 > 0。
    uint64 size = 4;
    // UID that will run the command(s). This is used as a default if no user is
    // specified when creating the container. UID and the following user name
    // are mutually exclusive.
  // 运行命令时使用的默认 UID；若创建容器时未指定用户则采用此值。UID 与下面的 username 互斥。
    Int64Value uid = 5;
    // User name that will run the command(s). This is used if UID is not set
    // and no user is specified when creating container.
  // 运行命令时使用的默认用户名；当 UID 未设置且创建容器时未指定用户时使用。
    string username = 6;
    // ImageSpec for image which includes annotations
  // 该镜像的 ImageSpec（含 annotations）。
    ImageSpec spec = 7;
    // Recommendation on whether this image should be exempt from garbage collection.
    // It must only be treated as a recommendation -- the client can still request that the image be deleted,
    // and the runtime must oblige.
  // 建议该镜像是否应豁免垃圾回收。仅作为建议：客户端仍可请求删除镜像，运行时必须照办。
    bool pinned = 8;
}

// ListImagesResponse 是 ListImages RPC 的响应。
message ListImagesResponse {
    // List of images.
  // 镜像列表。
    repeated Image images = 1;
}

// StreamImagesRequest 是 StreamImages RPC 的请求。
message StreamImagesRequest {
    // Filter to list images.
  // 镜像列表的过滤条件。
    ImageFilter filter = 1;
}

// StreamImagesResponse 是 StreamImages RPC 流式响应中的一条消息。
message StreamImagesResponse {
    // List of images.
  // 本批返回的镜像列表（至少一项）。
    repeated Image images = 1;
}

// ImageStatusRequest 是 ImageStatus RPC 的请求。
message ImageStatusRequest {
    // Spec of the image.
  // 要查询的镜像规格。
    ImageSpec image = 1;
    // Verbose indicates whether to return extra information about the image.
  // 是否返回额外调试信息。
    bool verbose = 2;
}

// ImageStatusResponse 是 ImageStatus RPC 的响应。
message ImageStatusResponse {
    // Status of the image.
  // 镜像状态（镜像不存在时为 nil）。
    Image image = 1;
    // Info is extra information of the Image. The key could be arbitrary string, and
    // value should be in json format. The information could include anything useful
    // for debug, e.g. image config for oci image based container runtime.
    // It should only be returned non-empty when Verbose is true.
  // 镜像的额外信息，key 任意、value 应为 JSON，可含调试信息（如 OCI 镜像的 config）；仅当 verbose=true 时返回非空。
    map<string, string> info = 2;
}

// AuthConfig contains authorization information for connecting to a registry.
// AuthConfig 包含连接镜像仓库所需的认证信息；标记为 debug_redact 的敏感字段不会被打印。
message AuthConfig {
  // 认证用户名。
    string username = 1;
  // 认证密码（敏感字段，调试输出时会被隐去）。
    string password = 2 [debug_redact = true];
  // 认证字符串（敏感字段，调试输出时会被隐去）。
    string auth = 3 [debug_redact = true];
  // 镜像仓库服务地址。
    string server_address = 4;
    // IdentityToken is used to authenticate the user and get
    // an access token for the registry.
  // 用于对用户进行认证并获取仓库访问令牌的 identity token（敏感字段）。
    string identity_token = 5 [debug_redact = true];
    // RegistryToken is a bearer token to be sent to a registry
  // 发送给仓库的 bearer token（敏感字段）。
    string registry_token = 6 [debug_redact = true];
}

// PullImageRequest 是 PullImage RPC 的请求。
message PullImageRequest {
    // Spec of the image.
  // 要拉取的镜像规格。
    ImageSpec image = 1;
    // Authentication configuration for pulling the image.
  // 拉取镜像时使用的认证配置。
    AuthConfig auth = 2;
    // Config of the PodSandbox, which is used to pull image in PodSandbox context.
  // 沙箱配置，用于在 PodSandbox 上下文中拉取镜像。
    PodSandboxConfig sandbox_config = 3;
}

// PullImageResponse 是 PullImage RPC 的响应。
message PullImageResponse {
    // Reference to the unique identifier of the image on the node, as
    // returned in the image and runtime service apis.
    //
    // When referring to the same image, the container runtime MUST always return
    // the same value for:
    //   - Image.id
    //   - Container.image_id
    //   - ContainerStatus.image_id
    //   - PullImageResponse.image_ref
    //
    // Note: this field has a stricter meaning starting with v1.36.
    // It used to be image ID OR digest, which are different values,
    // and would not necessarily match other ID fields in the Container,
    // ContainerStatus, and Image messages
  // 镜像在节点上的唯一标识符引用。引用同一镜像时，运行时必须在 Image.id、Container.image_id、ContainerStatus.image_id 和 PullImageResponse.image_ref 中返回相同的值。注意：从 v1.36 起该字段语义更严格，此前它可能是 image ID 或 digest（二者不同），不保证与其他 ID 字段匹配。
    string image_ref = 1;
}

// RemoveImageRequest 是 RemoveImage RPC 的请求。
message RemoveImageRequest {
    // Spec of the image to remove.
  // 要删除的镜像规格。
    ImageSpec image = 1;
}

// RemoveImageResponse 是 RemoveImage RPC 的响应，无返回字段。
message RemoveImageResponse {}

// NetworkConfig 描述运行时使用的网络配置。
message NetworkConfig {
    // CIDR to use for pod IP addresses. If the CIDR is empty, runtimes
    // should omit it.
  // 用于分配 Pod IP 的 CIDR；为空时运行时应忽略该字段。
    string pod_cidr = 1;
}

// RuntimeConfig 是运行时配置的顶层结构。
message RuntimeConfig {
  // 网络相关配置。
    NetworkConfig network_config = 1;
}

// UpdateRuntimeConfigRequest 是 UpdateRuntimeConfig RPC 的请求。
message UpdateRuntimeConfigRequest {
  // 要更新的运行时配置。
    RuntimeConfig runtime_config = 1;
}

// UpdateRuntimeConfigResponse 是 UpdateRuntimeConfig RPC 的响应，无返回字段。
message UpdateRuntimeConfigResponse {}

// RuntimeCondition contains condition information for the runtime.
// There are 2 kinds of runtime conditions:
// 1. Required conditions: Conditions are required for kubelet to work
// properly. If any required condition is unmet, the node will be not ready.
// The required conditions include:
//   * RuntimeReady: RuntimeReady means the runtime is up and ready to accept
//   basic containers e.g. container only needs host network.
//   * NetworkReady: NetworkReady means the runtime network is up and ready to
//   accept containers which require container network.
// 2. Optional conditions: Conditions are informative to the user, but kubelet
// will not rely on. Since condition type is an arbitrary string, all conditions
// not required are optional. These conditions will be exposed to users to help
// them understand the status of the system.
// RuntimeCondition 描述运行时的一个条件状态。分为必需条件（RuntimeReady、NetworkReady，不满足则节点 NotReady）与可选条件（仅作信息展示，kubelet 不依赖；类型任意字符串，非必需者皆为可选）。
message RuntimeCondition {
    // Type of runtime condition.
  // 条件类型（如 RuntimeReady、NetworkReady 或自定义类型）。
    string type = 1;
    // Status of the condition, one of true/false. Default: false.
  // 条件状态，true/false；默认 false。
    bool status = 2;
    // Brief CamelCase string containing reason for the condition's last transition.
  // 简短 CamelCase 字符串，说明条件最近一次状态变化的原因。
    string reason = 3;
    // Human-readable message indicating details about last transition.
  // 人类可读的消息，描述最近一次状态变化的详细信息。
    string message = 4;
}

// RuntimeStatus is information about the current status of the runtime.
// RuntimeStatus 描述运行时的当前状态。
message RuntimeStatus {
    // List of current observed runtime conditions.
  // 当前观测到的运行时条件列表。
    repeated RuntimeCondition conditions = 1;
}

// StatusRequest 是 Status RPC 的请求。
message StatusRequest {
    // Verbose indicates whether to return extra information about the runtime.
  // 是否返回额外调试信息（填入响应 info 字段）。
    bool verbose = 1;
}

// RuntimeHandlerFeatures is a set of features implemented by the runtime handler.
// RuntimeHandlerFeatures 描述某个运行时处理器（runtime handler）所支持的可选特性。
message RuntimeHandlerFeatures {
    // recursive_read_only_mounts is set to true if the runtime handler supports
    // recursive read-only mounts.
    // For runc-compatible runtimes, availability of this feature can be detected by checking whether
    // the Linux kernel version is >= 5.12, and,  `runc features | jq .mountOptions` contains "rro".
  // 该运行时处理器是否支持递归只读挂载。对 runc 兼容的运行时，可通过内核版本 >= 5.12 且 runc features 的 mountOptions 包含 "rro" 来判定。
    bool recursive_read_only_mounts = 1;

    // user_namespaces is set to true if the runtime handler supports user namespaces as implemented
    // in Kubernetes. This means support for both, user namespaces and idmap mounts.
  // 该运行时处理器是否支持 Kubernetes 实现中的 user namespace（同时要求支持 user namespace 与 idmap 挂载）。
    bool user_namespaces = 2;
}

// RuntimeHandler 描述一个具名运行时处理器及其支持的特性。
message RuntimeHandler {
    // Name must be unique in StatusResponse.
    // An empty string denotes the default handler.
  // 处理器名称，在 StatusResponse 中必须唯一；空字符串表示默认处理器。
    string name = 1;
    // Supported features.
  // 该处理器支持的特性。
    RuntimeHandlerFeatures features = 2;
}

// RuntimeFeatures describes the set of features implemented by the CRI implementation.
// The features contained in the RuntimeFeatures should depend only on the cri implementation
// independent of runtime handlers.
// RuntimeFeatures 描述 CRI 实现整体支持（与具体运行时处理器无关）的特性集合。
message RuntimeFeatures {
    // supplemental_groups_policy is set to true if the runtime supports SupplementalGroupsPolicy and ContainerUser.
  // 运行时是否支持 SupplementalGroupsPolicy 与 ContainerUser。
    bool supplemental_groups_policy = 1;
    // user_namespaces_host_network is set to true if the runtime supports containers using both
    // host network and user namespace simultaneously.
  // 运行时是否支持容器同时使用 host 网络与 user namespace。
    bool user_namespaces_host_network = 2;
    // mount_options is set to true if the runtime supports additional bind
    // mount options (noexec, nodev, nosuid) on container mounts.
  // 运行时是否支持在容器挂载上使用额外的绑定挂载选项（noexec、nodev、nosuid）。
    bool mount_options = 3;
}

// StatusResponse 是 Status RPC 的响应，包含运行时状态、调试信息、处理器列表与特性。
message StatusResponse {
    // Status of the Runtime.
  // 运行时状态。
    RuntimeStatus status = 1;
    // Info is extra information of the Runtime. The key could be arbitrary string, and
    // value should be in json format. The information could include anything useful for
    // debug, e.g. plugins used by the container runtime.
    // It should only be returned non-empty when Verbose is true.
  // 运行时的额外信息，key 任意、value 应为 JSON，可含调试信息（如运行时使用的插件）；仅当 verbose=true 时返回非空。
    map<string, string> info = 2;
    // Runtime handlers.
  // 运行时处理器列表。
    repeated RuntimeHandler runtime_handlers = 3;
    // features describes the set of features implemented by the CRI implementation.
    // This field is supposed to propagate to NodeFeatures in Kubernetes API.
  // CRI 实现的特性集合，预期会传播到 Kubernetes API 的 NodeFeatures。
    RuntimeFeatures features = 4;
}

// ImageFsInfoRequest 是 ImageFsInfo RPC 的请求，无字段。
message ImageFsInfoRequest {}

// UInt64Value is the wrapper of uint64.
// UInt64Value 是 uint64 的包装类型。
message UInt64Value {
    // The value.
  // uint64 值。
    uint64 value = 1;
}

// FilesystemIdentifier uniquely identify the filesystem.
// FilesystemIdentifier 唯一标识一个文件系统。
message FilesystemIdentifier{
    // Mountpoint of a filesystem.
  // 文件系统的挂载点。
    string mountpoint = 1;
}

// FilesystemUsage provides the filesystem usage information.
// FilesystemUsage 提供文件系统的使用信息。
message FilesystemUsage {
    // Timestamp in nanoseconds at which the information were collected. Must be > 0.
  // 采集该信息的时间戳，单位纳秒，必须 > 0。
    int64 timestamp = 1;
    // The unique identifier of the filesystem.
  // 文件系统的唯一标识符。
    FilesystemIdentifier fs_id = 2;
    // UsedBytes represents the bytes used for images on the filesystem.
    // This may differ from the total bytes used on the filesystem and may not
    // equal CapacityBytes - AvailableBytes.
  // 文件系统上被镜像占用的字节数；可能与文件系统总用量不同，也不一定等于 CapacityBytes - AvailableBytes。
    UInt64Value used_bytes = 3;
    // InodesUsed represents the inodes used by the images.
    // This may not equal InodesCapacity - InodesAvailable because the underlying
    // filesystem may also be used for purposes other than storing images.
  // 镜像占用的 inode 数；可能不等于 InodesCapacity - InodesAvailable，因为底层文件系统可能还用于其他用途。
    UInt64Value inodes_used = 4;
}

// WindowsFilesystemUsage provides the filesystem usage information specific to Windows.
// WindowsFilesystemUsage 提供 Windows 特有的文件系统使用信息。
message WindowsFilesystemUsage {
    // Timestamp in nanoseconds at which the information were collected. Must be > 0.
  // 采集该信息的时间戳，单位纳秒，必须 > 0。
    int64 timestamp = 1;
    // The unique identifier of the filesystem.
  // 文件系统的唯一标识符。
    FilesystemIdentifier fs_id = 2;
    // UsedBytes represents the bytes used for images on the filesystem.
    // This may differ from the total bytes used on the filesystem and may not
    // equal CapacityBytes - AvailableBytes.
  // 文件系统上被镜像占用的字节数；可能与总用量不同，也不一定等于 CapacityBytes - AvailableBytes。
    UInt64Value used_bytes = 3;
}

// ImageFsInfoResponse 是 ImageFsInfo RPC 的响应。
message ImageFsInfoResponse {
    // Information of image filesystem(s).
  // 镜像文件系统信息列表。
    repeated FilesystemUsage image_filesystems = 1;
    // Information of container filesystem(s).
    // This is an optional field, may be used for example if container and image
    // storage are separated.
    // Default will be to return this as empty.
  // 容器文件系统信息列表（可选，例如容器与镜像存储分离时可填），默认返回空。
    repeated FilesystemUsage container_filesystems = 2;
}

// ContainerStatsRequest 是 ContainerStats RPC 的请求。
message ContainerStatsRequest{
    // ID of the container for which to retrieve stats.
  // 要查询统计的容器 ID。
    string container_id = 1;
}

// ContainerStatsResponse 是 ContainerStats RPC 的响应。
message ContainerStatsResponse {
    // Stats of the container.
  // 容器的资源使用统计。
    ContainerStats stats = 1;
}

// ListContainerStatsRequest 是 ListContainerStats RPC 的请求。
message ListContainerStatsRequest{
    // Filter for the list request.
  // 容器列表的过滤条件。
    ContainerStatsFilter filter = 1;
}

// ContainerStatsFilter is used to filter containers.
// All those fields are combined with 'AND'
// ContainerStatsFilter 用于过滤要查询统计的容器，所有字段按 AND 组合。
message ContainerStatsFilter {
    // ID of the container.
  // 容器 ID。
    string id = 1;
    // ID of the PodSandbox.
  // 所属 PodSandbox 的 ID。
    string pod_sandbox_id = 2;
    // LabelSelector to select matches.
    // Only api.MatchLabels is supported for now and the requirements
    // are ANDed. MatchExpressions is not supported yet.
  // 按标签选择匹配项，目前仅支持 api.MatchLabels（AND 关系），不支持 MatchExpressions。
    map<string, string> label_selector = 3;
}

// ListContainerStatsResponse 是 ListContainerStats RPC 的响应。
message ListContainerStatsResponse {
    // Stats of the container.
  // 容器的统计列表。
    repeated ContainerStats stats = 1;
}

// StreamContainerStatsRequest 是 StreamContainerStats RPC 的请求。
message StreamContainerStatsRequest {
    // Filter for the list request.
  // 列表请求的过滤条件。
    ContainerStatsFilter filter = 1;
}

// StreamContainerStatsResponse 是 StreamContainerStats RPC 流式响应中的一条消息。
message StreamContainerStatsResponse {
    // List of container stats.
  // 本批返回的容器统计列表（至少一项）。
    repeated ContainerStats container_stats = 1;
}

// ContainerAttributes provides basic information of the container.
// ContainerAttributes 提供容器的基本标识信息，用于统计数据中关联对象。
message ContainerAttributes {
    // ID of the container.
  // 容器 ID。
    string id = 1;
    // Metadata of the container.
  // 容器元数据。
    ContainerMetadata metadata = 2;
    // Key-value pairs that may be used to scope and select individual resources.
  // 用于圈定和选择资源的标签键值对。
    map<string,string> labels = 3;
    // Unstructured key-value map holding arbitrary metadata.
    // Annotations MUST NOT be altered by the runtime; the value of this field
    // MUST be identical to that of the corresponding ContainerConfig used to
    // instantiate the Container this status represents.
  // 非结构化元数据。运行时不得修改，必须与创建该容器的 ContainerConfig 中的值完全一致。
    map<string,string> annotations = 4;
}

// ContainerStats provides the resource usage statistics for a container.
// ContainerStats 提供容器的资源使用统计。
message ContainerStats {
    // Information of the container.
  // 该容器的基本信息。
    ContainerAttributes attributes = 1;
    // CPU usage gathered from the container.
  // 容器的 CPU 使用统计。
    CpuUsage cpu = 2;
    // Memory usage gathered from the container.
  // 容器的内存使用统计。
    MemoryUsage memory = 3;
    // Usage of the writable layer.
  // 可写层（容器文件系统）的使用情况。
    FilesystemUsage writable_layer = 4;
    // Swap usage gathered from the container.
  // 容器的交换空间使用统计。
    SwapUsage swap = 5;
    // IO usage gathered from the container.
  // 容器的 IO 使用统计（主要用于 PSI）。
    IoUsage io = 6;
}

// WindowsContainerStats provides the resource usage statistics for a container specific for Windows
// WindowsContainerStats 提供 Windows 容器的资源使用统计。
message WindowsContainerStats {
    // Information of the container.
  // 容器的基本信息。
    ContainerAttributes attributes = 1;
    // CPU usage gathered from the container.
  // 容器的 CPU 使用统计（Windows 版）。
    WindowsCpuUsage cpu = 2;
    // Memory usage gathered from the container.
  // 容器的内存使用统计（Windows 版）。
    WindowsMemoryUsage memory = 3;
    // Usage of the writable layer.
  // 可写层的使用情况（Windows 版）。
    WindowsFilesystemUsage writable_layer = 4;
}

// PSI statistics for an individual resource.
// PsiStats 保存单个资源的 PSI（Pressure Stall Information，压力停滞信息）统计，分别统计全部任务与部分任务。
message PsiStats {
	// PSI data for all tasks in the cgroup.
  // cgroup 中所有任务因资源压力而停滞的 PSI 数据。
	PsiData Full = 1;
	// PSI data for some tasks in the cgroup.
  // cgroup 中部分任务因资源压力而停滞的 PSI 数据。
	PsiData Some = 2;
}

// PSI data for an individual resource.
// PsiData 保存 PSI 的具体数值（累计停滞时间与多个时间窗口的平均值）。
message PsiData {
	// Total time duration for tasks in the cgroup have waited due to congestion.
	// Unit: nanoseconds.
  // cgroup 中任务因资源竞争而等待的总时长，单位纳秒。
	uint64 Total = 1;
	// The average (in %) tasks have waited due to congestion over a 10 second window.
  // 最近 10 秒窗口内任务因竞争而等待的平均百分比。
	double Avg10 = 2;
	// The average (in %) tasks have waited due to congestion over a 60 second window.
  // 最近 60 秒窗口内的平均等待百分比。
	double Avg60 = 3;
	// The average (in %) tasks have waited due to congestion over a 300 second window.
  // 最近 300 秒窗口内的平均等待百分比。
	double Avg300 = 4;
}

// CpuUsage provides the CPU usage information.
// CpuUsage 提供 CPU 使用信息。
message CpuUsage {
    // Timestamp in nanoseconds at which the information were collected. Must be > 0.
  // 采集该信息的时间戳，单位纳秒，必须 > 0。
    int64 timestamp = 1;
    // Cumulative CPU usage (sum across all cores) since object creation.
  // 自对象创建以来的累计 CPU 使用量（所有核之和），单位为核心·纳秒。
    UInt64Value usage_core_nano_seconds = 2;
    // Total CPU usage (sum of all cores) averaged over the sample window.
    // The "core" unit can be interpreted as CPU core-nanoseconds per second.
  // 采样窗口内所有核的平均 CPU 使用量，可理解为每秒的核心·纳秒数。
    UInt64Value usage_nano_cores = 3;
    // CPU PSI statistics.
  // CPU 的 PSI 统计。
    PsiStats psi = 4;
}

// WindowsCpuUsage provides the CPU usage information specific to Windows
// WindowsCpuUsage 提供 Windows 特有的 CPU 使用信息。
message WindowsCpuUsage {
    // Timestamp in nanoseconds at which the information were collected. Must be > 0.
  // 采集该信息的时间戳，单位纳秒，必须 > 0。
    int64 timestamp = 1;
    // Cumulative CPU usage (sum across all cores) since object creation.
  // 自对象创建以来的累计 CPU 使用量（所有核之和）。
    UInt64Value usage_core_nano_seconds = 2;
    // Total CPU usage (sum of all cores) averaged over the sample window.
    // The "core" unit can be interpreted as CPU core-nanoseconds per second.
  // 采样窗口内所有核的平均 CPU 使用量。
    UInt64Value usage_nano_cores = 3;
}

// MemoryUsage provides the memory usage information.
// MemoryUsage 提供内存使用信息。
message MemoryUsage {
    // Timestamp in nanoseconds at which the information were collected. Must be > 0.
  // 采集该信息的时间戳，单位纳秒，必须 > 0。
    int64 timestamp = 1;
    // The amount of working set memory in bytes.
  // 工作集内存大小，单位字节。
    UInt64Value working_set_bytes = 2;
    // Available memory for use. This is defined as the memory limit - workingSetBytes.
  // 可用内存 = 内存限制 - workingSetBytes。
    UInt64Value available_bytes = 3;
    // Total memory in use. This includes all memory regardless of when it was accessed.
  // 总使用内存，包含所有内存（不论何时被访问）。
    UInt64Value usage_bytes = 4;
    // The amount of anonymous and swap cache memory (includes transparent hugepages).
  // 匿名页与 swap cache 内存量（含透明大页）。
    UInt64Value rss_bytes = 5;
    // Cumulative number of minor page faults.
  // 累计次要缺页（minor page fault）次数。
    UInt64Value page_faults = 6;
    // Cumulative number of major page faults.
  // 累计主要缺页（major page fault）次数。
    UInt64Value major_page_faults = 7;
    // Memory PSI statistics.
  // 内存的 PSI 统计。
    PsiStats psi = 8;
}

// IoUsage 提供 IO 使用统计（当前主要为 IO 的 PSI 数据）。
message IoUsage {
    // Timestamp in nanoseconds at which the information were collected. Must be > 0.
  // 采集该信息的时间戳，单位纳秒，必须 > 0。
    int64 timestamp = 1;
    // IO PSI statistics.
  // IO 的 PSI 统计。
    PsiStats psi = 2;
}

// SwapUsage 提供交换空间（swap）的使用统计。
message SwapUsage {
    // Timestamp in nanoseconds at which the information were collected. Must be > 0.
  // 采集该信息的时间戳，单位纳秒，必须 > 0。
    int64 timestamp = 1;
    // Available swap for use. This is defined as the swap limit - swapUsageBytes.
  // 可用 swap = swap 限制 - swapUsageBytes。
    UInt64Value swap_available_bytes = 2;
    // Total memory in use. This includes all memory regardless of when it was accessed.
  // 当前使用的 swap 总量。
    UInt64Value swap_usage_bytes = 3;
}

// WindowsMemoryUsage provides the memory usage information specific to Windows
// WindowsMemoryUsage 提供 Windows 特有的内存使用信息。
message WindowsMemoryUsage {
    // Timestamp in nanoseconds at which the information were collected. Must be > 0.
  // 采集该信息的时间戳，单位纳秒，必须 > 0。
    int64 timestamp = 1;
    // The amount of working set memory in bytes.
  // 工作集内存大小，单位字节。
    UInt64Value working_set_bytes = 2;
    // Available memory for use. This is defined as the memory limit - commit_memory_bytes.
  // 可用内存 = 内存限制 - commitMemoryBytes。
    UInt64Value available_bytes = 3;
    // Cumulative number of page faults.
  // 累计缺页次数。
    UInt64Value page_faults = 4;
    // Total commit memory in use. Commit memory is total of physical and virtual memory in use.
  // 已提交的内存总量（物理内存与虚拟内存之和）。
    UInt64Value commit_memory_bytes = 5;
}

// ReopenContainerLogRequest 是 ReopenContainerLog RPC 的请求。
message ReopenContainerLogRequest {
    // ID of the container for which to reopen the log.
  // 要重新打开日志的容器 ID。
    string container_id = 1;
}

// ReopenContainerLogResponse 是 ReopenContainerLog RPC 的响应，无返回字段。
message ReopenContainerLogResponse{
}

// CheckpointContainerRequest 是 CheckpointContainer RPC 的请求。
message CheckpointContainerRequest {
    // ID of the container to be checkpointed.
  // 要创建检查点的容器 ID。
    string container_id = 1;
    // Location of the checkpoint archive used for export
  // 导出的检查点归档文件存放位置。
    string location = 2;
    // Timeout in seconds for the checkpoint to complete.
    // Timeout of zero means to use the CRI default.
    // Timeout > 0 means to use the user specified timeout.
  // 检查点完成的超时时间，单位秒。0 表示使用 CRI 默认值；> 0 表示使用用户指定的超时。
    int64 timeout = 3;
}

// CheckpointContainerResponse 是 CheckpointContainer RPC 的响应，无返回字段。
message CheckpointContainerResponse {}

// CheckpointPodRequest 是 CheckpointPod RPC 的请求。
message CheckpointPodRequest {
    // ID of the pod sandbox to be checkpointed.
  // 要创建检查点的 pod 沙箱 ID。
    string pod_sandbox_id = 1;
    // Absolute path to an existing, empty directory where the runtime must
    // write the checkpoint. The caller owns the directory, makes it writable by
    // the runtime, and should restrict access to the caller and runtime. The
    // runtime must not remove the directory. A Pod checkpoint is a collection
    // of runtime-defined files; their layout and format are opaque to the
    // caller. The runtime must not write outside this directory and must remove
    // partial artifacts before returning an error.
  // 一个已存在的空目录的绝对路径，运行时必须将检查点写入其中。调用方拥有该目录并使其对运行时可写，且应限制访问；运行时不得删除该目录。Pod 检查点是运行时自定义文件的集合，其布局与格式对调用方不透明；运行时不得写入该目录之外，且出错返回前必须清理部分产物。
    string output_path = 2;
    // IDs of the containers to include in the checkpoint. The list must be
    // non-empty, must not contain duplicates, and must contain exactly the
    // running containers selected by the caller. Every container must belong to
    // `pod_sandbox_id` and be running; otherwise the runtime must fail the
    // request without producing a checkpoint.
  // 要纳入检查点的容器 ID 列表。必须非空、无重复，且恰为调用方选定的运行中容器；每个容器都必须属于 pod_sandbox_id 且处于运行状态，否则运行时必须失败且不生成检查点。
    repeated string container_ids = 3;
    // Optional opaque runtime-specific checkpoint options supplied by the CRI
    // caller. Keys are interpreted in the scope of the pod sandbox's runtime
    // handler. Kubernetes does not expose these options in its alpha API and
    // kubelet sends an empty map. Direct CRI callers may set keys documented by
    // the selected runtime. The runtime must reject unsupported or invalid keys
    // and values rather than silently ignore them. Options must not contain
    // secrets.
  // 可选：CRI 调用方提供的运行时特有检查点选项（不透明键值对）。键在沙箱 runtime handler 的范围内解释；Kubernetes alpha API 不暴露这些选项，kubelet 发送空 map。直接 CRI 调用方可设置运行时文档化的键；运行时必须拒绝不支持/无效的键值而非静默忽略；选项中不得包含机密信息。
    map<string, string> options = 4;
}

// Empty: the checkpoint is written under the request's `output_path` directory,
// which the caller provided and already knows, so there is no separate location
// or object name to return.
// CheckpointPodResponse 是 CheckpointPod RPC 的响应，为空：检查点写在调用方提供且已知的 output_path 目录中，无需返回额外位置或对象名。
message CheckpointPodResponse {}

// RestorePodRequest 是 RestorePod RPC 的请求。
message RestorePodRequest {
    // Absolute path to the directory containing the checkpoint data to restore.
    // The runtime must not modify the checkpoint data. The data format and
    // layout are runtime-defined.
  // 包含待恢复检查点数据的目录绝对路径。运行时不得修改检查点数据，其格式与布局由运行时定义。
    string checkpoint_path = 1;
    // Pod sandbox configuration supplied by the kubelet, with node-local restore-time
    // updates (new Pod UID, cgroup parent path, log directory). Pod-spec equality between
    // the live Pod and status.checkpointedPodTemplate of the referenced PodCheckpoint is
    // enforced at API-server admission (and re-checked by the kubelet before this call);
    // arbitrary user overrides are not permitted.
  // kubelet 提供的沙箱配置，含恢复时的节点本地更新（新的 Pod UID、cgroup parent 路径、日志目录）。现网 Pod 与被引用 PodCheckpoint 的 status.checkpointedPodTemplate 之间 pod spec 的一致性由 API server 准入时强制（kubelet 调用前会再次检查），不允许任意用户覆盖。
    PodSandboxConfig config = 2;
    // Runtime handler to use for restoring the pod sandbox and its containers.
    // The handler selects the configured runtime implementation that interprets
    // the runtime-specific checkpoint data. The selected handler must be
    // compatible with the checkpoint; the runtime must reject a checkpoint it
    // cannot restore. An empty value selects the default handler, as for
    // RunPodSandboxRequest. The runtime must reject an unknown non-empty handler.
  // 恢复沙箱及其容器所用的运行时处理器，选择能解释运行时特有检查点数据的实现；所选处理器必须与检查点兼容，运行时必须拒绝无法恢复的检查点。空值选择默认处理器（同 RunPodSandboxRequest），未知的非空处理器必须拒绝。
    string runtime_handler = 3;
    // Optional opaque runtime-specific restore options supplied by the CRI
    // caller. Keys are interpreted in the scope of `runtime_handler`.
    // Kubernetes does not expose these options in its alpha API and kubelet
    // sends an empty map. Direct CRI callers may set keys documented by the
    // selected runtime. The runtime must reject unsupported or invalid keys and
    // values rather than silently ignore them. Options must not contain secrets.
  // 可选：CRI 调用方提供的运行时特有恢复选项（不透明键值对），键在 runtime_handler 范围内解释。Kubernetes alpha API 不暴露，kubelet 发送空 map；运行时必须拒绝不支持/无效的键值而非静默忽略；不得包含机密信息。
    map<string, string> options = 4;
    // Complete restore-time configurations for all containers represented by
    // the checkpoint. The list must be non-empty. Every entry must have a
    // non-empty, unique metadata name, and those names must be the exact set of
    // container names in the checkpoint. The runtime must match containers by
    // metadata name. The checkpoint is authoritative for filesystem and
    // process state. Image, command, args, working directory, environment, and
    // process credentials describe the expected checkpointed process; they
    // must not start or mutate it, and any mismatch the runtime can validate
    // must fail the restore. The runtime applies restore-time settings outside
    // checkpoint-owned process state, including labels, annotations, mounts,
    // devices, Linux resources, logging, and security constraints, and must
    // fail settings incompatible with the checkpoint.
  // 检查点所表示的全部容器在恢复时的完整配置，列表必须非空；每项的 metadata.name 必须非空且唯一，且恰为检查点中的容器名集合。运行时按 metadata.name 匹配容器。检查点对文件系统与进程状态具有权威性；镜像、命令、参数、工作目录、环境与进程凭据仅描述预期被检查点的进程，不得启动或更改它，运行时能校验的不一致必须导致恢复失败。运行时应用检查点不拥有的恢复期设置（标签、注解、挂载、设备、Linux 资源、日志、安全约束等），与检查点不兼容的设置必须失败。
    repeated ContainerConfig container_configs = 5;
}

// RestoredContainer 描述一个被恢复的容器及其运行时 ID。
message RestoredContainer {
    // Name from the restored container's ContainerMetadata. This identifies
    // which requested container configuration produced the runtime ID.
  // 来自恢复后容器 ContainerMetadata 的名称，用于标识是哪个请求的容器配置产生了该运行时 ID。
    string name = 1;
    // Non-empty runtime ID of the restored container.
  // 被恢复容器的非空运行时 ID。
    string container_id = 2;
}

// RestorePodResponse 是 RestorePod RPC 的响应。
message RestorePodResponse {
    // Non-empty ID of the restored pod sandbox.
  // 被恢复 pod 沙箱的非空 ID。
    string pod_sandbox_id = 1;
    // Restored containers in CREATED state, without having executed the
    // restored process (see RestorePod). This must contain exactly one entry
    // for every request.container_configs entry. Names and container IDs
    // must each be non-empty and unique.
  // 处于 CREATED 状态、尚未执行恢复进程的容器列表（见 RestorePod）。请求中每个 container_configs 条目恰对应一项；名称与容器 ID 均须非空且唯一。
    repeated RestoredContainer restored_containers = 2;
}

// GetEventsRequest 是 GetContainerEvents RPC 的请求，无字段。
message GetEventsRequest {}

// ContainerEventResponse 是 GetContainerEvents 流中的一条容器事件。
message ContainerEventResponse {
    // ID of the container
  // 发生事件的容器 ID。
    string container_id = 1;

    // Type of the container event
  // 容器事件类型。
    ContainerEventType container_event_type = 2;

    // Creation timestamp in nanoseconds of this event
  // 该事件的创建时间戳，单位纳秒。
    int64 created_at = 3;

    // Sandbox status
  // 事件发生时沙箱的状态。
    PodSandboxStatus pod_sandbox_status = 4;

    // Container statuses
  // 事件发生时容器内各容器的状态列表。
    repeated ContainerStatus containers_statuses = 5;
}

// ContainerEventType 枚举定义容器生命周期事件的类型。
enum ContainerEventType {
    // Container created
  // 容器已创建事件。
    CONTAINER_CREATED_EVENT = 0;

    // Container started
  // 容器已启动事件。
    CONTAINER_STARTED_EVENT = 1;

    // Container stopped
  // 容器已停止事件。
    CONTAINER_STOPPED_EVENT = 2;

    // Container deleted
  // 容器已删除事件。
    CONTAINER_DELETED_EVENT = 3;
}

// ListMetricDescriptorsRequest 是 ListMetricDescriptors RPC 的请求，无字段。
message ListMetricDescriptorsRequest {}

// ListMetricDescriptorsResponse 是 ListMetricDescriptors RPC 的响应。
message ListMetricDescriptorsResponse {
  // 指标描述符列表。
    repeated MetricDescriptor descriptors = 1;
}

// MetricDescriptor 描述一个指标的名称、帮助文本与标签键集合。
message MetricDescriptor {
    // The name field will be used as a unique identifier of this MetricDescriptor,
    // and be used in conjunction with the Metric structure to populate the full Metric.
  // 指标名称，作为该描述符的唯一标识，并与 Metric 结构一起用于填充完整指标。
    string name = 1;
  // 指标的帮助/说明文本。
    string help = 2;
    // When a metric uses this metric descriptor, it should only define
    // labels that have previously been declared in label_keys.
    // It is the responsibility of the runtime to correctly keep sorted the keys and values.
    // If the two slices have different length, the behavior is undefined.
  // 使用该描述符的指标只能定义这里声明过的标签键。运行时负责保持键值有序；若两个切片长度不同，行为未定义。
    repeated string label_keys = 3;
}

// ListPodSandboxMetricsRequest 是 ListPodSandboxMetrics RPC 的请求，无字段。
message ListPodSandboxMetricsRequest {}

// ListPodSandboxMetricsResponse 是 ListPodSandboxMetrics RPC 的响应。
message ListPodSandboxMetricsResponse {
  // 各 pod 沙箱的指标列表。
    repeated PodSandboxMetrics pod_metrics = 1;
}

// StreamPodSandboxMetricsRequest 是 StreamPodSandboxMetrics RPC 的请求，无字段。
message StreamPodSandboxMetricsRequest {}

// StreamPodSandboxMetricsResponse 是 StreamPodSandboxMetrics RPC 流式响应中的一条消息。
message StreamPodSandboxMetricsResponse {
    // List of pod sandbox metrics.
  // 本批返回的 pod 沙箱指标列表（至少一项）。
    repeated PodSandboxMetrics pod_sandbox_metrics = 1;
}

// PodSandboxMetrics 保存单个 pod 沙箱及其容器的指标。
message PodSandboxMetrics {
  // 该沙箱的 ID。
    string pod_sandbox_id = 1;
  // 沙箱级别的指标列表。
    repeated Metric metrics = 2;
  // 沙箱内各容器的指标列表。
    repeated ContainerMetrics container_metrics = 3;
}

// ContainerMetrics 保存单个容器的指标。
message ContainerMetrics {
  // 容器 ID。
    string container_id = 1;
  // 该容器的指标列表。
    repeated Metric metrics = 2;
}

// Metric 表示一个具体的指标采样值。
message Metric {
    // Name must match a name previously returned in a MetricDescriptors call,
    // otherwise, it will be ignored.
  // 指标名称，必须匹配此前 MetricDescriptors 调用返回的名称，否则该指标会被忽略。
    string name = 1;
    // Timestamp should be 0 if the metric was gathered live.
    // If it was cached, the Timestamp should reflect the time in nanoseconds it was collected.
  // 若指标为实时采集则应为 0；若为缓存值，则应为采集时的纳秒时间戳。
    int64 timestamp = 2;
  // 指标类型（counter 或 gauge）。
    MetricType metric_type = 3;
    // The corresponding LabelValues to the LabelKeys defined in the MetricDescriptor.
    // It is the responsibility of the runtime to correctly keep sorted the keys and values.
    // If the two slices have different length, the behavior is undefined.
  // 与 MetricDescriptor 中 label_keys 对应的标签值。运行时负责保持键值有序；两个切片长度不同时行为未定义。
    repeated string label_values = 4;
  // 指标的值。
    UInt64Value value = 5;
}

// MetricType 枚举定义指标的类型。
enum MetricType {
  // 计数器类型（只增不减的累计值）。
    COUNTER = 0;
  // 仪表类型（可增可减的瞬时值）。
    GAUGE = 1;
}

// RuntimeConfigRequest 是 RuntimeConfig RPC 的请求，无字段。
message RuntimeConfigRequest {}

// RuntimeConfigResponse 是 RuntimeConfig RPC 的响应。
message RuntimeConfigResponse {
    // Configuration information for Linux-based runtimes. This field contains
    // global runtime configuration options that are not specific to runtime
    // handlers.
  // 基于 Linux 的运行时的配置信息，包含不特定于具体 runtime handler 的全局选项。
    LinuxRuntimeConfiguration linux = 1;
}

// LinuxRuntimeConfiguration 保存 Linux 运行时的全局配置。
message LinuxRuntimeConfiguration {
    // Cgroup driver to use
    // Note: this field should not change for the lifecycle of the Kubelet,
    // or while there are running containers.
    // The Kubelet will not re-request this after startup, and will construct the cgroup
    // hierarchy assuming it is static.
    // If the runtime wishes to change this value, it must be accompanied by removal of
    // all pods, and a restart of the Kubelet. The easiest way to do this is with a full node reboot.
  // 要使用的 cgroup 驱动。注意：该字段在 kubelet 生命周期内、或存在运行中容器时不应改变。kubelet 启动时获取一次后不再请求，并按静态值构造 cgroup 层级。若运行时希望更改，必须同时移除所有 pod 并重启 kubelet（最简单的方式是重启整个节点）。
    CgroupDriver cgroup_driver = 1;
}

// CgroupDriver 枚举定义 Linux 使用的 cgroup 驱动类型。
enum CgroupDriver {
  // systemd cgroup 驱动。
    SYSTEMD = 0;
  // cgroupfs cgroup 驱动。
    CGROUPFS = 1;
}

// UpdatePodSandboxResourcesRequest 是 UpdatePodSandboxResources RPC 的请求。
message UpdatePodSandboxResourcesRequest {
    // ID of the PodSandbox to update.
  // 要更新资源的 PodSandbox ID。
    string pod_sandbox_id = 1;

    // Optional overhead represents the overheads associated with this sandbox
  // 可选：与该沙箱关联的开销资源。
    LinuxContainerResources overhead = 2;
    // Optional resources represents the sum of container resources for this sandbox
  // 可选：该沙箱所有容器资源的总和。
    LinuxContainerResources resources = 3;
}

// UpdatePodSandboxResourcesResponse 是 UpdatePodSandboxResources RPC 的响应，无返回字段。
message UpdatePodSandboxResourcesResponse {}
