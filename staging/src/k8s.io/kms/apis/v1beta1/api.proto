// To regenerate api.pb.go run `hack/update-codegen.sh protobindings`
syntax = "proto3";

package v1beta1;
option go_package = "k8s.io/kms/apis/v1beta1";
option deprecated = true;

// KeyManagementService 定义远程 KMS 提供者对外的 gRPC 服务（KMS v1，已弃用）。
service KeyManagementService {
    // Version RPC：返回 KMS 提供者的名称与版本，apiserver 用它做版本兼容检查。
    rpc Version(VersionRequest) returns (VersionResponse) {}

    // Decrypt RPC：在 KMS 提供者中执行解密操作。
    rpc Decrypt(DecryptRequest) returns (DecryptResponse) {}
    // Encrypt RPC：在 KMS 提供者中执行加密操作。
    rpc Encrypt(EncryptRequest) returns (EncryptResponse) {}
}

// Deprecated: KMSv1 自 v1.28 起已弃用，后续仅接收安全更新；请改用 KMSv2。
// VersionRequest 是版本探测请求，携带 KMS 插件 API 版本。
message VersionRequest {
    // version 是 KMS 插件 API 的版本字符串。
    string version = 1;
}

// Deprecated: KMSv1 自 v1.28 起已弃用，后续仅接收安全更新；请改用 KMSv2。
// VersionResponse 是版本探测响应，包含 API 版本与提供者自身的运行时信息。
message VersionResponse {
    // version 是 KMS 插件 API 版本。
    string version = 1;
    // runtime_name 是 KMS 提供者的名称。
    string runtime_name = 2;
    // runtime_version 是提供者自身版本，必须符合语义化版本（semver）规范。
    string runtime_version = 3;
}

// Deprecated: KMSv1 自 v1.28 起已弃用，后续仅接收安全更新；请改用 KMSv2。
// DecryptRequest 是解密请求：指定 API 版本并给出待解密密文。
message DecryptRequest {
    // version 是 KMS 插件 API 版本。
    string version = 1;
    // cipher 是待解密的密文字节。
    bytes cipher = 2;
}

// Deprecated: KMSv1 自 v1.28 起已弃用，后续仅接收安全更新；请改用 KMSv2。
// DecryptResponse 是解密响应，包含还原后的明文。
message DecryptResponse {
    // plain 是解密得到的明文字节。
    bytes plain = 1;
}

// Deprecated: KMSv1 自 v1.28 起已弃用，后续仅接收安全更新；请改用 KMSv2。
// EncryptRequest 是加密请求：指定 API 版本并给出待加密明文。
message EncryptRequest {
    // version 是 KMS 插件 API 版本。
    string version = 1;
    // plain 是待加密的明文字节。
    bytes plain = 2;
}

// Deprecated: KMSv1 自 v1.28 起已弃用，后续仅接收安全更新；请改用 KMSv2。
// EncryptResponse 是加密响应，包含密文。
message EncryptResponse {
    // cipher 是加密后的密文字节。
    bytes cipher = 1;
}
