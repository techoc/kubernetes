// To regenerate api.pb.go run `hack/update-codegen.sh protobindings`
syntax = "proto3";

package v2;
option go_package = "k8s.io/kms/apis/v2";

// KeyManagementService 定义 KMS v2 提供者对外的 gRPC 服务。
service KeyManagementService {
    // Status RPC：供 apiserver 定期轮询，获取插件健康状态与当前写入密钥。
    rpc Status(StatusRequest) returns (StatusResponse) {}

    // Decrypt RPC：在 KMS 提供者中执行解密操作。
    rpc Decrypt(DecryptRequest) returns (DecryptResponse) {}
    // Encrypt RPC：在 KMS 提供者中执行加密操作。
    rpc Encrypt(EncryptRequest) returns (EncryptResponse) {}
}

// StatusRequest 是状态查询请求，当前为空消息（无需参数）。
message StatusRequest {}

// StatusResponse 返回插件的版本、健康状态与当前写入密钥，用于判断数据是否过期。
message StatusResponse {
    // version 是 KMS gRPC API 版本，必须为 v2 或 v2beta1（推荐 v2，二者等价）。
    string version = 1;
    // healthz 为 "ok" 表示健康；其他值均视为健康检查失败，并会出现在 apiserver 的 healthz 错误信息中。
    string healthz = 2;
    // key_id 是当前写入密钥，用于判断经 TransformFromStorage 更新（重写）的数据是否已过期。
    // 约束：非空，且大小小于 1 kB。
    string key_id = 3;
}

// DecryptRequest 是解密请求：携带密文、请求 UID、加密时的 key ID 与 annotations。
message DecryptRequest {
    // ciphertext 是待解密的密文。
    bytes ciphertext = 1;
    // uid 是请求唯一标识，便于插件侧追踪与幂等处理。
    string uid = 2;
    // key_id 是加密时返回给 apiserver 的密钥标识，即实际用于加密数据的 KMS KEK。
    string key_id = 3;
    // annotations 是加密时由插件附带并随密文一起存储的元数据。
    map<string, bytes> annotations = 4;
}

// DecryptResponse 是解密响应，包含还原后的明文。
message DecryptResponse {
    // plaintext 是解密得到的明文字节。
    bytes plaintext = 1;
}

// EncryptRequest 是加密请求：携带待加密明文与请求 UID。
message EncryptRequest {
    // plaintext 是待加密的明文字节。
    bytes plaintext = 1;
    // uid 是请求唯一标识。
    string uid = 2;
}

// EncryptResponse 是加密响应，包含密文、key ID 与随密文存储的 annotations。
message EncryptResponse {
    // ciphertext 是加密后的密文，约束：非空且小于 1 kB。
    bytes ciphertext = 1;
    // key_id 是加密使用的 KMS KEK 标识（不能是本地 KEK），可用于判断经 TransformFromStorage 更新（重写）的数据是否过期。
    // 约束：非空且小于 1 kB。
    string key_id = 2;
    // annotations 是随密文存储的附加元数据，在 etcd 中以明文保存，
    // 因此敏感数据必须由插件自行预先加密。
    // 约束：key 必须是符合 RFC 1123 的完全限定域名；所有 key+value 总大小小于 32 kB。
    map<string, bytes> annotations = 3;
}
