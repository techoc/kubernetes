// To regenerate api.pb.go run `hack/update-codegen.sh protobindings`
syntax = "proto3";

package v1beta1;
option go_package = "k8s.io/kubelet/pkg/apis/deviceplugin/v1beta1";

// Registration 是 Kubelet 对外提供的服务。
// 只有 Kubelet 对 Register 请求返回成功码后，设备插件才能启动其服务。
// 如果 Kubelet 不支持设备插件版本，或已注册的 resourceName 已被另一个
// 活跃设备插件占用，注册可能失败。注册失败时，设备插件应退出。
service Registration {
	rpc Register(RegisterRequest) returns (Empty) {}
}

message DevicePluginOptions {
	// 指示是否需要在每次启动容器前调用 PreStartContainer。
	bool pre_start_required = 1;
	// 指示是否已实现 GetPreferredAllocation 并可调用。
	bool get_preferred_allocation_available = 2;
}

message RegisterRequest {
	// 设备插件构建所依据的 API 版本。
	string version = 1;
	// 设备插件监听的 Unix 套接字名称。
	// PATH = path.Join(DevicePluginPath, endpoint)
	string endpoint = 2;
	// 可调度资源名称，目前应为 DNS 标签。
	string resource_name = 3;
	// 需要与设备管理器通信的选项。
	DevicePluginOptions options = 4;
}

message Empty {
}

// DevicePlugin 是设备插件对外提供的服务。
service DevicePlugin {
	// GetDevicePluginOptions 返回需要与设备管理器通信的选项。
	rpc GetDevicePluginOptions(Empty) returns (DevicePluginOptions) {}

	// ListAndWatch 返回设备列表流。
	// 每当设备状态变化或设备消失时，ListAndWatch 都会返回新列表。
	rpc ListAndWatch(Empty) returns (stream ListAndWatchResponse) {}

	// GetPreferredAllocation 从可用设备列表中返回一组优先分配的设备。
	// 返回的优先分配不保证成为设备管理器最终执行的分配结果，
	// 仅用于帮助设备管理器在可能时做出更合理的分配决策。
	rpc GetPreferredAllocation(PreferredAllocationRequest) returns (PreferredAllocationResponse) {}

	// Allocate 在创建容器时调用，使设备插件可以执行设备相关操作，
	// 并告知 Kubelet 如何使设备在容器中可用。
	rpc Allocate(AllocateRequest) returns (AllocateResponse) {}

	// 如果设备插件在注册阶段提出要求，PreStartContainer 会在每次启动容器前调用。
	// 设备插件可以执行设备相关操作，例如在使设备可供容器使用前重置设备。
	rpc PreStartContainer(PreStartContainerRequest) returns (PreStartContainerResponse) {}
}

// ListAndWatch 返回设备列表流。
// 每当设备状态变化或设备消失时，ListAndWatch 都会返回新列表。
message ListAndWatchResponse {
	repeated Device devices = 1;
}

message TopologyInfo {
	repeated NUMANode nodes = 1;
}

message NUMANode {
	int64 ID = 1;
}

/* E.g:
* struct Device {
*    ID: "GPU-fef8089b-4820-abfc-e83e-94318197576e",
*    Health: "Healthy",
*    Topology:
*      Node:
*        ID: 1
*} */
message Device {
	// 设备插件分配的唯一 ID，用于通信期间标识设备。
	// 此字段最大长度为 63 个字符。
	string ID = 1;
	// 设备健康状态，可以是健康或不健康，参见 constants.go。
	string health = 2;
	// 设备的拓扑信息。
	TopologyInfo topology = 3;
}

// - 如果插件在注册阶段提出要求，PreStartContainer 应在每次启动容器前调用。
// - PreStartContainer 允许 Kubelet 将重新初始化的设备传递给容器。
// - PreStartContainer 允许设备插件对所请求的设备执行设备相关操作。
message PreStartContainerRequest {
	repeated string devices_ids = 1;
}

// PreStartContainerResponse 由插件响应 PreStartContainerRequest 时发送。
message PreStartContainerResponse {
}

// PreferredAllocationRequest 在 Pod 准入时通过 GetPreferredAllocation() 调用传入。
// 设备插件应从 available_deviceIDs 列表中选出大小为 allocation_size 的优先分配，
// 并确保包含 must_include_deviceIDs 中列出的设备。
message PreferredAllocationRequest {
	repeated ContainerPreferredAllocationRequest container_requests = 1;
}

message ContainerPreferredAllocationRequest {
	// 可供选择优先分配的可用 deviceIDs 列表。
	repeated string available_deviceIDs = 1;
	// 优先分配中必须包含的 deviceIDs 列表。
	repeated string must_include_deviceIDs = 2;
	// 优先分配中包含的设备数量。
	int32 allocation_size = 3;
}

// PreferredAllocationResponse 返回由 PreferredAllocationRequest 产生的优先分配结果。
message PreferredAllocationResponse {
	repeated ContainerPreferredAllocationResponse container_responses = 1;
}

message ContainerPreferredAllocationResponse {
	repeated string deviceIDs = 1;
}

// - Allocate 应在创建 Pod 时调用，因为任一容器的分配失败都会导致 Pod 启动失败。
// - Allocate 允许 Kubelet 按插件指示在 Pod 环境中提供额外制品。
// - Allocate 允许设备插件对所请求的设备执行设备相关操作。
message AllocateRequest {
	repeated ContainerAllocateRequest container_requests = 1;
}

message ContainerAllocateRequest {
	repeated string devices_ids = 1;
}

// CDIDevice 描述 CDI 设备信息。
message CDIDevice {
	// 完全限定的 CDI 设备名称。
	// 例如：vendor.com/gpu=gpudevice1
	// 更多详情参见 CDI 规范：
	// https://github.com/container-orchestrated-devices/container-device-interface/blob/main/SPEC.md
	string name = 1;
}

// AllocateResponse 包含需要注入容器的制品，用于访问 AllocateRequest
// 中指定的 deviceIDs。
// 失败处理：
// 如果 Kubelet 发送 dev1 和 dev2 的分配请求，dev1 分配成功而 dev2 失败，
// 设备插件应发送 ListAndWatch 更新并使分配请求失败。
message AllocateResponse {
	repeated ContainerAllocateResponse container_responses = 1;
}

message ContainerAllocateResponse {
	// 需要在容器中设置的环境变量列表，用于访问一个或多个设备。
	map<string, string> envs = 1;
	// 容器的挂载项。
	repeated Mount mounts = 2;
	// 容器的设备。
	repeated DeviceSpec devices = 3;
	// 需要传递给容器运行时的容器注解。
	map<string, string> annotations = 4;
	// 容器的 CDI 设备。
	repeated CDIDevice cdi_devices = 5;
}

// Mount 指定要挂载到容器中的主机卷。
// 用于向容器提供主机上安装的设备库或工具。
message Mount {
	// 挂载点在容器内的路径。
	string container_path = 1;
	// 挂载点在主机上的路径。
	string host_path = 2;
	// 设置后，挂载为只读。
	bool read_only = 3;
}

// DeviceSpec 指定要挂载到容器中的主机设备。
message DeviceSpec {
	// 设备在容器内的路径。
	string container_path = 1;
	// 设备在主机上的路径。
	string host_path = 2;
	// 设备的 cgroup 权限，可取以下一项或多项：
	// * r：允许容器读取指定设备。
	// * w：允许容器写入指定设备。
	// * m：允许容器创建尚不存在的设备文件。
	string permissions = 3;
}
