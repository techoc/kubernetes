syntax = "proto3";
package v1alpha1;

option go_package = "k8s.io/kubelet/pkg/apis/pods/v1alpha1";

service Pods {
    // WatchPods 最初会为每个现有 Pod 返回一个 ADDED WatchPodsEvent，
    // 随后返回一个 INITIAL_SYNC_COMPLETE WatchPodsEvent。
    // 此后每当 Pod 被创建、删除或更新时，都会返回一个 WatchPodsEvent。
    rpc WatchPods(WatchPodsRequest) returns (stream WatchPodsEvent) {}

    // ListPods 返回 Pod 列表。
    rpc ListPods(ListPodsRequest) returns (ListPodsResponse) {}

    // GetPod 返回具有给定 Pod UID 的 Pod。
    rpc GetPod(GetPodRequest) returns (GetPodResponse) {}
}

enum EventType {
    UNSPECIFIED = 0;
    ADDED = 1;
    MODIFIED = 2;
    DELETED = 3;
    INITIAL_SYNC_COMPLETE = 4;
}


// Watch 流中的每次更新都会发送此消息。
// Pod 字节通过调用 v1.Pod#Marshal() 生成，可通过调用 v1.Pod#Unmarshal() 转换为 Pod。
message WatchPodsEvent {
    // ADDED、MODIFIED、DELETED 或 INITIAL_SYNC_COMPLETE。
    EventType type = 1;
    // INITIAL_SYNC_COMPLETE 时 pod 为 nil。
    // 对于 DELETED 事件，仅保证设置 Pod 名称、命名空间和 UID。
    bytes pod = 2;
}

// ListPodsResponse 返回 Pod 列表。
// Pod 字节通过调用 v1.Pod#Marshal() 生成，可通过调用 v1.Pod#Unmarshal() 转换为 Pod。
message ListPodsResponse {
    repeated bytes pods = 1;
}

// GetPodResponse 返回一个 Pod。
// Pod 字节通过调用 v1.Pod#Marshal() 生成，可通过调用 v1.Pod#Unmarshal() 转换为 Pod。
message GetPodResponse {
    bytes pod = 1;
}



message WatchPodsRequest {}

message ListPodsRequest {}

message GetPodRequest {
    string podUID = 1;
}
