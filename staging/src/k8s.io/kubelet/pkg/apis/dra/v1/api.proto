// To regenerate api.pb.go run `hack/update-codegen.sh protobindings`

syntax = "proto3";

package k8s.io.kubelet.pkg.apis.dra.v1;
option go_package = "k8s.io/kubelet/pkg/apis/dra/v1";

service DRAPlugin {
  // NodePrepareResources 准备若干 ResourceClaim，以供节点使用。
  // 如果返回错误，响应会被忽略；各个 Claim 的失败可在
  // NodePrepareResourcesResponse 中报告。
  rpc NodePrepareResources (NodePrepareResourcesRequest)
    returns (NodePrepareResourcesResponse) {}

  // NodeUnprepareResources 执行与 NodePrepareResources 相反的操作，
  // 并遵循相同的错误处理规则。
  rpc NodeUnprepareResources (NodeUnprepareResourcesRequest)
    returns (NodeUnprepareResourcesResponse) {}
}

message NodePrepareResourcesRequest {
     // 需要准备的 ResourceClaim 列表。
     repeated Claim claims = 1;
}

message NodePrepareResourcesResponse {
    // 已准备或已尝试准备的 ResourceClaim，以 claim_uid 为键。
    //
    // 如果 NodePrepareResourcesRequest 中列出的某个 Claim 未被准备，则属于错误。
    // 对于缺失的条目，会再次调用 NodePrepareResources。
    map<string, NodePrepareResourceResponse> claims = 1;
}

message NodePrepareResourceResponse {
    // Kubelet 必须通过容器运行时提供这些额外设备。
    // 一个 Claim 可以包含零个或多个请求，每个请求可以包含零个或多个设备。
    repeated Device devices = 1;
    // 非空表示准备 ResourceClaim 失败，此时忽略设备信息。
    string error = 2;
}

message Device {
    // 此设备关联的 Claim 中的请求。
    // 可选；为空时表示此设备关联所有请求。
    repeated string request_names = 1;

    // 包含此设备的资源池，必填。
    string pool_name = 2;

    // 设备本身，必填。
    string device_name = 3;

    // 单个设备实例可以映射到多个 CDI 设备 ID，也可以不映射。
    repeated string cdi_device_ids = 4;

    // 设备的共享 ID，可选。
    optional string share_id = 5;
}

message NodeUnprepareResourcesRequest {
    // 需要撤销准备的 ResourceClaim 列表。
    repeated Claim claims = 1;
}

message NodeUnprepareResourcesResponse {
    // 已撤销准备的 ResourceClaim，遵循 NodePrepareResourcesResponse.claims 的相同规则。
    // 特别是，请求中的所有 Claim 都必须在响应中有对应条目，即使该条目为 nil。
    map<string, NodeUnprepareResourceResponse> claims = 1;
}

message NodeUnprepareResourceResponse {
    // 非空表示撤销 ResourceClaim 的准备失败。
    string error = 1;
}

message Claim {
    // ResourceClaim 命名空间（ResourceClaim.meta.Namespace），必填。
    string namespace = 1;
    // ResourceClaim 的 UID（ResourceClaim.meta.UUID），必填。
    string uid = 2;
    // ResourceClaim 的名称（ResourceClaim.meta.Name），必填。
    string name = 3;
}
